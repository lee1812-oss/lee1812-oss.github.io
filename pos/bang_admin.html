<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>방송실 화면 관리</title>
<meta name="theme-color" content="#5A3A22">
<link rel="icon" href="bang-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F2F0;color:#1E1A17;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:18px;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
header{background:#5A3A22;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:24px;flex:1;min-width:220px}
header small{font-size:.66em;font-weight:700;white-space:nowrap}
header button{min-height:46px;border:2px solid #fff;background:transparent;color:#fff;border-radius:10px;font-size:17px;font-weight:700;padding:0 14px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
.box{background:#fff;border:1px solid #D9D6D2;border-radius:16px;padding:18px;margin-bottom:14px}
h2{font-size:21px;margin:0 0 10px;color:#3B2416}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.sum div{background:#fff;border:1px solid #D9D6D2;border-radius:16px;padding:14px;text-align:center}
.sum b{display:block;font-size:40px;color:#1E1A17}.sum span{font-size:17px;font-weight:700;color:#3B332D}
.dev{border-top:1px solid #E6E2DD;padding:14px 0;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.dev:first-child{border-top:0}
.dev .b{flex:1;min-width:260px}
.dev .n{font-size:24px;font-weight:900}
.dev .i{font-size:17px;color:#3B332D;margin-top:5px;line-height:1.5}
.tag{display:inline-block;font-size:16px;font-weight:800;padding:3px 10px;border-radius:14px;background:#5A3A22;color:#fff;margin-left:6px;white-space:nowrap}
.tag.g{background:#22396F}.tag.w{background:#B45309}
.st{display:inline-block;font-size:16px;font-weight:800;padding:3px 10px;border-radius:14px;white-space:nowrap}
.on{background:#E3F4EA;color:#14532D}.off{background:#EDEBE8;color:#3B332D}.warn{background:#FFF1DC;color:#7A3E00}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:54px;border:0;border-radius:12px;font-size:18px;font-weight:800;padding:0 18px;cursor:pointer}
.b1{background:#22396F;color:#fff}.b2{background:#EFE6DA;color:#3B2716;border:2px solid #C9B7A2}.b3{background:#fff;color:#B42318;border:2px solid #B42318}.b4{background:#1E7B45;color:#fff}
input.in{width:100%;height:56px;border:2px solid #C9B7A2;border-radius:12px;padding:0 14px;font-size:22px;font-weight:700}
.gps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.gps button{min-height:50px;padding:0 16px;font-size:18px;font-weight:800;border:2px solid #C9B7A2;background:#FBF8F4;border-radius:12px;cursor:pointer}
.gps button.sel{background:#1E7B45;border-color:#1E7B45;color:#fff}
.edit{width:100%;background:#FBF8F4;border:1px solid #E6E2DD;border-radius:12px;padding:12px;margin-top:8px}
.msg{font-weight:800;min-height:26px;margin-top:8px}.msg.err{color:#B42318}.msg.ok{color:#1E7B45}
.help li{margin:6px 0;line-height:1.5}
code{background:#EFE6DA;padding:1px 6px;border-radius:6px;font-size:17px}
@media (max-width:600px){.sum b{font-size:30px}.sum span{font-size:15px}header h1{font-size:20px}}
</style></head><body>
<header><h1>🏷 방송실 화면 관리 <small>v001 · 11/12 16:29</small></h1><button id="btnRe" style="display:none">새로 보기</button><button id="btnOut" style="display:none">이 기기에서 잊기</button></header>
<main id="app"></main>
<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbxoQ4OCTBGw06Z6ttoSHiEnLt__WQ5NL-As1t66U9vQVH-tGOl_kDMYfUuod9ouU1QFOQ/exec';
  var pin = localStorage.getItem('bang_send_pin') || '', data = null, editId = '', timer = 0;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function call(o) { o.pin = pin; return fetch(API, { method: 'POST', body: JSON.stringify(o) }).then(function (r) { return r.json(); }); }
  function when(t) { if (!t) return '기록 없음'; var d = new Date(t), s = Math.floor((Date.now() - t) / 1000); var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전 (' + hm + ')'; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm; }
  function live(t) { return t && Date.now() - t < 5 * 60000; }
  function login(err) {
    $('btnOut').style.display = 'none'; $('btnRe').style.display = 'none';
    $('app').innerHTML = '<div class="box" style="max-width:520px;margin:40px auto"><h2>보내기 번호를 넣어 주세요</h2><p style="line-height:1.5">방송 보내는 번호로만 열려요. 이 기기가 기억해요.</p>' +
      '<input class="in" id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="보내기 번호"><div style="margin-top:12px"><button class="btn b1" id="go" style="width:100%">열기</button></div><div class="msg err" id="lerr">' + (err || '') + '</div></div>';
    var go = function () { pin = $('pin').value.trim(); $('lerr').textContent = '확인 중…'; call({ op: 'devs' }).then(function (r) { if (r.ok) { localStorage.setItem('bang_send_pin', pin); data = r; view(); } else { pin = ''; $('lerr').textContent = r.err === 'locked' ? '여러 번 틀려서 15분 동안 잠겼어요.' : '번호가 맞지 않아요.'; } }).catch(function () { $('lerr').textContent = '인터넷 연결을 확인해 주세요.'; }); };
    $('go').onclick = go; $('pin').onkeydown = function (e) { if (e.key === 'Enter') go(); }; $('pin').focus();
  }
  function load() { return call({ op: 'devs' }).then(function (r) { if (!r.ok) { if (r.err === 'pin' || r.err === 'role') { localStorage.removeItem('bang_send_pin'); pin = ''; login('번호가 바뀌었어요. 다시 넣어 주세요.'); } return; } data = r; if (!editId) view(); }).catch(function () { }); }
  function view() {
    $('btnOut').style.display = ''; $('btnRe').style.display = '';
    var L = data.list || [], on = L.filter(function (d) { return live(d.seen); }).length, un = L.filter(function (d) { return d.name === '이름 미등록'; }).length;
    var h = '<div class="sum"><div><b>' + L.length + '</b><span>등록된 화면</span></div><div><b>' + on + '</b><span>지금 켜진 화면</span></div><div><b' + (un ? ' style="color:#B45309"' : '') + '>' + un + '</b><span>이름 미등록</span></div></div>';
    h += '<div class="box"><h2>등록된 화면</h2>' + (L.length ? L.map(row).join('') : '<p>아직 등록된 화면이 없어요. 받는 화면(bang.html)에서 받는 번호를 넣으면 여기에 생겨요.</p>') + '</div>';
    var lg = data.legacy;
    h += '<div class="box"><h2>옛 방식 화면 · 받는 번호</h2><ol class="help">' +
      '<li>옛 버전(번호만 쓰는) 화면: ' + (lg && live(lg.t) ? '<span class="st warn">[확인 필요] 아직 연결 중 · ' + when(lg.t) + '</span> 새 버전으로 바뀌면 저절로 「이름 미등록」으로 등록돼요.' : '<span class="st on">[완료] 지금은 없어요</span>' + (lg ? ' (마지막 ' + when(lg.t) + ')' : '')) + '</li>' +
      '<li>옛 받는 번호: ' + (data.oldPin === 'on' ? '<span class="st warn">[사용 중] 새 화면 등록에도 쓸 수 있어요</span>' : data.oldPin === 'off' ? '<span class="st on">[꺼짐] 생산실 라벨 프린터 출력에만 쓰여요</span>' : '<span class="st off">없음</span>') + '</li></ol>' +
      (data.oldPin === 'on' ? '<button class="btn b2" id="oldOff">옛 받는 번호 끄기 (모든 화면이 새 버전이 된 뒤에)</button>' : data.oldPin === 'off' ? '<button class="btn b2" id="oldOn">옛 받는 번호 다시 켜기</button>' : '') + '<div class="msg" id="om"></div></div>';
    h += '<div class="box"><h2>특정 화면에만 보내는 법</h2><ol class="help"><li>슬랙 #생산실-방송 글 맨 앞에 <code>@이름</code> 또는 <code>@그룹</code>을 써요. 예: <code>@서재우 @키오스크 오늘 회의 2시</code></li><li>여러 곳은 띄어 써요. 아무것도 안 쓰면 모든 화면에 떠요.</li><li>이름은 앞 글자만 써도 돼요. 「서재우 PC」 화면은 <code>@서재우</code>로 받아요.</li><li>생산실 그룹 화면끼리는 한 곳에서 「확인」하면 같이 확인돼요. 사무실 화면은 각자 확인해요.</li><li>없는 이름을 쓰면 슬랙 댓글로 「○○ 화면을 찾지 못했어요」라고 알려 줘요.</li></ol></div>';
    $('app').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('[data-e]'), function (b) { b.onclick = function () { editId = b.getAttribute('data-e'); view(); editForm(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-x]'), function (b) { b.onclick = function () { var d = byId(b.getAttribute('data-x')); if (!d || !confirm('「' + d.name + '」 화면을 끊을까요?\n이 화면의 열쇠가 없어져 더 이상 방송을 받지 못해요. 다시 쓰려면 그 화면에서 받는 번호를 새로 넣어야 해요.')) return; call({ op: 'dev_off', id: d.id }).then(function () { load(); }); }; });
    if ($('oldOff')) $('oldOff').onclick = function () { if (!confirm('옛 받는 번호를 끌까요?\n옛 버전 화면은 멈추고, 라벨 프린터 출력은 계속돼요.')) return; call({ op: 'oldpin', off: 1 }).then(load); };
    if ($('oldOn')) $('oldOn').onclick = function () { call({ op: 'oldpin', off: 0 }).then(load); };
    if (editId) editForm();
  }
  function byId(id) { return (data.list || []).filter(function (d) { return d.id === id; })[0]; }
  function row(d) {
    var lv = live(d.seen);
    return '<div class="dev"><div class="b"><div class="n">' + esc(d.name) + (d.groups || []).map(function (g) { return '<span class="tag g">' + esc(g) + '</span>'; }).join('') + (d.name === '이름 미등록' ? '<span class="tag w">이름 필요</span>' : '') + '</div>' +
      '<div class="i">' + (lv ? '<span class="st on">● 켜짐</span>' : '<span class="st off">○ 꺼짐</span>') + ' 마지막 연결 ' + when(d.seen) + ' · 버전 ' + (d.v ? 'v0' + esc(d.v) : '-') + '</div>' +
      '<div class="i">' + (d.mode === 'pc' ? '사무실 PC 화면' : '포스기·키오스크 화면') + (d.hint ? ' · ' + esc(d.hint) : '') + ' · 등록 ' + when(d.t0) + (d.auto ? ' · 옛 화면 자동 등록' : '') + '</div>' +
      '<div id="ed_' + d.id + '"></div></div><div class="acts"><button class="btn b1" data-e="' + d.id + '">이름·그룹 바꾸기</button><button class="btn b3" data-x="' + d.id + '">끊기</button></div></div>';
  }
  function editForm() {
    var d = byId(editId), el = d && $('ed_' + editId); if (!el) { editId = ''; return; }
    var gs = (d.groups || []).slice(), G = (data.groups || ['생산실', '사무실']).slice();
    el.innerHTML = '<div class="edit"><input class="in" id="en" maxlength="20" value="' + esc(d.name === '이름 미등록' ? '' : d.name) + '" placeholder="예: 키오스크, 포스기, 서재우"><div class="gps" id="eg">' + G.map(function (g) { return '<button data-g="' + esc(g) + '"' + (gs.indexOf(g) >= 0 ? ' class="sel"' : '') + '>' + (gs.indexOf(g) >= 0 ? '✔ ' : '') + esc(g) + '</button>'; }).join('') + '</div>' +
      '<input class="in" id="eng" maxlength="10" placeholder="새 그룹 이름 (필요할 때만)" style="height:50px;font-size:18px"><div class="acts" style="margin-top:10px"><button class="btn b4" id="es">저장</button><button class="btn b2" id="ec">취소</button></div><div class="msg" id="em"></div></div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-g]'), function (b) { b.onclick = function () { var on = b.className !== 'sel'; b.className = on ? 'sel' : ''; b.textContent = (on ? '✔ ' : '') + b.getAttribute('data-g'); }; });
    $('ec').onclick = function () { editId = ''; view(); };
    var save = function () {
      var name = $('en').value.trim(), groups = Array.prototype.filter.call(el.querySelectorAll('[data-g]'), function (b) { return b.className === 'sel'; }).map(function (b) { return b.getAttribute('data-g'); });
      var ng = $('eng').value.replace(/\s/g, ''); if (ng && groups.indexOf(ng) < 0) groups.push(ng);
      if (!name) { $('em').className = 'msg err'; $('em').textContent = '이름을 넣어 주세요.'; return; }
      $('em').className = 'msg'; $('em').textContent = '저장 중…';
      call({ op: 'dev_set', id: d.id, name: name, groups: groups }).then(function (r) { if (r.ok) { editId = ''; load(); } else { $('em').className = 'msg err'; $('em').textContent = '저장하지 못했어요.'; } }).catch(function () { $('em').className = 'msg err'; $('em').textContent = '인터넷 연결을 확인해 주세요.'; });
    };
    $('es').onclick = save; $('en').onkeydown = function (e) { if (e.key === 'Enter') save(); }; $('en').focus();
  }
  $('btnRe').onclick = function () { editId = ''; load(); };
  $('btnOut').onclick = function () { if (!confirm('이 기기에서 보내기 번호를 잊을까요? (방송 보내기 화면도 다시 번호를 물어요)')) return; localStorage.removeItem('bang_send_pin'); pin = ''; login(); };
  if (pin) { $('app').innerHTML = '<div class="box">불러오는 중…</div>'; load(); } else login();
  timer = setInterval(function () { if (pin && !editId && !document.hidden) load(); }, 30000);
})();
</script>
</body></html>
