*{box-sizing:border-box;margin:0;padding:0}

#next{font-size:min(2.4vh,3.4vw);color:#FCF1D0;margin-top:1.2vh}
#hint{background:#BF913C;color:#010736;text-align:center;font-weight:700;font-size:min(3.4vh,4.8vw);padding:2.2vh 3vw}
#shield{position:fixed;inset:0;z-index:9}

var KEY='haccpTv_idx', idx=0, player=null, lastGood=Date.now();
try{idx=(parseInt(localStorage.getItem(KEY),10)||0)%V.length}catch(e){}
function show(){var v=V[idx],n=V[(idx+1)%V.length];
 document.getElementById('cnt').textContent=(idx+1)+' / '+V.length;
 document.getElementById('now').textContent=v.t;
 document.getElementById('next').textContent='다음 영상: '+n.t;}
function play(i){idx=(i+V.length)%V.length;try{localStorage.setItem(KEY,idx)}catch(e){}
 show();lastGood=Date.now();
 if(player&&player.loadVideoById){player.loadVideoById(V[idx].id);player.mute();}}
function next(){try{localStorage.setItem(KEY,(idx+1)%V.length)}catch(e){};play(idx+1)}
window.onYouTubeIframeAPIReady=function(){show();
 player=new YT.Player('p',{videoId:V[idx].id,host:'https://www.youtube-nocookie.com',
  playerVars:{autoplay:1,mute:1,controls:0,cc_load_policy:1,cc_lang_pref:'ko',hl:'ko',rel:0,playsinline:1,iv_load_policy:3,disablekb:1,fs:0},
  events:{onReady:function(e){e.target.mute();e.target.playVideo();},
   onStateChange:function(e){if(e.data===1||e.data===3)lastGood=Date.now();if(e.data===0)next();},
   onError:function(){setTimeout(next,2000);}}});};
setInterval(function(){
 if(!player||!player.getPlayerState){if(Date.now()-lastGood>60000)location.reload();return;}
 var s=player.getPlayerState();
 if(s===1||s===3){lastGood=Date.now();return;}
 if(s===2||s===5||s===-1){try{player.mute();player.playVideo()}catch(e){}}
 if(Date.now()-lastGood>45000)next();
},5000);
</script>
