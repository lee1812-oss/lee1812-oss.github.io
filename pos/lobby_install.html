<h1>🍞 신발장 포스기 · 영상 대기화면 설치</h1>
<p class="s">2분 동안 화면을 안 만지면 회사 홍보 영상과 이번 달 위생교육 영상이 번갈아 나옵니다. (09:00~19:00)</p>
<a class="b" href="lobby_tv_install.cmd" download="lobby_tv_install.cmd">① 설치 파일 받기</a>
<ol><li>아래쪽에 「위험할 수 있는 파일」 경고가 나오면 <b>「계속」</b> 또는 <b>▲ → 「유지」</b>를 누릅니다.</li>
<li>받은 파일(lobby_tv_install.cmd)을 누르고 <b>「실행」</b>을 누릅니다.</li>
<li>검은 창이 잠깐 떴다가 <b>「설치 완료」</b> 창이 나오면 끝입니다.</li>
<li>끄고 싶을 때는 조조에게 「신발장 영상 꺼줘」라고 말해 주세요.</li></ol>
