<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>조조 알림 전광판</title>
<meta name="theme-color" content="#3c2a1e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="알림전광판">
<style>
html,body{margin:0;height:100%;background:#f2f3f5;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all}
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f2f3f5}
#msg{padding:40px 20px;text-align:center;line-height:1.7;color:#333;font-size:19px}
.hide{display:none!important}
#ib{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:20;border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.18);display:flex;gap:8px;align-items:flex-start;background:#fff8d6;color:#3c2a1e;border:1px solid #e8d36a}
#ib .t{flex:1}#ib button{font:inherit;font-weight:700;border-radius:10px;border:1px solid currentColor;background:#fff;color:inherit;min-height:44px;padding:0 12px;margin-top:4px}#ib .x{border:0;background:transparent;font-size:20px;min-width:40px}
</style></head><body>
<div id="msg" class="hide"><div style="font-size:22px;font-weight:700;margin-bottom:6px">🔑 처음 한 번만 열쇠를 넣어 주세요</div>카톡 「나에게」로 받은 <b>전광판 주소</b>를 길게 눌러 복사한 뒤<br>아래 칸에 붙여 넣고 <b>열기</b>를 눌러 주세요.<br><input id="kin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 주소 붙여넣기" style="width:min(520px,92%);font-size:18px;padding:14px;margin-top:16px;border:2px solid #b9a27a;border-radius:12px;box-sizing:border-box"><br><button id="kgo" style="font-size:19px;font-weight:700;min-height:56px;padding:0 34px;margin-top:12px;border:0;border-radius:12px;background:#3c2a1e;color:#fff">열기</button><div id="kerr" style="color:#c0392b;margin-top:10px"></div></div>
<div id="ib" class="hide"></div>
<iframe id="fr" class="hide" title="조조 알림 전광판" allow="autoplay; screen-wake-lock"></iframe>
<script>
// 조조 알림 전광판 앱 껍데기 v4 (2026-10-25, 아이패드 홈 화면 열쇠 유지·붙여넣기 칸). 열쇠는 주소 # 뒤(또는 ?k=)로 한 번 받아 이 기기에만 기억한다. 이 파일·저장소에는 열쇠가 없다.
(function(){
  var EXEC="https://script.google.com/macros/s/AKfycbzHH0cAFytvYowJoHLHfSZ2NtixRRBFUkYw76lyLwv3iAooKnegWLYCS5ecSuojob9Fkw/exec";
  var ok=/^[a-z0-9]{8,40}$/i;
  var k=(location.hash.slice(1)||new URLSearchParams(location.search).get("k")||"").replace(/[^a-z0-9]/gi,"");
  try{if(ok.test(k))localStorage.setItem("jbk",k);else k=localStorage.getItem("jbk")||"";}catch(e){}
  var isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  // v4: 아이폰·아이패드는 홈 화면 앱이 사파리와 저장소를 따로 써서, 열쇠를 주소(?k=)에 남겨 둔다. 그래야 「홈 화면에 추가」한 아이콘이 바로 열린다.
  if(ok.test(k)){try{history.replaceState(null,"",location.pathname+(isIOS?"?k="+k:""))}catch(e){}}
  else if(location.hash){try{history.replaceState(null,"",location.pathname)}catch(e){}}
  if(!ok.test(k)){document.getElementById("msg").classList.remove("hide");
    document.getElementById("kgo").onclick=function(){var v=(document.getElementById("kin").value||"").trim();var m=v.match(/[#=]([a-z0-9]{8,40})\s*$/i)||v.match(/^([a-z0-9]{8,40})$/i);
      if(!m){document.getElementById("kerr").textContent="주소를 다시 확인해 주세요. 카톡의 전광판 주소 전체를 붙여 넣어요.";return}
      try{localStorage.setItem("jbk",m[1])}catch(e){}location.replace(location.pathname+"?k="+m[1])};
    return}
  if(!isIOS){var lk=document.createElement("link");lk.rel="manifest";lk.href="manifest.webmanifest";document.head.appendChild(lk)}
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})}catch(e){}}
  var fr=document.getElementById("fr");fr.src=EXEC+"?k="+encodeURIComponent(k);fr.classList.remove("hide");
  var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;if(standalone)return;
  var ib=document.getElementById("ib"),evt=null;
  function show(h){try{if(sessionStorage.getItem("jb_x"))return}catch(e){}ib.innerHTML='<div class="t">'+h+'</div><button class="x" aria-label="닫기">✕</button>';ib.classList.remove("hide");
    ib.querySelector(".x").onclick=function(){ib.classList.add("hide");try{sessionStorage.setItem("jb_x","1")}catch(e){}};
    var g=ib.querySelector(".go");if(g)g.onclick=function(){if(!evt)return;evt.prompt();evt.userChoice.then(function(){evt=null;ib.classList.add("hide")}).catch(function(){})}}
  if(isIOS){show('📲 사파리 <b>공유(□↑) → 「홈 화면에 추가」</b>로 설치해요.');return}
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();evt=e;show('📲 <b>앱으로 설치</b>하면 다음부터 아이콘으로 바로 열려요.<br><button class="go">설치하기</button>')});
  window.addEventListener("appinstalled",function(){ib.classList.add("hide")});
})();

/* v3: 안쪽 전광판이 「소리로 읽기」를 켜면 화면이 꺼지지 않게 잡아 둔다 (운전 중 거치대용) */
(function(){
  var lock=null,want=false;
  function grab(){if(!want||!("wakeLock" in navigator)||document.hidden)return;navigator.wakeLock.request("screen").then(function(l){lock=l;l.addEventListener("release",function(){lock=null})}).catch(function(){})}
  function drop(){want=false;if(lock){try{lock.release()}catch(e){}lock=null}}
  window.addEventListener("message",function(e){var d=e.data;if(d&&d.jb==="wake"){if(d.on){want=true;if(!lock)grab()}else drop()}});
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&want&&!lock)grab()});
})();
</script></body></html>
