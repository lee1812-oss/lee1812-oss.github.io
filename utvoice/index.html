<head>

<title>UTCA 음성 소통</title>
<style>
:root{--nv:#0E3A63;--nv2:#1A5A8A;--nv3:#4C7FAE;--cr:#EAF3FB;--gd:#2E86C1;--bg:#F1F4F8;--tx:#121A26;--sub:#4A5568;--ln:#D6DEE8;--red:#D32F2F;--or:#C25E00;--gr:#1F7A45;--bl:#1F5FA8}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;width:100%;overflow-x:hidden}
html.fs1{font-size:17px}html.fs2{font-size:19px}html.fs3{font-size:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
[hidden]{display:none!important}
body{margin:0;width:100%;max-width:100vw;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:54px;padding:0 16px;font-weight:700}
input,textarea,select{font:inherit;color:var(--tx);max-width:100%}
img{max-width:100%}
.wrap{max-width:680px;width:100%;margin:0 auto}
header{background:#fff;color:var(--tx);padding:calc(env(safe-area-inset-top) + 8px) 0 0;box-shadow:0 2px 10px rgba(14,58,99,.10);position:relative;z-index:5;flex:none}
.hd1{display:flex;align-items:center;gap:10px;padding:0 14px}
.logo{height:2.4rem;width:auto;flex:none;display:block}
.ttl{flex:1;min-width:0;border-left:2px solid #E1E7EF;padding-left:10px;line-height:1.25}
.ttl b{display:block;font-size:1.08rem;color:var(--nv);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.net{flex:none;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;background:#E5F4EA;color:var(--gr);white-space:nowrap}
.net.off{background:#FDE7E7;color:var(--red)}
.ib{flex:none;min-height:44px;min-width:44px;padding:0;background:#EEF3F9;color:var(--nv);border-radius:12px;font-size:1.05rem}
.clk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:10px 14px 8px}
.ck{background:linear-gradient(135deg,#0E3A63,#1A5A8A);color:#fff;border-radius:14px;padding:7px 12px;overflow:hidden}
.ck.us{background:linear-gradient(135deg,#123052,#2C4F78)}
.ck span{display:block;font-size:.74rem;color:#CFE0F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck b{display:block;font-size:1.15rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:2px 14px 10px;padding:4px;background:#EEF2F7;border-radius:14px}

.tabs button.on{background:#fff;color:var(--nv);box-shadow:0 1px 4px rgba(14,58,99,.18)}
.cnt{display:inline-block;min-width:22px;padding:0 6px;border-radius:12px;background:var(--red);color:#fff;font-size:.72rem;line-height:20px;margin-left:4px;vertical-align:1px}main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pane{display:none;padding:10px 12px 20px}.pane.on{display:block}
.srch{display:none;gap:8px;margin-bottom:8px}.srch.on{display:flex}
.srch input{flex:1;min-height:52px;border:2px solid var(--ln);border-radius:12px;padding:0 12px;background:#fff}
.day{text-align:center;margin:14px 0 8px}.day span{background:#DDE1EA;color:var(--sub);font-size:.8rem;padding:3px 12px;border-radius:20px;font-weight:700}
.row{display:flex;margin:8px 0}.row.me{justify-content:flex-end}
.bub{position:relative;max-width:88%;min-width:64%;background:#fff;border:1px solid var(--ln);border-radius:18px;padding:10px 12px 8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.me .bub{background:#E4EFFA;border-color:#BFD5EC}
.bub.new{border:2px solid var(--red)}
.bub.hl{animation:hl 1.6s}@keyframes hl{0%,60%{box-shadow:0 0 0 4px var(--gd)}}
.who{font-size:.8rem;color:var(--sub);padding-right:40px}.who b{color:var(--nv);font-size:.88rem}
.tz2{display:block;font-size:.76rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.bub.vo{width:94%;max-width:94%}
.more{position:absolute;right:4px;top:2px;min-height:42px;min-width:42px;padding:0;background:none;color:var(--sub);font-size:1.3rem}
.tx{white-space:pre-wrap;margin-top:4px;font-size:1rem}
.del{color:#777;font-style:italic;margin-top:4px}
.q{margin-top:6px;border-left:4px solid var(--gd);background:#EAF3FB;padding:4px 8px;border-radius:6px;font-size:.84rem;color:#24496E;cursor:pointer}
.vc{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;margin-top:8px;background:rgba(255,255,255,.72);border:1px solid rgba(76,127,174,.18);border-radius:16px;padding:9px 12px 9px 9px}
.you .vc{background:#F3F6FA}
.play{width:3.2rem;height:3.2rem;min-width:52px;min-height:52px;border-radius:50%;padding:0;background:var(--nv2);color:#fff;font-size:1.25rem;flex:none;box-shadow:0 2px 6px rgba(14,58,99,.25)}
.new .play{background:var(--red)}
.vmid{flex:1;min-width:0}
.vbar{height:14px;background:#D3D9E6;border-radius:8px;overflow:hidden;cursor:pointer}.vbar i{display:block;height:100%;width:0;background:var(--gd);border-radius:8px}
.vrow{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px}
.vrow span{font-size:.98rem;font-weight:800;color:var(--nv);font-variant-numeric:tabular-nums;white-space:nowrap}
.spd{flex:none;min-height:36px;padding:0 12px;background:#fff;border:1.5px solid var(--nv3);color:var(--nv2);border-radius:18px;font-size:.8rem;white-space:nowrap}
.skip{display:none;gap:8px;margin-top:6px}.skip.on{display:flex}.skip button{flex:1;min-height:44px;background:#EEF1F7;color:var(--nv2);font-size:.88rem}
.ph{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin-top:6px;background:#E4E7EE;min-height:120px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:20px}
.chip.todo{background:#FFF0E0;color:var(--or);border:1.5px solid #F1B47A}
.chip.done{background:#E3F4E9;color:var(--gr);border:1.5px solid #9ACFB0}
.chip.newl{background:#FDE5E5;color:var(--red);border:1.5px solid #F0A5A5}
.st{font-size:.78rem;color:var(--sub);margin-top:6px;text-align:right}
.st.ok{color:var(--gr)}.st.wait{color:var(--or)}.st.err{color:var(--red)}
.st button{min-height:36px;padding:0 10px;font-size:.8rem;background:var(--or);color:#fff;border-radius:10px;margin-left:6px}
.prog{height:6px;background:#F3D8BB;border-radius:4px;margin-top:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--or)}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
.empty b{display:block;font-size:1.1rem;color:var(--nv);margin-bottom:6px}
footer{flex:none;background:#fff;border-top:1px solid var(--ln);box-shadow:0 -2px 10px rgba(14,58,99,.08);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px)}
.unb{display:none;width:100%;background:var(--red);color:#fff;margin-bottom:8px}.unb.on{display:block}
.rpl{display:none;align-items:center;gap:8px;background:#EAF3FB;border-left:4px solid var(--gd);border-radius:8px;padding:6px 8px;margin-bottom:8px;font-size:.86rem}.rpl.on{display:flex}
.rpl span{flex:1}.rpl button{min-height:40px;min-width:40px;padding:0;background:none;font-size:1.1rem}
.cmp{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) 3rem;gap:8px}
.cmp button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .rec{padding:0 6px;background:var(--red);color:#fff;font-size:1.08rem;min-height:62px}
.cmp .tb{background:var(--nv2);color:#fff;min-height:62px;font-size:.98rem;padding:0 4px}
.cmp .pl{background:#E4E8F1;color:var(--nv);min-height:62px;font-size:1.3rem;padding:0}
.ov{position:fixed;inset:0;background:rgba(10,16,32,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}.ov.on{display:flex}
.sh{background:#fff;width:100%;max-width:680px;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92dvh;overflow-y:auto}

.sh p{margin:6px 0;color:var(--sub);font-size:.92rem}
.sh textarea{width:100%;min-height:140px;border:2px solid var(--ln);border-radius:14px;padding:12px;resize:vertical;font-size:1rem}
.sh .btns{display:flex;gap:8px;margin-top:12px}.sh .btns button{flex:1}
.b1{background:var(--nv2);color:#fff}.b2{background:#E4E8F1;color:var(--nv)}.b3{background:var(--red);color:#fff}.b4{background:var(--gr);color:#fff}.b5{background:var(--or);color:#fff}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:#FFF5EA;border:1.5px solid #F1C9A0;border-radius:12px;font-size:.92rem;font-weight:700;color:#7A3D00}
.chk input{width:26px;height:26px;flex:none}
.acts button{display:block;width:100%;text-align:left;margin-top:8px;background:#F1F3F8;color:var(--tx);font-weight:600}
.acts button.dz{color:var(--red)}
.recbox{text-align:center;padding:4px 0 2px}
.rstat{display:inline-flex;align-items:center;gap:8px;background:#FDECEC;color:var(--red);padding:6px 18px;border-radius:24px;font-size:1.02rem}
.rstat.pz{background:#EEF1F6;color:var(--sub)}
.rdot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--red);animation:pu 1s infinite;flex:none}
.rdot.pz{animation:none;background:#999}@keyframes pu{50%{opacity:.25}}
.rtime{font-size:3.6rem;font-weight:800;color:var(--nv);font-variant-numeric:tabular-nums;line-height:1.1;margin:12px 0 2px;letter-spacing:-1px}
.rmax{font-size:.8rem;color:var(--sub)}
.lvl{height:18px;background:#E4E8F1;border-radius:10px;overflow:hidden;margin:14px 0 8px}
.recbox #rhint{color:var(--tx);font-size:.95rem}
.rbtns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;margin-top:14px}
.rbtns button{min-height:66px;font-size:1.06rem;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcan{display:block;width:100%;margin-top:10px;background:#fff;border:1.5px solid #F0B4B4;color:var(--red);min-height:50px;font-size:.95rem}
.recnote{margin-top:12px;padding:10px 12px;background:#F3F6FA;border-radius:12px;font-size:.8rem;color:var(--sub);text-align:left}.lvl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1F7A45,#BF913C,#C62828);transition:width .08s}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:1.02rem;color:var(--nv)}
.card p{margin:4px 0;color:var(--sub);font-size:.9rem}
.card input[type=email],.card input[type=text]{width:100%;min-height:52px;border:2px solid var(--ln);border-radius:12px;padding:0 12px;margin-top:6px}
.card .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.card .btns button{flex:1}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;background:#E4E8F1;color:var(--nv);min-height:50px}.seg button.on{background:var(--nv2);color:#fff}
.ok{color:var(--gr);font-weight:700}.warn{color:var(--or);font-weight:700}.bad{color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#1B2333;color:#fff;padding:12px 18px;border-radius:14px;font-size:.92rem;z-index:80;max-width:90%;display:none;text-align:center}.toast.on{display:block}
.lock{position:fixed;inset:0;background:var(--nv);color:#fff;z-index:90;display:none;align-items:center;justify-content:center;padding:24px}.lock.on{display:flex}
.lock{overflow-y:auto;align-items:flex-start}
.lock .in{max-width:440px;width:100%;text-align:center;margin:auto 0;padding:10px 0 30px}
.who2{display:flex;gap:8px;margin-top:12px}.lock .who2 button{flex:1;margin:0;background:#173062;color:#fff;border:2px solid #3A5590;min-height:62px}.lock .who2 button.on{background:var(--cr);color:var(--nv);border-color:var(--gd)}
.lerr{color:#FFB4B4!important;font-weight:700;min-height:1.2em}
.inst2{margin-top:18px;background:#13275A;border-radius:16px;padding:14px;text-align:left}.inst2 h3{margin:0 0 6px;font-size:1.02rem;color:var(--cr)}.inst2 p{margin:4px 0;font-size:.88rem}.inst2 button{margin-top:8px}
.inst2 .b2{background:#22396F;color:#fff}
.ibar{display:none;align-items:center;gap:8px;background:#FFF5DA;color:#5A4500;padding:8px 12px;font-size:.88rem}.ibar.on{display:flex}.ibar span{flex:1}.ibar button{min-height:44px;padding:0 12px;font-size:.88rem}
.lklogo{display:inline-block;background:#fff;border-radius:18px;padding:12px 18px;box-shadow:0 6px 20px rgba(0,0,0,.25)}.lklogo img{height:64px;width:auto;display:block}
.lock h2{margin:12px 0 4px}.lock p{color:#C9D2E8;font-size:.95rem}
.lock input{width:100%;min-height:56px;border-radius:12px;border:0;padding:0 12px;margin-top:10px}
.lock button{width:100%;margin-top:10px;background:var(--gd);color:#fff}
.kk{display:none;background:#FFF3C4;color:#5A4500;padding:10px 14px;font-size:.9rem}.kk.on{display:block}
.kk button{min-height:46px;margin-top:6px;background:#3C2A00;color:#FEE500;width:100%}
.tl{font-size:.82rem;color:var(--sub);margin-top:2px}
.foot{text-align:center;color:var(--sub);font-size:.8rem;padding:6px}
</style>
</head>
<body>
<div class="kk" id="kk">카카오톡 안에서 열렸어요. 녹음·설치가 잘 되려면 휴대폰 기본 브라우저(크롬·사파리)로 열어 주세요.<button id="kkOpen">기본 브라우저로 열기</button></div>

<header>
  <div class="wrap">
    <div class="hd1">
      <img class="logo" src="utca-logo.png" alt="UTCA SOLUTION">

      <button data-tab="set">⚙ 설정</button>

</header>
<main id="main">
  <div class="wrap">
    <section class="pane on" id="p-chat">
      <div class="srch" id="srch"><input id="q" type="search" placeholder="글 내용으로 찾기"><button class="b2" id="qx">닫기</button></div>
      <div id="list"></div>

  <div class="wrap">

      <button class="pl" id="btnPlus" aria-label="사진·파일">➕</button>

</footer>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div class="toast" id="toast"></div>
<div class="lock" id="lock"><div class="in">
  <div class="lklogo"><img src="utca-logo.png" alt="UTCA SOLUTION"></div>
  <h2>음성 소통</h2>
  <p id="lockMsg">누구신지 고르고 비밀번호를 넣어 주세요.<br>한 번 로그인하면 이 휴대폰에서는 다시 묻지 않아요.</p>
  <div class="who2" id="whoBtns"><span class="tl" style="color:#C9D2E8">불러오는 중…</span></div>
  <input id="pwIn" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" maxlength="30">
  <button id="pwGo">로그인</button>
  <p class="lerr" id="lerr"></p>
  <div class="inst2" id="inst2"></div>

<script>
'use strict';
const APK = 'utca-voice.apk';
const API = 'https://script.google.com/macros/s/AKfycbwoQPipOSJMnrkCI24OsPwjFfx-kiJRuAqPqNEw6Kmn-hVAv2Vju92bMx_ibOgPiLKm/exec', VER = 'v004', BUILT = '2026-11-04';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const S = { k: localStorage.getItem('utv_k') || '', me: LS.get('utv_me', null), members: LS.get('utv_mem', []), msgs: LS.get('utv_msgs', {}), since: LS.get('utv_since', 0),
  set: Object.assign({ fs: 2, rate: 1 }, LS.get('utv_set', {})), out: [], tab: 'chat', reply: null, q: '', online: true, vapid: '' };
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isKakao = /KAKAOTALK/i.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

/* ---------- 휴대폰 안 저장소 (녹음 보관·보내기 대기·녹음 중 조각) ---------- */
const idb = (() => {
  let dbp;
  function db() { return dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('utv', 1); r.onupgradeneeded = () => { const d = r.result; ['kv', 'media', 'out', 'draft'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); }
  async function op(st, mode, fn) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(st, mode), s = t.objectStore(st); let out; const r = fn(s); if (r) r.onsuccess = () => { out = r.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
  return { get: (s, k) => op(s, 'readonly', x => x.get(k)), set: (s, k, v) => op(s, 'readwrite', x => x.put(v, k)), del: (s, k) => op(s, 'readwrite', x => x.delete(k)),
    all: s => op(s, 'readonly', x => x.getAll()), keys: s => op(s, 'readonly', x => x.getAllKeys()), clear: s => op(s, 'readwrite', x => x.clear()) };

/* ---------- 서버 연결 ---------- */
async function api(op, q = {}, tries = 2) {
  const body = Object.assign({}, q, { op, k: S.k }); let last;
  for (let i = 0; i < tries; i++) {
    try {
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), op === 'up' || op === 'file' || op === 'send' ? 120000 : 30000);
      const r = await fetch(API, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
      clearTimeout(tm);
      const j = await r.json();
      if (!j.ok) { const e = new Error(j.err || 'err'); e.srv = 1; throw e; }
      setNet(true); return j;
    } catch (e) { last = e; if (e.srv) { if (e.message === 'key') lockShow('key'); throw e; } setNet(false); if (i < tries - 1) await sleep(1500 * (i + 1)); }
  }
  throw last;
}

  $('#clk').innerHTML = zones.map(tz => { const h = hourIn(now, tz), night = h >= 22 || h < 7, kr = tz === 'Asia/Seoul';
    return `<div class="ck${kr ? '' : ' us'}"><span>${kr ? '🇰🇷' : '🇺🇸'} ${esc(tzName(tz))} · ${esc(fmt(now, tz, { month: 'numeric', day: 'numeric' }).replace(/\s/g, '').replace(/\.$/, ''))}(${esc(fmt(now, tz, { weekday: 'short' }))})${night ? ' 🌙' : ''}</span><b>${esc(hm(now, tz))}</b></div>`; }).join('');

/* ---------- 화면 자동 맞춤: 글자가 화면 밖으로 넘치면 글자 크기를 조금씩 줄여 한 화면에 맞춘다 ---------- */
const FS_BASE = { 1: 17, 2: 19, 3: 22 };
let fitT = 0;
function overflowing() {
  const W = document.documentElement.clientWidth;
  if (document.documentElement.scrollWidth > W + 1) return true;
  const sel = ['.ck b', '.ck span', '.ttl b', '.tabs button', '.cmp button', '.hd1'];
  for (const s of sel) for (const el of document.querySelectorAll(s)) { if (el.offsetParent && el.scrollWidth > el.clientWidth + 1) return true; }
  return false;
}
function autoFit() {
  clearTimeout(fitT);
  fitT = setTimeout(() => {
    const root = document.documentElement, W = root.clientWidth || window.innerWidth;
    let fs = Math.min(FS_BASE[S.set.fs] || 19, Math.max(14, W / (S.set.fs === 3 ? 18.5 : S.set.fs === 1 ? 24 : 21.5)));
    root.style.fontSize = fs + 'px';
    let guard = 0;
    while (overflowing() && fs > 12 && guard++ < 20) { fs -= 0.5; root.style.fontSize = fs + 'px'; }
    if (guard > 0) root.style.fontSize = (fs - 0.5) + 'px';   // 한 단계 여유
  }, 30);
}

/* ---------- 보내기 (먼저 휴대폰에 저장 → 연결되면 보냄, 끊기면 저절로 다시) ---------- */

$('#fAudio').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 30 * 1024 * 1024) return toast('파일이 너무 커요 (30MB까지). 나눠서 보내 주세요.', 4000);
  const dur = await new Promise(r => { const a = new Audio(); a.preload = 'metadata'; a.onloadedmetadata = () => r(isFinite(a.duration) ? a.duration : 0); a.onerror = () => r(0); a.src = URL.createObjectURL(f); setTimeout(() => r(0), 5000); });
  sheet(`<h2>🎵 녹음 파일 보내기</h2><p><b>${esc(f.name)}</b> · ${(f.size / 1048576).toFixed(1)}MB${dur ? ' · ' + durTxt(dur) : ''}</p>
    <textarea id="aTxt" placeholder="설명 (안 써도 돼요)" style="min-height:80px"></textarea>
    <label class="chk"><input type="checkbox" id="aTodo"> 📌 확인할 일로 표시</label>
    <div class="btns"><button class="b2" data-close>취소</button><button class="b1" id="aSend" style="flex:1.6">➤ 보내기</button></div>`);
  $('#aSend').onclick = async () => { const text = $('#aTxt').value.trim() || f.name, todo = $('#aTodo').checked ? 1 : 0; closeSheet(); await queueSend({ type: 'voice', blob: f, mime: f.type || 'audio/mpeg', dur, text, todo }); };
};

/* ---------- 메시지 ⋯ 메뉴 ---------- */
function openMore(id) {
  const m = S.msgs[id]; if (!m) return; const mine = m.from === S.me.id;
  const b = [];
  if (!m.del) { b.push('<button data-a="rv">↩ 녹음으로 답하기</button>', '<button data-a="rt">↩ 글로 답하기</button>');
    if (m.todo !== 1) b.push('<button data-a="t1">📌 확인할 일로 표시</button>'); if (m.todo === 1) b.push('<button data-a="t2">✅ 처리 완료</button>'); if (m.todo) b.push('<button data-a="t0">↺ 확인할 일 표시 없애기</button>');
    if (m.type !== 'text') b.push(`<button data-a="dl">⬇ ${m.type === 'voice' ? '녹음' : '사진'} 내려받기 (휴대폰에 저장)</button>`);
    if (m.text) b.push('<button data-a="cp">📋 글 복사하기</button>');
    if (mine) b.push('<button data-a="del" class="dz">🗑 지우기 (상대 화면에서도 지워져요)</button>'); }
  b.push('<button data-close>닫기</button>');
  sheet(`<h2>${esc(nameOf(m.from))} · ${esc(md(m.at, myTz()))} ${esc(hm(m.at, myTz()))}</h2><div class="acts">${b.join('')}</div>`);
  $('#sh').querySelectorAll('[data-a]').forEach(x => x.onclick = () => moreAct(m, x.dataset.a));
}
async function moreAct(m, a) {
  closeSheet();
  if (a === 'rv') { setReply(m); recStart(); }
  else if (a === 'rt') { setReply(m); openText(); }
  else if (a[0] === 't') setTodo(m.id, Number(a[1]));
  else if (a === 'dl') { try { const b = await getMedia(m.id), u = URL.createObjectURL(b), x = document.createElement('a'); const ext = (m.mime || b.type).includes('webm') ? 'webm' : (m.mime || b.type).includes('mp4') ? 'm4a' : (m.mime || b.type).includes('jpeg') ? 'jpg' : ((m.mime || b.type).split('/')[1] || 'bin'); x.href = u; x.download = 'UTCA_' + fmt(m.at, 'Asia/Seoul', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).replace(/\D/g, '') + '_' + nameOf(m.from).split(' ')[0] + '.' + ext; document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(u), 30000); } catch (e) { toast('내려받지 못했어요. 연결을 확인해 주세요.'); } }
  else if (a === 'cp') { try { await navigator.clipboard.writeText(m.text); toast('글을 복사했어요'); } catch (e) { toast('복사가 안 돼요. 글을 길게 눌러 복사해 주세요.'); } }
  else if (a === 'del') { if (!await ask('이 메시지를 지울까요?\n상대방 화면에서도 지워지고 되돌릴 수 없어요.', '지우기', '취소')) return; try { const r = await api('del', { id: m.id }, 2); S.msgs[m.id] = r.m; await idb.del('media', m.id); saveMsgs(); render(); toast('지웠어요'); } catch (e) { toast('지우지 못했어요: ' + e.message); } }
}
async function setTodo(id, v) {
  try { const r = await api('todo', { id, v }, 2); S.msgs[id] = r.m; saveMsgs(); render(); toast(v === 2 ? '✅ 처리 완료로 바꿨어요' : v === 1 ? '📌 확인할 일로 표시했어요' : '표시를 없앴어요'); }
  catch (e) { toast('바꾸지 못했어요. 연결을 확인해 주세요.'); }
}
function setReply(m) { S.reply = m; $('#rpl').classList.toggle('on', !!m); if (m) $('#rplT').textContent = '↩ ' + nameOf(m.from) + '님 메시지에 답하는 중'; }

/* ---------- 설정 ---------- */
function renderSet() {
  const me = S.me || {}, pushOk = 'PushManager' in window && 'serviceWorker' in navigator, perm = window.Notification ? Notification.permission : 'none';
  $('#setBox').innerHTML = `
  <div class="card"><h3>👤 이 휴대폰</h3><p><b style="color:var(--nv);font-size:1.05rem">${esc(nameOf(me.id))}</b> (으)로 연결돼 있어요.</p><p>대화 상대: ${others().map(o => esc(nameOf(o.id)) + ' · ' + esc(tzName(o.tz))).join(', ') || '-'}</p></div>
  <div class="card"><h3>🔔 휴대폰 알림 (새 녹음이 오면 울림)</h3>
    <p id="pushSt">${!pushOk ? (isIOS && !standalone ? '<span class="warn">아이폰은 먼저 아래 「앱 설치」로 홈 화면에 추가한 뒤, 그 앱에서 켤 수 있어요.</span>' : '<span class="warn">이 브라우저는 알림을 지원하지 않아요. 메일 알림을 켜 주세요.</span>') : perm === 'granted' ? '<span class="ok">알림 허용됨</span>' : perm === 'denied' ? '<span class="bad">알림이 막혀 있어요. 휴대폰 설정 → 앱/사이트 알림에서 허용해 주세요.</span>' : '아직 안 켰어요.'}</p>
    ${pushOk ? '<div class="btns"><button class="b1" id="pOn">🔔 알림 켜기</button><button class="b2" id="pTest">시험 알림</button></div>' : ''}</div>
  <div class="card"><h3>✉️ 메일 알림 (선택)</h3><p>새 메시지가 오면 이 주소로 「새 녹음이 왔어요」만 보내요. 내용은 넣지 않아요(보안). 10분에 한 번까지만 와요.</p>
    <input type="email" id="mail" placeholder="예: name@gmail.com" value="${esc(me.mail || '')}">
    <label class="chk" style="background:#EEF3FB;border-color:#B9C8E6;color:var(--nv)"><input type="checkbox" id="mailOn" ${me.notify !== false ? 'checked' : ''}> 새 메시지 알림 받기 (휴대폰·메일 모두)</label>
    <div class="btns"><button class="b1" id="mailSave">저장</button></div></div>
  <div class="card"><h3>🔠 글자 크기</h3><div class="seg">${[1, 2, 3].map(n => `<button data-fs="${n}" class="${S.set.fs === n ? 'on' : ''}">${['보통', '크게', '아주 크게'][n - 1]}</button>`).join('')}</div></div>
  <div class="card"><h3>⏩ 듣기 속도 (기본)</h3><div class="seg">${[1, 1.25, 1.5, 2].map(n => `<button data-rate="${n}" class="${S.set.rate === n ? 'on' : ''}">${n}배</button>`).join('')}</div><p>녹음 옆 「1배속」 단추를 눌러도 바뀌어요.</p></div>
  <div class="card"><h3>📲 앱 설치 (홈 화면에 아이콘)</h3>${installHtml(false)}</div>
  <div class="card"><h3>🔑 비밀번호 바꾸기</h3><p>6자리 이상. 바꾸면 다른 휴대폰에 로그인된 것은 모두 풀려요(이 휴대폰은 그대로).</p>
    <input type="password" id="pwOld" placeholder="지금 비밀번호" autocomplete="current-password" style="width:100%;min-height:52px;border:2px solid var(--ln);border-radius:12px;padding:0 12px;margin-top:6px">
    <input type="password" id="pwNew" placeholder="새 비밀번호 (6자리 이상)" autocomplete="new-password" style="width:100%;min-height:52px;border:2px solid var(--ln);border-radius:12px;padding:0 12px;margin-top:6px">
    <input type="password" id="pwNew2" placeholder="새 비밀번호 한 번 더" autocomplete="new-password" style="width:100%;min-height:52px;border:2px solid var(--ln);border-radius:12px;padding:0 12px;margin-top:6px">
    <div class="btns"><button class="b1" id="pwSave">비밀번호 바꾸기</button></div></div>
  <div class="card"><h3>💡 끊김에 강하게 만들었어요</h3><p>1. 녹음은 1초마다 휴대폰에 먼저 저장돼요. 전화가 오거나 앱이 꺼져도 다시 열면 살릴 수 있어요.</p><p>2. 보내다 연결이 끊기면 「⚠ 아직 못 보냈어요」로 남고, 연결되면 저절로 다시 보내요.</p><p>3. 한 번 들은 녹음은 휴대폰에 보관돼서 인터넷이 없어도 다시 들을 수 있어요.</p><p>4. 숫자·주소·이름은 소리로 헷갈리기 쉬우니 녹음할 때 「덧붙일 글」에 적어 주세요.</p></div>
  <div class="card"><h3>🔒 보안</h3><p>녹음·글·사진은 UTCA 구글 드라이브의 <b>비공개 폴더</b>에만 저장돼요. 이 앱 주소만으로는 아무것도 볼 수 없고, 본인 비밀번호로 로그인해야 열려요. 비밀번호를 5번 틀리면 15분 동안 잠겨요.</p><p class="warn">비밀번호는 다른 사람에게 알려 주지 마세요. 휴대폰을 잃어버리면 다른 기기에서 비밀번호를 바꾸거나 이혜영 부장에게 알려 주세요(그 휴대폰의 로그인이 바로 풀려요).</p>
    <div class="btns"><button class="b2" id="unlink" style="color:var(--red)">로그아웃 (이 휴대폰)</button></div></div>
  <div class="foot">UTCA 음성 소통 ${VER} · ${BUILT}</div>`;
  const sb = $('#setBox');
  sb.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { S.set.fs = Number(b.dataset.fs); LS.set('utv_set', S.set); applyFs(); renderSet(); });
  sb.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { S.set.rate = Number(b.dataset.rate); P.a.playbackRate = S.set.rate; LS.set('utv_set', S.set); renderSet(); playerUi(); });
  if ($('#pOn')) $('#pOn').onclick = pushOn;
  if ($('#pTest')) $('#pTest').onclick = async () => { try { const r = await api('ptest', {}, 1); toast(r.total ? '시험 알림을 보냈어요 (' + r.sent + '/' + r.total + '대)' : '먼저 「알림 켜기」를 눌러 주세요'); } catch (e) { toast('보내지 못했어요: ' + e.message); } };
  $('#mailSave').onclick = async () => { try { const r = await api('setme', { mail: $('#mail').value, notify: $('#mailOn').checked }, 2); S.me.mail = r.mail; S.me.notify = r.notify; LS.set('utv_me', S.me); toast(r.mail ? '저장했어요: ' + r.mail : ($('#mail').value ? '메일 주소 모양이 맞지 않아요' : '저장했어요 (메일 알림 없음)')); renderSet(); } catch (e) { toast('저장하지 못했어요'); } };
  bindInstall(sb);
  $('#pwSave').onclick = async () => {
    const o = $('#pwOld').value.trim(), n = $('#pwNew').value.trim(), n2 = $('#pwNew2').value.trim();
    if (!/^\S{6,30}$/.test(n)) return toast('새 비밀번호는 6자리 이상(띄어쓰기 없이)으로 넣어 주세요.');
    if (n !== n2) return toast('새 비밀번호 두 칸이 서로 달라요.');
    try { const r = await api('setpw', { old: o, pw: n }, 1); S.k = r.k; localStorage.setItem('utv_k', r.k); await idb.set('kv', 'k', r.k); toast('비밀번호를 바꿨어요 ✅', 3500); renderSet(); }
    catch (e) { toast(e.message === 'oldpw' ? '지금 비밀번호가 맞지 않아요.' : '바꾸지 못했어요: ' + e.message, 3500); }
  };
  $('#unlink').onclick = async () => { if (!await ask('이 휴대폰에서 로그아웃할까요?\n저장된 대화·녹음도 이 휴대폰에서 지워져요. 다시 쓰려면 비밀번호로 로그인하면 돼요(대화는 그대로 다시 나와요).', '로그아웃', '취소')) return;
    try { const reg = await navigator.serviceWorker.getRegistration(); const s = reg && await reg.pushManager.getSubscription(); if (s) { await api('poff', { ep: s.endpoint }, 1).catch(() => { }); await s.unsubscribe(); } } catch (e) { }
    ['utv_k', 'utv_me', 'utv_mem', 'utv_msgs', 'utv_since'].forEach(k => localStorage.removeItem(k)); for (const s of ['kv', 'media', 'out', 'draft']) await idb.clear(s).catch(() => { }); location.replace('./'); };
}
function applyFs() { document.documentElement.className = 'fs' + S.set.fs; autoFit(); }
function u8key(b64) { const p = '='.repeat((4 - b64.length % 4) % 4), s = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(s, c => c.charCodeAt(0)); }
async function pushOn() {
  try {
    const perm = await Notification.requestPermission(); if (perm !== 'granted') { toast('알림이 허용되지 않았어요'); renderSet(); return; }
    const reg = await navigator.serviceWorker.ready; let s = await reg.pushManager.getSubscription();
    if (!s) s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8key(S.vapid) });
    await api('psub', { ep: s.endpoint }, 2); toast('🔔 알림을 켰어요. 「시험 알림」으로 확인해 보세요.'); renderSet();
  } catch (e) { toast('알림을 켜지 못했어요: ' + e.message, 4000); }
}

/* ---------- 공통 창 ---------- */
function sheet(html, modal) { $('#sh').innerHTML = html; $('#ov').classList.add('on'); $('#ov').dataset.modal = modal ? '1' : ''; }
function closeSheet() { $('#ov').classList.remove('on'); $('#sh').innerHTML = ''; }
function ask(msg, yes, no) {
  return new Promise(res => {
    const prev = $('#sh').innerHTML, wasOn = $('#ov').classList.contains('on'), wasModal = $('#ov').dataset.modal;
    const box = document.createElement('div'); box.className = 'ov on'; box.style.zIndex = 70; box.style.alignItems = 'center';
    box.innerHTML = `<div class="sh" style="border-radius:20px;margin:16px"><p style="white-space:pre-line;color:var(--tx);font-size:1rem">${esc(msg)}</p><div class="btns"><button class="b2" data-n>${esc(no)}</button><button class="b3" data-y>${esc(yes)}</button></div></div>`;
    document.body.appendChild(box);
    box.querySelector('[data-y]').onclick = () => { box.remove(); res(true); };
    box.querySelector('[data-n]').onclick = () => { box.remove(); res(false); };
    void prev; void wasOn; void wasModal;
  });
}
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov' && !$('#ov').dataset.modal) closeSheet(); if (e.target.closest('[data-close]')) closeSheet(); });

/* ---------- 눌렀을 때 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-play],[data-more],[data-seek],[data-spd],[data-skip],[data-go],[data-todo],[data-retry],[data-tab]'); if (!t) return;
  if (t.dataset.tab) return showTab(t.dataset.tab);
  if (t.dataset.play) return play(t.dataset.play);
  if (t.dataset.more) return openMore(t.dataset.more);
  if (t.dataset.spd) { const r = [1, 1.25, 1.5, 2]; S.set.rate = r[(r.indexOf(S.set.rate) + 1) % r.length]; P.a.playbackRate = S.set.rate; LS.set('utv_set', S.set); return playerUi(); }
  if (t.dataset.skip) { if (P.a.src) P.a.currentTime = Math.max(0, Math.min(curDur() || 1e9, P.a.currentTime + Number(t.dataset.skip))); return; }
  if (t.dataset.seek) { if (P.id !== t.dataset.seek) return play(t.dataset.seek); const r = t.getBoundingClientRect(), d = curDur(); if (d) P.a.currentTime = Math.max(0, Math.min(d - .2, (e.clientX - r.left) / r.width * d)); return; }
  if (t.dataset.go) { const id = t.dataset.go; if (S.tab !== 'chat') showTab('chat'); setTimeout(() => { scrollToMsg(id); if (S.msgs[id] && S.msgs[id].type === 'voice' && t.closest('.card')) play(id); }, 120); return; }
  if (t.dataset.todo) return setTodo(t.dataset.todo, Number(t.dataset.v));
  if (t.dataset.retry) { S.out.forEach(o => o.err = 0); render(); processOut(); }
});
function showTab(tab) {
  S.tab = tab; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + tab));
  $('#ft').style.display = tab === 'set' ? 'none' : '';
  if (tab === 'set') renderSet(); else render();
  if (tab === 'chat') { const m = $('#main'); m.scrollTop = m.scrollHeight; } else $('#main').scrollTop = 0;
}
$('#btnRec').onclick = recStart; $('#btnTxt').onclick = () => openText(); $('#btnPlus').onclick = openPlus; $('#unb').onclick = playUnheard;
$('#rplX').onclick = () => setReply(null);
$('#btnSrch').onclick = () => { showTab('chat'); $('#srch').classList.toggle('on'); if ($('#srch').classList.contains('on')) $('#q').focus(); else { S.q = ''; $('#q').value = ''; render(); } };
$('#qx').onclick = () => { $('#srch').classList.remove('on'); S.q = ''; $('#q').value = ''; render(); };
$('#q').oninput = () => { S.q = $('#q').value; render(); };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__inst = e; });
window.addEventListener('appinstalled', () => { $('#ibar').classList.remove('on'); window.__inst = null; });
$('#ibarGo').onclick = doInstall; $('#ibarX').onclick = () => { $('#ibar').classList.remove('on'); LS.set('utv_ibar', Date.now()); };
window.addEventListener('online', () => { setNet(true); sync(); });
window.addEventListener('offline', () => setNet(false));
document.addEventListener('visibilitychange', () => { if (!document.hidden) { sync(); drawClock(); } });

/* ---------- 시작 ---------- */
async function boot() {
  const r = await api('me', {}, 2);
  S.me = r.me; S.members = r.members; S.vapid = r.vapid; LS.set('utv_me', S.me); LS.set('utv_mem', S.members);
  $('#hdMe').textContent = nameOf(S.me.id) + ' · 로그인됨';
  drawClock(); render(); await sync(true);
}
(async function start() {
  applyFs();
  if (isKakao) { $('#kk').classList.add('on'); $('#kkOpen').onclick = () => { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); }; }
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  if (!standalone && (isIOS || isAndroid) && Date.now() - LS.get('utv_ibar', 0) > 3 * 86400000) $('#ibar').classList.add('on');
  if (S.k) idb.set('kv', 'k', S.k).catch(() => { });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  drawClock(); setInterval(drawClock, 30000);
  setInterval(() => { if (!document.hidden && S.me && S.k) sync(); }, 15000);
  if (!S.k) { lockShow(); return; }
  if (S.me) { $('#hdMe').textContent = nameOf(S.me.id) + ' · 로그인됨'; render(); }
  S.out = (await idb.all('out').catch(() => [])) || []; S.out.sort((a, b) => a.at - b.at);
  try { await boot(); } catch (e) { if (!S.me) { if (e.srv) lockShow('key'); else { $('#hdMe').textContent = '연결 안 됨 · 인터넷을 확인해 주세요'; } } }
  recoverDraft();
})();
</script>
</body>
</html>
