<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말씀 낭독 - 소리 내어 읽는 우리 가족 성경</title>
<meta name="description" content="성경을 소리 내어 읽으면 저절로 체크되는 말씀 낭독 앱. 내 목소리 녹음, 가족 함께 읽기, 1년 1독 계획.">
<meta name="theme-color" content="#0D1C42">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말씀 낭독">
<meta property="og:title" content="말씀 낭독 - 소리 내어 읽는 우리 가족 성경">
<meta property="og:description" content="성경을 소리 내어 읽으면 저절로 체크돼요. 함께 읽어요.">
<meta property="og:image" content="icon-512.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700&display=swap">
<style>
:root{--n1:#010736;--n2:#0D1C42;--n3:#22396F;--n4:#3B5591;--cr:#FCF1D0;--cr2:#FFF8E6;--gold:#BF913C;--gold2:#9C7428;--ink:#14182B;--sub:#464B5E;--line:#E3DFD3;--bg:#F7F4EC;--ok:#2E7D4F;--warn:#C0392B;--fs:21px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:19px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:18px}
.top{position:sticky;top:0;z-index:20;background:var(--n2);color:var(--cr);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:21px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px}
.top h1 small{display:block;font-size:13px;font-weight:500;color:#C9CFE3;letter-spacing:0}
.chip{background:rgba(252,241,208,.14);color:var(--cr);border:1px solid rgba(252,241,208,.35);border-radius:999px;padding:8px 14px;font-weight:700;font-size:17px;min-height:44px}
.back{background:none;border:none;color:var(--cr);font-size:28px;padding:0 6px;min-width:44px;min-height:44px}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(13,28,66,.08);border:1px solid var(--line)}
.card h2{margin:0 0 10px;font-size:19px;color:var(--n2);font-weight:800}
.verse-card{background:linear-gradient(135deg,var(--n2),var(--n3));color:var(--cr);border:none}
.verse-card .lbl{font-size:14px;color:#E9D7A6;font-weight:700;letter-spacing:1px}
.verse-card .txt{font-size:21px;font-weight:700;margin:8px 0 6px;line-height:1.6}
.verse-card .ref{font-size:16px;color:#E9D7A6;text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:30px;color:var(--n2);line-height:1.2}
.stat span{font-size:15px;color:var(--sub);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:16px;border:none;background:var(--n2);color:var(--cr);font-weight:800;font-size:19px;padding:12px 16px;margin-top:10px}
.btn.gold{background:var(--gold);color:#fff}
.btn.line{background:#fff;color:var(--n2);border:2px solid var(--n3)}
.btn.soft{background:var(--cr);color:var(--n2)}
.btn.red{background:#fff;color:var(--warn);border:2px solid #E8B4AE}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-height:56px}
.ch-row:last-child{border-bottom:none}
.ch-row .nm{flex:1;font-weight:700;font-size:20px}
.ch-row .st{font-size:15px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st.voice{background:#E7F3EC;color:var(--ok)}.st.check{background:#EAF0FA;color:var(--n3)}.st.plaud{background:#F6EEDC;color:var(--gold2)}.st.no{background:#F1EFEA;color:var(--sub)}
.note{font-size:17px;color:var(--sub);margin:6px 0 0}
.note.warn{color:#A35A00}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:none;border:none;padding:8px 0 10px;color:var(--sub);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.tabs button .ic{font-size:24px;line-height:1}
.tabs button.on{color:var(--n2)}
.tabs button.on .ic{transform:scale(1.08)}
.books h3{margin:16px 4px 8px;font-size:17px;color:var(--n3)}
.book{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:58px;width:100%;text-align:left;color:var(--ink)}
.book .bn{flex:1;font-weight:700;font-size:19px}
.bar{height:8px;background:#ECE8DD;border-radius:9px;overflow:hidden;width:90px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.book .cnt{font-size:15px;color:var(--sub);width:62px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.cell{position:relative;min-height:58px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:19px;color:var(--n2)}
.cell.read{background:var(--n2);color:var(--cr);border-color:var(--n2)}
.cell.today{border-color:var(--gold);border-width:3px}
.cell .dot{position:absolute;right:5px;top:4px;font-size:11px}
/* 읽기 화면 */
.reader-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.reader-head .t{flex:1;font-size:22px;font-weight:800;color:var(--n2)}
.fsz{display:flex;gap:6px}
.fsz button{min-width:48px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;color:var(--n2)}
.vs{background:#FFFDF8;border-radius:20px;border:1px solid var(--line);padding:16px 10px 20px}
.v{font-family:var(--rf);font-weight:var(--rw);-webkit-text-stroke:var(--rs) currentColor;font-size:var(--fs);line-height:1.95;letter-spacing:-.01em;margin:0 0 2px;padding:8px 12px 8px 12px;border-radius:14px;border-left:5px solid transparent;color:#1A1D2C;transition:background .35s,color .35s,border-color .35s;cursor:pointer}
.v sup{font-family:Pretendard,sans-serif;-webkit-text-stroke:0;font-size:.56em;color:var(--gold2);font-weight:800;margin-right:6px;vertical-align:.4em}
.v.done{color:#6F6A5A}
.v.done sup::after{content:" ✓";color:var(--ok)}
.v.cur{background:#FFF3D1;border-left-color:var(--gold);color:#0E1124}
.rtools{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.rtools .t{flex:1 1 100%;font-size:23px;font-weight:800;color:var(--n2)}
.pm{display:flex;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:14px;overflow:hidden}
.pm button{width:52px;min-height:52px;border:none;background:none;font-size:26px;font-weight:800;color:var(--n2)}
.pm span{font-size:16px;font-weight:800;color:var(--sub);padding:0 2px}
.tool{flex:1;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--n2);font-weight:800;font-size:17px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool.on{border-color:var(--gold);background:#FFF6E0}
.hint{font-size:17px;color:var(--sub);margin:0 0 10px;line-height:1.5}
.bgl{display:grid;gap:8px;margin:8px 0}
.bgm,.fnt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 16px;min-height:64px;color:var(--ink)}
.bgm b{font-size:19px;color:var(--n2)}.bgm span{font-size:15px;color:var(--sub)}
.bgm.on,.fnt.on{border-color:var(--gold);background:#FFF6E0}
.bgm.on b::before,.fnt.on b::before{content:"✓ ";color:var(--gold2)}
.fnt b{font-size:16px;color:var(--n2);font-family:Pretendard,sans-serif}.fnt .smp{font-size:24px;line-height:1.6;color:#1A1D2C;margin-top:2px}
.vol{display:flex;align-items:center;gap:10px;margin:6px 0}.vol input{flex:1;height:36px;accent-color:var(--gold)}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;min-height:48px}.chk input{width:24px;height:24px;accent-color:var(--gold)}
.dock .mus{background:rgba(252,241,208,.12);border:1.5px solid rgba(252,241,208,.5);color:var(--cr);border-radius:12px;padding:6px 8px;font-weight:700;font-size:14px;min-height:48px;max-width:96px;line-height:1.2}
.dock .side{display:flex;flex-direction:column;gap:6px;flex:none}
.fsbig{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(1,7,54,.85);color:var(--cr);font-size:26px;font-weight:800;padding:16px 26px;border-radius:18px;z-index:90;pointer-events:none}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--n2);color:var(--cr);padding:10px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(1,7,54,.25)}
.dock .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.mic{width:76px;height:76px;border-radius:50%;border:4px solid var(--cr);background:var(--gold);color:#fff;font-size:34px;flex:none;display:flex;align-items:center;justify-content:center}
.mic.on{background:var(--warn);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(252,241,208,.6)}70%{box-shadow:0 0 0 16px rgba(252,241,208,0)}100%{box-shadow:0 0 0 0 rgba(252,241,208,0)}}
.dock .info{flex:1;min-width:0}
.dock .msg{font-size:17px;font-weight:700}
.dock .sub2{font-size:15px;color:#C9CFE3}
.pbar{height:10px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--cr);width:0;transition:width .4s}
.manual{background:none;border:1.5px solid rgba(252,241,208,.5);color:var(--cr);border-radius:12px;padding:8px 10px;font-weight:700;font-size:15px;min-height:48px;flex:none}
.navch{display:flex;gap:10px;margin:14px 0}
.navch button{flex:1}
/* 시트 */
.dim{position:fixed;inset:0;background:rgba(1,7,54,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 8px;color:var(--n2);font-size:22px}
.amen{text-align:center;padding:6px 0 4px}
.amen .big{font-size:44px}
.amen h2{font-size:26px}
textarea,input[type=text],input[type=date],select{width:100%;border:1.5px solid #CFC9BA;border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-weight:700;margin:14px 0 6px;color:var(--n2)}
.plan{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.plan.on{border-color:var(--gold);background:var(--cr2)}
.plan b{font-size:18px;color:var(--n2)}
.plan span{display:block;font-size:15px;color:var(--sub)}
.rec{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}
.rec .w{flex:1;min-width:0}
.rec .w b{display:block;font-size:18px}
.rec .w span{font-size:15px;color:var(--sub)}
.ib{min-width:48px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:20px;color:var(--n2)}
.ib.play{background:var(--n2);color:var(--cr);border-color:var(--n2)}
.pchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;min-height:44px;color:var(--n2)}
.pchip.on{background:var(--n2);color:var(--cr);border-color:var(--n2)}
.res{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:18px}
.res input{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--n1);color:var(--cr);padding:14px 20px;border-radius:14px;font-weight:700;z-index:80;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.help p,.help li{font-size:17px}
.help h3{color:var(--n2);margin:16px 0 6px;font-size:18px}
.foot{text-align:center;color:var(--sub);font-size:14px;margin-top:18px}
.pill{display:inline-block;background:var(--cr);color:var(--gold2);font-weight:800;font-size:14px;border-radius:999px;padding:3px 10px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="meta.js"></script>
<script>
const VER='v003';
const NAME='창세기 출애굽기 레위기 민수기 신명기 여호수아 사사기 룻기 사무엘상 사무엘하 열왕기상 열왕기하 역대상 역대하 에스라 느헤미야 에스더 욥기 시편 잠언 전도서 아가 이사야 예레미야 예레미야애가 에스겔 다니엘 호세아 요엘 아모스 오바댜 요나 미가 나훔 하박국 스바냐 학개 스가랴 말라기 마태복음 마가복음 누가복음 요한복음 사도행전 로마서 고린도전서 고린도후서 갈라디아서 에베소서 빌립보서 골로새서 데살로니가전서 데살로니가후서 디모데전서 디모데후서 디도서 빌레몬서 히브리서 야고보서 베드로전서 베드로후서 요한일서 요한이서 요한삼서 유다서 요한계시록'.split(' ');
const AB='창 출 레 민 신 수 삿 룻 삼상 삼하 왕상 왕하 대상 대하 스 느 에 욥 시 잠 전 아 사 렘 애 겔 단 호 욜 암 옵 욘 미 나 합 습 학 슥 말 마 막 눅 요 행 롬 고전 고후 갈 엡 빌 골 살전 살후 딤전 딤후 딛 몬 히 약 벧전 벧후 요일 요이 요삼 유 계'.split(' ');
const unit=b=>b===19?'편':'장';
const PLANS={
 bible365:{n:'성경 1독 (1년)',d:'창세기부터 요한계시록까지, 하루 약 15~20분',from:1,to:66,days:365},
 nt90:{n:'신약 90일',d:'마태복음부터 요한계시록까지, 하루 약 3장',from:40,to:66,days:90},
 gospel40:{n:'복음서 40일',d:'예수님의 삶을 따라 읽기, 하루 2~3장',from:40,to:43,days:40},
 pro31:{n:'자녀와 함께 잠언 31일',d:'하루 잠언 한 장, 날짜와 같은 장을 읽어요',from:20,to:20,days:31},
 psa75:{n:'시편 75일',d:'하루 평균 시편 두 편, 기도로 읽기',from:19,to:19,days:75},
 free:{n:'자유롭게 읽기',d:'계획 없이 읽고 싶은 곳을 읽어요',from:1,to:66,days:0}
};
const COLORS=['#22396F','#BF913C','#2E7D4F','#8E3B5E','#3B6E8F','#7A5C2E'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const K=(b,c)=>b+':'+c;
const kName=k=>{const [b,c]=k.split(':').map(Number);return NAME[b-1]+' '+c+unit(b)};
const fmtMin=s=>s<60?Math.round(s)+'초':Math.round(s/60)+'분';
function toast(m,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ===== 저장 (이 휴대폰 안에만) ===== */
const SKEY='malsseum-v1';
let S;
try{S=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
if(!S||!S.profiles)S={cur:null,profiles:{},font:21,rec:true};
function save(){localStorage.setItem(SKEY,JSON.stringify(S))}
const P=()=>S.profiles[S.cur];
/* 읽기 글꼴 (v003: 더 크고 부드럽게) */
const FONTS={
 soft:['부드러운 글씨','둥글고 편안해요','"Gowun Dodum",Pretendard,sans-serif',400,'.35px'],
 clear:['또렷한 글씨','글자가 선명해요','Pretendard,sans-serif',500,'0px'],
 book:['성경책 글씨','종이 성경처럼','"Gowun Batang",serif',700,'0px'],
 myeong:['진한 명조','굵고 또렴한 명조','"Nanum Myeongjo",serif',700,'.2px']};
if(!S.v3){S.font=Math.max(S.font||21,24);S.rfont=S.rfont||'soft';S.bgm=S.bgm||'off';if(S.bgmVol==null)S.bgmVol=.4;S.v3=1;try{save()}catch(e){}}
function applyFont(){const f=FONTS[S.rfont]||FONTS.soft;const st=document.documentElement.style;st.setProperty('--rf',f[2]);st.setProperty('--rw',f[3]);st.setProperty('--rs',f[4]);st.setProperty('--fs',(S.font||24)+'px')}
applyFont();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* 녹음 보관 (IndexedDB) */
let _db;
function db(){return _db||(_db=new Promise((ok,no)=>{const r=indexedDB.open('malsseum-audio',1);r.onupgradeneeded=()=>{const s=r.result.createObjectStore('rec',{keyPath:'id'});s.createIndex('pid','pid')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function recPut(o){const d=await db();return new Promise((ok,no)=>{const t=d.transaction('rec','readwrite');t.objectStore('rec').put(o);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function recAll(){const d=await db();return new Promise((ok,no)=>{const q=d.transaction('rec').objectStore('rec').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}
async function recDel(id){const d=await db();return new Promise(ok=>{const t=d.transaction('rec','readwrite');t.objectStore('rec').delete(id);t.oncomplete=ok})}

/* ===== 읽기 계획 ===== */
const planCache={};
function planDays(type){
 if(planCache[type])return planCache[type];
 const p=PLANS[type];const keys=[];let tot=0;
 for(let b=p.from;b<=p.to;b++)VC[b-1].forEach((n,i)=>{keys.push([K(b,i+1),n]);tot+=n});
 if(!p.days)return planCache[type]={keys:keys.map(x=>x[0]),days:[]};
 const days=[];let cur=[],acc=0,d=0;
 if(keys.length<=p.days){keys.forEach(k=>days.push([k[0]]))}
 else{
  for(let i=0;i<keys.length;i++){
   cur.push(keys[i][0]);acc+=keys[i][1];
   const left=keys.length-i-1,dleft=p.days-d-1;
   if(dleft<=0)continue;
   let cut=left<=dleft;
   if(!cut){const target=tot*(d+1)/p.days;const nextN=keys[i+1][1];cut=acc>=target||(acc+nextN-target)>(target-acc)}
   if(cut){days.push(cur);cur=[];d++}
  }
  if(cur.length)days.push(cur);
 }
 return planCache[type]={keys:keys.map(x=>x[0]),days};
}
function todayIndex(pr){return dayDiff(pr.plan.start,ymd())}
function isRead(k,pr=P()){return !!pr.read[k]}
// 잠언 31일은 매달 다시 읽으므로 「이번 달에 읽었는지」로 본다
const ym=d=>ymd(d).slice(0,7);
function doneFor(k,pr=P()){const r=pr.read[k];if(!r)return false;if(pr.plan.type==='pro31'&&k.startsWith('20:'))return ym(new Date(r.t))===ym(new Date());return true}
function todayPortion(pr=P()){
 const pd=planDays(pr.plan.type);
 if(pr.plan.type==='pro31'){const now=new Date();const d=now.getDate();const last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();const ks=[K(20,Math.min(d,31))];if(d===last)for(let c=d+1;c<=31;c++)ks.push(K(20,c));return {idx:d-1,keys:ks,monthly:true}}
 if(!pd.days.length){ // 자유: 마지막으로 읽은 곳 다음 3장
  let last=pr.last||'1:0';let [b,c]=last.split(':').map(Number);const out=[];
  while(out.length<3&&b<=66){c++;if(c>VC[b-1].length){b++;c=1;if(b>66)break}const k=K(b,c);if(!isRead(k,pr)||out.length)out.push(k)}
  return {idx:null,keys:out};
 }
 let idx=todayIndex(pr);
 if(idx<0)return {idx,keys:pd.days[0],before:true};
 if(idx>=pd.days.length)return {idx,keys:pd.keys.filter(k=>!isRead(k,pr)).slice(0,4),after:true};
 return {idx,keys:pd.days[idx]};
}
function behind(pr=P()){const pd=planDays(pr.plan.type);if(pr.plan.type==='pro31'){const out=[];for(let c=1;c<new Date().getDate()&&c<=31;c++)if(!doneFor(K(20,c),pr))out.push(K(20,c));return out}if(!pd.days.length)return[];const idx=Math.min(todayIndex(pr),pd.days.length);const out=[];for(let i=0;i<idx;i++)pd.days[i].forEach(k=>{if(!isRead(k,pr))out.push(k)});return out}
function streak(pr=P()){let d=new Date();if(!pr.days[ymd(d)])d.setDate(d.getDate()-1);let n=0;while(pr.days[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function planDone(pr=P()){const pd=planDays(pr.plan.type);return pd.keys.filter(k=>doneFor(k,pr)).length}
function markRead(k,how,sec=0,pr=P()){
 const old=pr.read[k];const todayFirst=!old||ymd(new Date(old.t))!==ymd();
 pr.read[k]={t:Date.now(),how:(how==='voice'||old?.how==='voice')?'voice':how,sec:Math.round(sec+(old?.sec||0)),n:(old?.n||0)+1};
 if(todayFirst){const d=ymd();pr.days[d]=(pr.days[d]||0)+1}
 pr.last=k;save();
}

const norm=s=>String(s).replace(/[^가-힣0-9]/g,'');
function grams(s,n){const a=new Set();for(let i=0;i+n<=s.length;i++)a.add(s.substr(i,n));return a}
function verseGrams(t){const s=norm(t);const n=s.length>=8?3:2;return {n,g:grams(s,n)}}
function coverage(vg,G3,G2){if(!vg.g.size)return 1;const G=vg.n===3?G3:G2;let h=0;vg.g.forEach(x=>{if(G.has(x))h++});return h/vg.g.size}

 const T=norm(R.fin+' '+R.intr);const G3=grams(T,3),G2=grams(T,2);

function padNote(m,t,dur,vel){const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+Math.min(2.4,dur/3));g.gain.setValueAtTime(vel,t+dur-1.8);g.gain.linearRampToValueAtTime(0,t+dur+.6);

 [[1,1],[2,.32],[3,.12],[4,.05]].forEach(([h,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.value=mtof(m)*h;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+len+.1)})}

const PROG=[[50,57,62,66,69],[47,54,62,66,71],[43,55,62,67,71],[45,57,61,64,69],[50,57,62,66,69],[43,55,59,62,67],[40,55,59,62,67],[45,57,61,64,67]];

function bgmEngine(id,gen){
 const now=AC.currentTime+.15;let next=now,step=0;
 const loop=fn=>{fn();bgTimer=setInterval(()=>{if(gen!==bgGen)return;fn()},400)};
 if(id==='organ')loop(()=>{while(next<AC.currentTime+4){PROG[step%8].forEach((m,j)=>padNote(m,next,8.2,j===0?.05:.035));next+=7.5;step++}});
 else if(id==='piano')loop(()=>{while(next<AC.currentTime+4){const ch=PROG[step%8];const beat=1.7;pianoNote(ch[0],next,.16);padNote(ch[0]+12,next,beat*4+.3,.012);
   const top=ch.slice(1).map(m=>m+12);let last=-1;[0,1,2,3].forEach(k=>{if(k===0||Math.random()<.75){let m;do{m=top[Math.floor(Math.random()*top.length)]}while(m===last&&top.length>1);last=m;pianoNote(m,next+k*beat+(k?Math.random()*.25:.05),.07+Math.random()*.03)}});next+=beat*4;step++}});
 else if(id==='hymn'){const B=.85;loop(()=>{while(next<AC.currentTime+4){const [m,d]=HYMN[step%HYMN.length];boxNote(m+12,next,.13);
   // 마디 첫박에 화음
   let pos=0;for(let i=0;i<step%HYMN.length;i++)pos+=HYMN[i][1];

   next+=d*B;step++;if(step%HYMN.length===0)next+=B}})}

  loop(()=>{while(next<AC.currentTime+1){const s=AC.createBufferSource();s.buffer=w;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800+Math.random()*3500;bp.Q.value=4;const g=AC.createGain();g.gain.setValueAtTime(0,next);g.gain.linearRampToValueAtTime(.25+Math.random()*.3,next+.003);g.gain.exponentialRampToValueAtTime(.001,next+.04);s.connect(bp);bp.connect(g);g.connect(BUS);s.start(next,Math.random()*3,.06);next+=.03+Math.random()*.12}})}

}
function bgmPlay(id){

async function complete(how){
 if(!R)return;const wasActive=R.active;R.completed=true;
 const sec=R.active?R.sec+(Date.now()-R.t0)/1000:R.sec;
 markRead(R.k,how,sec);vib([80,60,160]);
 R.verses.forEach((_,i)=>{R.done.add(i);$('#v'+i)?.classList.add('done')});dockUpdate();
 if(wasActive){await stopReading()}
 const b=R.b,c=R.c,k=R.k;const next=c<VC[b-1].length?[b,c+1]:b<66?[b+1,1]:null;

 ${next?`<button class="btn gold" id="goNext">다음 ${unit(next[0])} 이어서 읽기 (${NAME[next[0]-1]} ${next[1]}${unit(next[0])})</button>`:''}
 <button class="btn line" id="goHome">오늘은 여기까지</button>${leftToday?'':'<button class="btn soft" id="goShare">📤 오늘 읽은 말씀 나누기</button>'}</div>`;

 let rs=[];try{rs=await recAll()}catch(e){}
 rs=rs.filter(r=>vFilter==='all'||r.pid===vFilter).sort((a,b)=>b.date-a.date);
 const el=$('#recList');if(!el)return;
 el.innerHTML=rs.length?rs.map(r=>{const pn=S.profiles[r.pid]?.name||'(지운 가족)';const d=new Date(r.date);return`<div class="rec"><button class="ib play" onclick="playRec('${r.id}',this)">▶</button><div class="w"><b>${kName(r.key)}</b><span>${esc(pn)} · ${d.getMonth()+1}/${d.getDate()} · ${fmtMin(r.sec)}${r.src==='file'?' · 가져온 파일':''}</span></div><button class="ib" onclick="shareRec('${r.id}')" aria-label="보내기">📤</button><button class="ib" onclick="delRec('${r.id}')" aria-label="지우기">🗑</button></div>`}).join(''):'<p class="note">아직 녹음이 없어요. 「오늘」에서 🎙를 누르고 읽으면 목소리가 저장돼요.</p>';

async function getRec(id){return (await recAll()).find(r=>r.id===id)}
async function playRec(id,btn){
 if(audioEl){audioEl.pause();if(playing===id){playing=null;btn.textContent='▶';audioEl=null;return}document.querySelectorAll('.ib.play').forEach(b=>b.textContent='▶')}
 const r=await getRec(id);if(!r)return;audioEl=new Audio(URL.createObjectURL(r.blob));playing=id;btn.textContent='❚❚';
 audioEl.onended=()=>{btn.textContent='▶';playing=null};audioEl.play().catch(()=>toast('재생할 수 없는 파일이에요'));
}
async function shareRec(id){const r=await getRec(id);if(!r)return;const ext=r.mime.includes('mp4')?'m4a':r.mime.includes('mpeg')?'mp3':r.mime.includes('wav')?'wav':'webm';
 const f=new File([r.blob],`${kName(r.key).replace(/\s/g,'')}_${S.profiles[r.pid]?.name||''}.${ext}`,{type:r.mime});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:kName(r.key)+' 낭독'})}catch(e){}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}
async function delRec(id){if(!confirm('이 녹음을 지울까요? 되돌릴 수 없어요.'))return;await recDel(id);voiceView()}
function chapterPicker(id,b=1,c=1){return`<div class="row2"><select id="${id}B" onchange="document.getElementById('${id}C').innerHTML=Array.from({length:VC[this.value-1].length},(_,i)=>'<option>'+(i+1)+'</option>').join('')">${NAME.map((n,i)=>`<option value="${i+1}" ${i+1===b?'selected':''}>${n}</option>`).join('')}</select><select id="${id}C">${Array.from({length:VC[b-1].length},(_,i)=>`<option ${i+1===c?'selected':''}>${i+1}</option>`).join('')}</select></div>`}
function importAudio(){
 const inp=document.createElement('input');inp.type='file';inp.accept='audio/*,.mp3,.m4a,.wav,.ogg,.webm';
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;
  const t=todayPortion().keys.find(k=>!isRead(k))||P().last||'1:1';const [b,c]=t.split(':').map(Number);
  const dim=document.createElement('div');dim.className='dim';dim.innerHTML=`<div class="sheet"><h2>어느 말씀의 녹음인가요?</h2><p class="note">${esc(f.name)} (${(f.size/1048576).toFixed(1)}MB)</p>${chapterPicker('imp',b,c||1)}
  <label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:700"><input type="checkbox" id="impMark" checked style="width:24px;height:24px"> 이 장을 읽음으로 체크하기</label>
  <button class="btn gold" id="impOk">저장하기</button><button class="btn line" id="impNo">취소</button></div>`;document.body.appendChild(dim);
  dim.querySelector('#impNo').onclick=()=>dim.remove();
  dim.querySelector('#impOk').onclick=async()=>{const k=K(+$('#impB').value,+$('#impC').value);let sec=0;try{sec=await new Promise(ok=>{const a=new Audio(URL.createObjectURL(f));a.onloadedmetadata=()=>ok(isFinite(a.duration)?a.duration:0);a.onerror=()=>ok(0)})}catch(e){}
   try{await recPut({id:'r'+Date.now().toString(36),pid:S.cur,key:k,date:Date.now(),sec,mime:f.type||'audio/mpeg',blob:f,src:'file'})}catch(e){toast('저장 공간이 부족해요');return}
   if($('#impMark').checked)markRead(k,'plaud',sec);dim.remove();toast(kName(k)+' 녹음을 저장했어요');voiceView()};
 };inp.click();
}

function plaudView(){
 shell('Plaud로 읽은 말씀 체크',`<div class="card help"><h2>이렇게 해 주세요</h2><ol style="padding-left:22px;margin:0">
 <li>Plaud 녹음기를 켜고 성경을 소리 내어 읽어요.</li><li>휴대폰 Plaud 앱에서 그 녹음을 열고 받아쓰기(Transcript)가 나오면 글 전체를 복사해요.</li><li>아래 칸에 붙여 넣고 「읽은 장 찾기」를 눌러요.</li></ol>
 <p class="note">여러 장을 한 번에 읽었어도 괜찮아요. 성경 전체에서 읽은 장을 찾아요.</p></div>
 <div class="card"><textarea id="ptext" placeholder="여기에 받아쓰기 글을 붙여 넣어 주세요" style="min-height:180px"></textarea>
 <button class="btn gold" id="pfind" onclick="plaudFind()">읽은 장 찾기</button><div id="pres"></div></div>`,{back:true});
}
async function plaudFind(){
 const T=norm($('#ptext').value);if(T.length<30){toast('받아쓰기 글을 조금 더 길게 붙여 넣어 주세요');return}
 const btn=$('#pfind');btn.disabled=true;const out=$('#pres');
 const G3=grams(T,3),G2=grams(T,2);const found=[];
 for(let b=1;b<=66;b++){
  btn.textContent=`성경에서 찾는 중... ${b}/66`;
  let bk;try{bk=await book(b)}catch(e){out.innerHTML='<p class="note warn">인터넷 연결을 확인해 주세요</p>';btn.disabled=false;btn.textContent='읽은 장 찾기';return}
  bk.forEach((vs,ci)=>{
   let hit=0;vs.forEach(v=>{if(coverage(verseGrams(v),G3,G2)>=TH_VERSE)hit++});
   const pct=hit/vs.length;if(pct>=0.3)found.push({k:K(b,ci+1),pct});
  });
  if(b%6===0)await new Promise(r=>setTimeout(r,0));
 }
 btn.disabled=false;btn.textContent='다시 찾기';
 if(!found.length){out.innerHTML='<p class="note warn">맞는 장을 찾지 못했어요. 받아쓰기가 너무 짧거나 소리가 작았을 수 있어요. 「성경」에서 직접 체크할 수도 있어요.</p>';return}
 out.innerHTML=`<h2 style="margin-top:16px">찾은 말씀</h2>${found.map((f,i)=>`<label class="res"><input type="checkbox" data-k="${f.k}" ${f.pct>=0.6?'checked':''}><span style="flex:1;font-weight:700">${kName(f.k)}</span><span class="pill">${Math.round(f.pct*100)}% 읽음</span>${isRead(f.k)?' ✓':''}</label>`).join('')}
 <p class="note">60% 넘게 맞은 장은 미리 골라 뒀어요. 맞는지 보고 눌러 주세요.</p><button class="btn gold" onclick="plaudSave()">고른 장 체크하기</button>`;
}
function plaudSave(){const ks=[...document.querySelectorAll('#pres input:checked')].map(i=>i.dataset.k);if(!ks.length){toast('체크할 장을 골라 주세요');return}
 ks.forEach(k=>markRead(k,'plaud'));toast(`${ks.length}장을 체크했어요. 아멘!`);go('#/today')}

 const draw=()=>dim.querySelector('#famBody').innerHTML=items.map((it,i)=>`<div style="border:2px solid ${it.on?'var(--gold)':'var(--line)'};border-radius:14px;padding:10px 12px;margin-bottom:8px;background:${it.on?'var(--cr2)':'#fff'}">

  ${it.on&&!it.has?`<div class="pchips" style="margin:8px 0 0">${[['bible365','성경 1독 (1년)'],['pro31','잠언 31일'],['nt90','신약 90일']].map(([k,n])=>`<button class="pchip ${it.plan===k?'on':''}" data-pl="${i}:${k}">${n}</button>`).join('')}</div>`:''}</div>`).join('');
 const dim=sheet(`<h2>우리 가족 등록</h2><p class="note" style="margin-top:0">누르기만 하면 돼요. 이름을 눌러 빼거나 넣고, 계획을 누르고, 이 휴대폰 주인을 ★로 골라 주세요.</p><div id="famBody"></div><button class="btn gold" id="famOk">우리 가족 등록하기</button><button class="btn line" id="famNo">나중에</button>`);
 dim.querySelector('#famBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.on){const it=items[+b.dataset.on];it.on=!it.on}
  if(b.dataset.me){me=items[+b.dataset.me].name;items[+b.dataset.me].on=true}
  if(b.dataset.pl){const [i,k]=b.dataset.pl.split(':');items[+i].plan=k}
  draw()};
 draw();
 dim.querySelector('#famNo').onclick=()=>dim.remove();
 dim.querySelector('#famOk').onclick=()=>{let n=0;items.filter(i=>i.on&&!i.has).forEach(i=>{newProfile(i.name,i.plan,ymd());n++});
  const mp=Object.values(S.profiles).find(p=>p.name===me);if(mp)S.cur=mp.id;save();dim.remove();toast(`가족 ${n}명을 등록했어요. 지금은 ${me} 님이 읽어요`,3500);location.hash='#/today';render()};
}

function pickProfile(){const ps=Object.values(S.profiles);const dim=document.createElement('div');dim.className='dim';
 dim.innerHTML=`<div class="sheet"><h2>누가 읽나요?</h2>${ps.map(p=>`<button class="plan ${p.id===S.cur?'on':''}" data-id="${p.id}"><b>${esc(p.name)}</b><span>${esc(PLANS[p.plan.type].n)} · ${planDone(p)}장 읽음 · 연속 ${streak(p)}일</span></button>`).join('')}<button class="btn line" id="pAdd">+ 가족 추가</button><button class="btn soft" id="pClose">닫기</button></div>`;
 document.body.appendChild(dim);dim.onclick=e=>{if(e.target===dim)dim.remove()};
 dim.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await stopReading(true);S.cur=b.dataset.id;save();dim.remove();render()});
 dim.querySelector('#pAdd').onclick=()=>{dim.remove();addProfile()};dim.querySelector('#pClose').onclick=()=>dim.remove()}
function backup(){const blob=new Blob([JSON.stringify({app:'malsseum',ver:VER,saved:new Date().toISOString(),data:S})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`말씀낭독_기록_${ymd().replace(/-/g,'')}.json`;a.click();toast('기록 파일을 받았어요. 카톡 「나와의 채팅」에 보내 두면 안전해요',4000)}
function restore(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{const j=JSON.parse(await inp.files[0].text());if(j.app!=='malsseum'||!j.data?.profiles)throw 0;if(!confirm('지금 기록을 이 파일의 기록으로 바꿀까요?'))return;S=j.data;save();toast('기록을 되살렸어요');go('#/today')}catch(e){toast('말씀 낭독 기록 파일이 아니에요')}};inp.click()}

/* ===== 나누기 ===== */
const APPURL=location.origin+location.pathname.replace(/index\.html$/,'');
async function invite(){const text=`우리 같이 성경을 소리 내어 읽어요.\n「말씀 낭독」은 성경을 읽으면 저절로 체크되고, 내 목소리로 녹음돼서 아이들도 들을 수 있는 앱이에요. 설치 없이 주소만 누르면 돼요.\n`;
 if(navigator.share){try{await navigator.share({title:'말씀 낭독',text,url:APPURL})}catch(e){}}else{try{await navigator.clipboard.writeText(text+APPURL);toast('초대 글과 주소를 복사했어요. 카톡에 붙여 넣어 주세요')}catch(e){prompt('이 글을 복사해 주세요',text+APPURL)}}}
async function shareCard(){
 const pr=P();const today=ymd();const ks=Object.entries(pr.read).filter(([k,v])=>ymd(new Date(v.t))===today).map(([k])=>k);
 if(!ks.length){toast('오늘 읽은 말씀이 아직 없어요');return}
 const W=1080,H=1080,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#010736');g.addColorStop(1,'#22396F');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.strokeStyle='#BF913C';x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);
 const F='Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';x.textAlign='center';
 x.fillStyle='#E9D7A6';x.font=`700 40px ${F}`;x.fillText('오늘 소리 내어 읽은 말씀',W/2,150);
 x.fillStyle='#FCF1D0';x.font=`800 64px ${F}`;
 const names=ks.map(kName);const lines=[];let cur='';names.forEach(n=>{if((cur+', '+n).length>14&&cur){lines.push(cur);cur=n}else cur=cur?cur+', '+n:n});if(cur)lines.push(cur);
 lines.slice(0,3).forEach((l,i)=>x.fillText(l,W/2,260+i*84));
 const [b,c]=ks[ks.length-1].split(':').map(Number);let vtxt='';try{vtxt=(await book(b))[c-1][0]}catch(e){}
 x.fillStyle='#FFFFFF';x.font=`600 42px ${F}`;const wrap=[];let line='';for(const w of vtxt.split(' ')){if(x.measureText(line+' '+w).width>W-220&&line){wrap.push(line);line=w}else line=line?line+' '+w:w}if(line)wrap.push(line);
 const y0=560;wrap.slice(0,5).forEach((l,i)=>x.fillText(l,W/2,y0+i*62));x.fillStyle='#E9D7A6';x.font=`600 34px ${F}`;x.fillText(`${NAME[b-1]} ${c}:1`,W/2,y0+Math.min(5,wrap.length)*62+30);
 x.fillStyle='#BF913C';x.beginPath();x.roundRect?x.roundRect(W/2-300,880,600,90,45):x.rect(W/2-300,880,600,90);x.fill();
 x.fillStyle='#fff';x.font=`800 40px ${F}`;x.fillText(`${pr.name} · 연속 ${streak(pr)}일째 · 🙏`,W/2,940);
 x.fillStyle='#C9CFE3';x.font=`500 26px ${F}`;x.fillText('말씀 낭독 · 함께 읽어요',W/2,1015);
 cv.toBlob(async bl=>{const f=new File([bl],`말씀낭독_${today}.png`,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:`오늘 ${names.join(', ')}을(를) 소리 내어 읽었어요. 함께 읽어요 ${APPURL}`})}catch(e){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();toast('카드 그림을 저장했어요')}},'image/png');
}

function helpView(){
 shell('도움말',`<div class="card help">
 <h3>휴대폰 바탕화면에 앱 아이콘 만들기</h3><ol style="padding-left:22px">
 <li><b>갤럭시(안드로이드)</b>: 크롬으로 이 주소를 열고 오른쪽 위 ⋮ → 「홈 화면에 추가」 → 「설치」</li>
 <li><b>아이폰</b>: 사파리로 열고 아래 공유 버튼(□↑) → 「홈 화면에 추가」</li></ol>
 <h3>소리 내어 읽기</h3><ol style="padding-left:22px"><li>「오늘」에서 「소리 내어 읽기 시작」을 누르고 🎙 버튼을 눌러요.</li><li>처음 한 번 「마이크 허용」을 눌러 주세요.</li><li>또박또박 읽으면 읽은 절이 금색으로 바뀌고, 80% 넘게 읽으면 저절로 체크돼요.</li><li>따로 성경책을 펼 필요 없이, 읽기 화면의 말씀을 보면서 바로 읽으면 돼요. 읽는 절이 노란 표시로 따라오고 화면도 저절로 넘어가요.</li><li>「− 글자 +」로 크기를, 「가」 버튼으로 글꼴을, 「🎵」 버튼으로 배경음악을 고를 수 있어요. 음악은 「음악 없이」를 고르면 꺼져요.</li><li>종이 성경(개역개정)으로 읽어도 체크돼요.</li><li>조용한 곳에서, 휴대폰을 입에서 30cm 안쪽에 두면 잘 돼요.</li></ol>
 <h3>Plaud 녹음기로 읽기</h3><ol style="padding-left:22px"><li>Plaud로 녹음하며 읽어요.</li><li>Plaud 앱에서 받아쓰기 글을 복사해요.</li><li>「목소리 → Plaud 받아쓰기로 체크하기」에 붙여 넣어요.</li><li>Plaud 앱에서 녹음 파일을 내보내 「녹음 파일 가져오기」로 넣으면 가족이 들을 수 있어요.</li></ol>
 <h3>자녀와 함께</h3><ol style="padding-left:22px"><li>「더보기 → 가족 추가」로 아이 이름을 넣으면 아이 기록이 따로 쌓여요.</li><li>「목소리」에서 엄마·아빠가 읽은 말씀을 아이에게 들려줄 수 있어요. 📤로 카톡에 보낼 수도 있어요.</li><li>잠자리에서 「자녀와 함께 잠언 31일」을 한 장씩 같이 읽어 보세요.</li></ol>
 <h3>개인정보</h3><ol style="padding-left:22px"><li>읽은 기록·묵상·녹음은 이 휴대폰 안에만 저장돼요. 앱이 따로 모으지 않아요.</li><li>음성 인식은 휴대폰에 들어 있는 구글·애플 음성 인식 기능을 써요.</li><li>휴대폰을 바꾸기 전에 「더보기 → 기록 파일 받기」를 해 두세요.</li></ol>
 <h3>성경 본문</h3><p>성경전서 개역한글판 (대한성서공회). 대한성서공회 안내에 따라 저작재산권 보호기간(2011년 12월 31일)이 끝난 본문이에요.</p>
 </div><p class="foot">말씀 낭독 ${VER}</p>`,{back:true});
}
