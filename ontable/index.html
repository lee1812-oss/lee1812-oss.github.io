<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>온식탁 · 우리 가족 따뜻한 식탁</title>
<meta name="theme-color" content="#d9773a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="온식탁">
<style>
:root{--ac:#d9773a;--ac2:#b85e26;--acl:#fbeee3;--bg:#f6f3ee;--card:#fff;--tx:#231d19;--tx2:#5b524b;--ln:#e7e0d7;--ok:#2f8f5b;--okl:#e6f4ec;--warn:#c9622f;--warnl:#fdeee4;--blue:#3b6fb6;--bluel:#e8f0fb;--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:var(--fs);line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
body.big{--fs:21px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--ln)}
.hd{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px);padding-top:calc(10px + env(safe-area-inset-top))}
.brand{font-weight:800;font-size:1.35em;letter-spacing:-.02em;color:var(--ac2)}
.brand small{display:block;font-size:.56em;font-weight:600;color:var(--tx2);letter-spacing:0;margin-top:-3px}
.hd .sp{flex:1}
.me{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:30px;background:#fff;border:1px solid var(--ln);min-height:48px;font-weight:700}
.av{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;flex:none;color:#fff;position:relative}
.av.sm{width:34px;height:34px;font-size:18px}
.av.lg{width:58px;height:58px;font-size:32px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.82em;font-weight:700;color:var(--tx2);position:relative}
nav.tabs button .i{font-size:1.5em;line-height:1.1}
nav.tabs button.on{color:var(--ac2)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--ac)}
.dot{position:absolute;top:8px;right:calc(50% - 26px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e0412f;color:#fff;font-size:12px;font-weight:800;display:none;align-items:center;justify-content:center}
.dot.on{display:flex}
h2{font-size:1.12em;margin:22px 4px 10px;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .more{margin-left:auto;font-size:.8em;color:var(--ac2);font-weight:700;padding:8px 4px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 1px 2px rgba(60,40,20,.04)}
.muted{color:var(--tx2)}
.small{font-size:.85em}
.btn{min-height:54px;padding:0 18px;border-radius:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#fff}
.btn.full{width:100%}
html,body{overflow-x:hidden}
.btn.line{background:#fff;color:var(--ac2);border:2px solid var(--ac)}
.btn.soft{background:var(--acl);color:var(--ac2)}
.btn.gray{background:#efebe6;color:var(--tx)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1}
.nw{white-space:nowrap}
/* 마음 */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.moods button{min-width:0;padding:4px 2px;line-height:1.25;min-height:84px;border-radius:14px;background:#faf8f5;border:2px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78em;font-weight:700;color:var(--tx2)}
.moods button .e{font-size:1.9em;line-height:1.2}
.moods button.on{border-color:var(--ac);background:var(--acl);color:var(--ac2)}
textarea,input[type=text],input[type=date],input[type=time]{width:100%;min-height:54px;border:2px solid var(--ln);border-radius:14px;padding:12px 14px;background:#fff;outline:none}
textarea{min-height:110px;resize:vertical;line-height:1.5}
textarea:focus,input:focus{border-color:var(--ac)}
.chk{display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 12px;border-radius:14px;background:var(--warnl);color:var(--warn);font-weight:700;margin:8px 0}
.chk input{width:26px;height:26px;accent-color:var(--warn)}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fm{background:#fff;border:2px solid var(--ln);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px}
.fm.hard{border-color:#f0a77c;background:#fff8f3}
.fm .top{display:flex;align-items:center;gap:8px;font-weight:800}
.fm .md{font-size:1.7em;margin-left:auto}
.fm .nt{font-size:.88em;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:20px;font-size:.78em;font-weight:800;white-space:nowrap}
.t-warn{background:var(--warnl);color:var(--warn)}
.t-ok{background:var(--okl);color:var(--ok)}
.t-blue{background:var(--bluel);color:var(--blue)}
.t-ac{background:var(--acl);color:var(--ac2)}
.t-gray{background:#efebe6;color:var(--tx2)}
/* 말씀 */
.word{background:linear-gradient(160deg,#fff 0%,#fff7ef 100%);border:1px solid #f0dcc6}
.word .vt{font-size:1.18em;line-height:1.7;font-weight:600;text-wrap:pretty;margin:6px 0 4px}
.word .vr{color:var(--ac2);font-weight:800}
/* 글 */
.post .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post .nm{font-weight:800}
.post .tm{font-size:.8em;color:var(--tx2)}
.post .bd{white-space:pre-wrap;text-wrap:pretty}
.post img.pic{width:100%;border-radius:14px;margin-top:10px;display:block;background:#eee;min-height:120px;object-fit:cover}
.reacts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.reacts button{min-width:0;min-height:58px;padding:2px;border-radius:14px;background:#f6f2ed;font-weight:700;font-size:.74em;line-height:1.2;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reacts button .e{font-size:1.45em}
.reacts button.on{background:var(--acl);border-color:var(--ac);color:var(--ac2)}
.who{font-size:.8em;color:var(--tx2);margin-top:6px}
.cmts{margin-top:12px;border-top:1px dashed var(--ln);padding-top:10px}
.cm{display:flex;gap:8px;margin:8px 0;align-items:flex-start}
.cm .b{background:#f6f2ed;border-radius:14px;padding:8px 12px;flex:1}
.cm .b b{font-size:.86em}
.cm .x{font-size:.8em;color:var(--tx2);padding:6px}
.cmin{display:flex;gap:6px;margin-top:8px}
.cmin input{flex:1}
.cmin button{min-width:70px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips button{flex:none;min-height:46px;padding:0 16px;border-radius:24px;background:#fff;border:2px solid var(--ln);font-weight:700;color:var(--tx2)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;min-height:60px;padding:0 22px;border-radius:30px;background:var(--ac);color:#fff;font-weight:800;box-shadow:0 6px 18px rgba(185,94,38,.35);display:flex;align-items:center;gap:6px}
.empty{text-align:center;color:var(--tx2);padding:28px 10px}
.empty .e{font-size:2.4em}
/* 기도 */
.pray.ans{border-color:#bfe2cd;background:#f7fcf9}
.ansbox{background:var(--okl);border-radius:14px;padding:10px 12px;margin-top:10px;color:#1f5f3c}
/* 밥상 */
.meal .dd{font-size:1.6em;font-weight:900;color:var(--ac2)}
.votes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.vt1{text-align:center;font-size:.78em;font-weight:700}
.vt1 .s{font-size:1.2em}
.vbtn{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vbtn button{min-height:54px;border-radius:14px;background:#f6f2ed;font-weight:800;border:2px solid transparent}
.vbtn button.on{border-color:var(--ac);background:var(--acl);color:var(--ac2)}
.q{font-size:1.2em;font-weight:700;line-height:1.6;text-wrap:pretty;margin:8px 0 12px}
/* 시트(아래에서 올라오는 창) */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(30,20,10,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .pn{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .pt{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet .pt h3{margin:0;font-size:1.2em;flex:1}
.sheet .cls{min-width:54px;min-height:54px;font-size:1.4em;border-radius:14px;background:#f3efea}
.lbl{font-weight:800;margin:14px 2px 6px;display:block}
.kinds{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kinds button{min-height:60px;border-radius:14px;background:#faf8f5;border:2px solid var(--ln);font-weight:800;text-align:left;padding:8px 12px}
.kinds button small{display:block;font-weight:600;color:var(--tx2);font-size:.75em}
.kinds button.on{border-color:var(--ac);background:var(--acl)}
.prev{position:relative;margin-top:8px}
.prev img{width:100%;border-radius:14px;display:block}
.prev button{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:20px;min-height:44px;padding:0 14px;font-weight:700}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pick button{min-height:64px;border-radius:16px;background:#faf8f5;border:2px solid var(--ln);font-weight:800;display:flex;align-items:center;gap:8px;padding:6px 10px}
.pick button.on{border-color:var(--ac);background:var(--acl)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2420;color:#fff;padding:14px 22px;border-radius:30px;font-weight:700;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;max-width:560px;margin:0 auto}
.intro h1{font-size:2em;margin:0 0 4px;color:var(--ac2)}
.loading{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--ln);padding:6px 14px;border-radius:20px;font-size:.8em;color:var(--tx2);z-index:40;display:none}
.loading.on{display:block}
.err{background:#fdecea;color:#b3261e;border-radius:14px;padding:12px;margin:10px 0;font-weight:700}
.sun{background:var(--bluel);border:1px solid #cfdcf2}
.ver{text-align:center;color:#a39a92;font-size:.75em;margin:26px 0 10px}
</style>
</head>
<body>
<div id="app"></div>
<div class="loading" id="loading">새 소식 확인 중…</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="pn" id="sheetIn"></div></div>
<script>
const VER='v001 · 2026-10-25';

const VERSES=[{"r":"빌립보서 4:13","t":"내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라"},{"r":"이사야 41:10","t":"두려워하지 말라 내가 너와 함께 함이라 놀라지 말라 나는 네 하나님이 됨이라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의 의로운 오른손으로 너를 붙들리라"},{"r":"잠언 3:5-6","t":"너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라 너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라"},{"r":"마태복음 11:28","t":"수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라"},{"r":"시편 23:1","t":"여호와는 나의 목자시니 내게 부족함이 없으리로다"},{"r":"예레미야 29:11","t":"여호와의 말씀이니라 너희를 향한 나의 생각을 내가 아나니 평안이요 재앙이 아니니라 너희에게 미래와 희망을 주는 것이니라"},{"r":"데살로니가전서 5:16-18","t":"항상 기뻐하라 쉬지 말고 기도하라 범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라"},{"r":"로마서 8:28","t":"우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라"},{"r":"요한복음 14:27","t":"평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것과 같지 아니하니라 너희는 마음에 근심하지도 말고 두려워하지도 말라"},{"r":"시편 46:1","t":"하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라"},{"r":"여호수아 1:9","t":"내가 네게 명령한 것이 아니냐 강하고 담대하라 두려워하지 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께 하느니라 하시니라"},{"r":"베드로전서 5:7","t":"너희 염려를 다 주께 맡기라 이는 그가 너희를 돌보심이라"},{"r":"시편 121:1-2","t":"내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올까 나의 도움은 천지를 지으신 여호와에게서로다"},{"r":"이사야 40:31","t":"오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리가 날개치며 올라감 같을 것이요 달음박질하여도 곤비하지 아니하겠고 걸어가도 피곤하지 아니하리로다"},{"r":"예레미야애가 3:22-23","t":"여호와의 인자와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다 이것들이 아침마다 새로우니 주의 성실하심이 크시도소이다"},{"r":"시편 133:1","t":"보라 형제가 연합하여 동거함이 어찌 그리 선하고 아름다운고"},{"r":"갈라디아서 6:2","t":"너희가 짐을 서로 지라 그리하여 그리스도의 법을 성취하라"},{"r":"에베소서 4:32","t":"서로 친절하게 하며 불쌍히 여기며 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라"},{"r":"히브리서 10:24","t":"서로 돌아보아 사랑과 선행을 격려하며"},{"r":"시편 118:24","t":"이 날은 여호와께서 정하신 것이라 이 날에 우리가 즐거워하고 기뻐하리로다"},{"r":"빌립보서 4:6-7","t":"아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라"},{"r":"시편 37:5","t":"네 길을 여호와께 맡기라 그를 의지하면 그가 이루시고"},{"r":"마태복음 6:33","t":"그런즉 너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라"},{"r":"로마서 12:15","t":"즐거워하는 자들과 함께 즐거워하고 우는 자들과 함께 울라"},{"r":"고린도후서 12:9","t":"내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라"},{"r":"시편 119:105","t":"주의 말씀 function kst(d){return new Date((d?d.getTime():Date.now())+9*3600e3).toISOString()}
function today(){return kst().slice(0,10)}
function pd(s){return new Date(String(s).replace(' ','T')+'+09:00')}
function ago(s){if(!s)return'';const d=pd(s),m=(Date.now()-d)/6e4;if(m<1)return'방금';if(m<60)return Math.floor(m)+'분 전';const ds=String(s).slice(0,10),t=String(s).slice(11,16);if(ds===today())return'오늘 '+t;const y=kst(new Date(Date.now()-864e5)).slice(0,10);if(ds===y)return'어제 '+t;return(+ds.slice(5,7))+'/'+(+ds.slice(8,10))+' '+t}
function dayLabel(ds){const d=pd(ds+' 12:00:00');const w='일월화수목금토'[new Date(d.getTime()+9*3600e3).getUTCDay()];return(+ds.slice(5,7))+'월 '+(+ds.slice(8,10))+'일 ('+w+')'}
function dday(ds){const n=Math.round((pd(ds+' 00:00:00')-pd(today()+' 00:00:00'))/864e5);return n===0?'오늘':n===1?'내일':n>0?'D-'+n:(-n)+'일 전'}
function fam(id){return S.fam.find(f=>f.id===id)||{id,name:'?',emo:'🙂',color:'#999',role:''}}
function av(id,cls){const f=fam(id);return`<span class="av ${cls||''}" style="background:${esc(f.color)}">${esc(f.emo)}</span>`}
function nm(id){return esc(fam(id).name)}
function names(arr){return arr.map(nm).join(', ')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function verseOfDay(){const n=Math.floor(pd(today()+' 00:00:00').getTime()/864e5);return VERSES[((n%VERSES.length)+VERSES.length)%VERSES.length]}

async function api(a,data){const r=await fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a,k:KEY,who:ME},data||{}))});return r.json()}
let busy=false;
async function load(silent){if(!KEY)return;if(!silent)$('#loading').classList.add('on');try{const j=await api('all');if(j.ok){S=j;LS.set('cache',j);safeRender()}else if(j.err==='key'){KEY='';LS.set('key','');render()}}catch(e){if(!silent)toast('인터넷 연결을 확인해 주세요')}finally{$('#loading').classList.remove('on')}}
async function act(a,data,msg){if(busy)return false;busy=true;try{const j=await api(a,data);if(!j.ok){toast(j.err==='big'?'사진이 너무 커요':'저장하지 못했어요. 다시 해 주세요');return false}if(msg)toast(msg);await load(true);return true}catch(e){toast('인터넷 연결을 확인해 주세요');return false}finally{busy=false}}
async function pulse(){if(!KEY||document.hidden)return;try{const j=await api('pulse');if(j.ok&&j.ver!==S.ver)await load(true)}catch(e){}}
setInterval(pulse,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pulse()});

const IMG={};
async function loadImgs(){for(const el of document.querySelectorAll('img[data-img]')){const id=el.dataset.img;if(IMG[id]){el.src=IMG[id];continue}
 if(el.dataset.ld)continue;el.dataset.ld=1;try{const r=await fetch(EXEC+'?a=img&k='+encodeURIComponent(KEY)+'&id='+encodeURIComponent(id));const j=await r.json();if(j.ok){IMG[id]='data:'+(j.t||'image/jpeg')+';base64,'+j.d;document.querySelectorAll(`img[data-img="${id}"]`).forEach(x=>x.src=IMG[id])}}catch(e){}}}
new MutationObserver(()=>loadImgs()).observe(document.getElementById('app'),{childList:true,subtree:true});
function bigImg(el){if(!el.src)return;openSheet(`<div class="pt"><h3>사진</h3><button class="cls" onclick="closeSheet()">✕</button></div><img src="${el.src}" style="width:100%;border-radius:14px">`)}
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=1280;let w=im.width,h=im.height;if(w>M||h>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

 ${p.ans?`<div class="ansbox"><b>감사해요!</b> ${ago(p.ans)}<br>${esc(p.ansText)}</div>`:''}
 <div class="row wrapr" style="margin-top:12px">${p.ans?'':`<button class="btn ${prayedToday?'ok':'soft'}" onclick="prayFor('${p.id}')">🙏 ${prayedToday?'오늘 기도했어요':'기도했어요'}</button>`}<span class="muted small">${p.pray.length?`모두 ${p.pray.length}번 기도 · ${names(who)}`:'아직 기도한 사람이 없어요'}</span></div>
 ${p.who===ME&&!p.ans?`<button class="btn line full" style="margin-top:10px" onclick="openAnswer('${p.id}')">🌿 기도 응답받았어요</button>`:''}
 ${cmtBlock(p)}</div>`}
async function prayFor(id){const p=S.posts.find(x=>x.id===id);if(p&&p.pray.some(x=>x.w===ME&&String(x.at).slice(0,10)===today())){toast('오늘 이미 기도했어요. 고마워요');return}await act('pray',{id},'기도해 줘서 고마워요')}
function openAnswer(id){openSheet(`<div class="pt"><h3>🌿 기도 응답 감사 나누기</h3><button class="cls" onclick="closeSheet()">✕</button></div><div class="muted small">어떻게 응답받았는지, 무엇이 감사한지 가족에게 나눠 주세요.</div><textarea id="ansText" maxlength="1000" placeholder="예: 면접 합격했어요! 함께 기도해 줘서 고마워요" style="margin-top:10px"></textarea><button class="btn ok full" style="margin-top:12px" onclick="sendAnswer('${id}')">감사 나누기</button>`)}
async function sendAnswer(id){const ok=await act('answer',{id,text:$('#ansText').value.trim()},'하나님께 감사! 응답을 나눴어요');if(ok)closeSheet()}

/* ---------- 밥상 ---------- */
function mealView(){const td=today();const up=S.posts.filter(p=>p.kind==='meal'&&p.meal&&p.meal.date>=td).sort((a,b)=>(a.meal.date+a.meal.time).localeCompare(b.meal.date+b.meal.time));const past=S.posts.filter(p=>p.kind==='meal'&&p.meal&&p.meal.date<td).slice(-5).reverse();
 let h=`<h2>🍚 다가오는 가족 밥상</h2>`;
 h+=up.length?up.map(p=>mealCard(p)).join(''):`<div class="empty"><div class="e">🍚</div>아직 잡힌 약속이 없어요.<br>오른쪽 아래 「밥상 약속 잡기」를 눌러 보세요.</div>`;
 h+=`<h2>💬 오늘의 식탁 대화</h2><div class="card"><div class="muted small">다 같이 밥 먹을 때 돌아가며 이야기해 보세요.</div><div class="q">「${esc(QUESTIONS[qIdx])}」</div><div class="row"><button class="btn gray grow" onclick="qIdx=(qIdx+1)%QUESTIONS.length;render()">🔄 다른 질문</button><button class="btn line grow" onclick="shareQ()">✏️ 내 답 나누기</button></div></div>`;
 if(past.length)h+=`<h2>🌙 지난 밥상</h2>`+past.map(p=>mealCard(p)).join('');
 return h}
function mealCard(p,compact){const m=p.meal;const v=m.v||{};const yes=S.fam.filter(f=>v[f.id]==='yes').length;const td=today();const past=m.date<td;
 return`<div class="card meal"><div class="row"><div class="grow"><div class="dd">${past?'지난 밥상':dday(m.date)} <span style="font-size:.6em;color:var(--tx)">${dayLabel(m.date)}${m.time?' '+esc(m.time):''}</span></div>
 <div>${m.place?'📍 '+esc(m.place):''}${m.menu?' · 🍽️ '+esc(m.menu):''}</div></div><span class="tag ${yes===S.fam.length?'t-ok':'t-ac'}">${yes}/${S.fam.length}명 가능</span></div>
 ${p.text?`<div class="muted" style="margin-top:6px">${nm(p.who)}: 「${esc(p.text)}」</div>`:`<div class="muted small" style="margin-top:6px">${nm(p.who)}님이 제안했어요</div>`}
 <div class="votes">${S.fam.map(f=>{const x=v[f.id];return`<div class="vt1">${av(f.id,'sm')}<div>${esc(f.name)}</div><div class="s">${x==='yes'?'✅':x==='no'?'❌':x==='maybe'?'🤔':'·'}</div></div>`}).join('')}</div>
 ${past?'':`<div class="vbtn">${[['yes','✅ 갈게요'],['maybe','🤔 아직 몰라'],['no','❌ 어려워요']].map(o=>`<button class="${v[ME]===o[0]?'on':''}" onclick="vote('${p.id}','${o[0]}')">${o[1]}</button>`).join('')}</div>`}
 ${compact?'':cmtBlock(p)}</div>`}
function shareQ(){openCompose('daily');setTimeout(()=>{$('#cpText').value='[식탁 대화] '+QUESTIONS[qIdx]+'\n'},50)}
async function vote(id,v){await act('vote',{id,v},v==='yes'?'함께해서 좋아요!':v==='no'?'다음에 꼭 같이 먹어요':'정해지면 알려 주세요')}
function openMeal(){const d=new Date(Date.now()+9*3600e3);const dw=d.getUTCDay();const toSat=(6-dw+7)%7||7;const sat=kst(new Date(Date.now()+toSat*864e5)).slice(0,10);
 openSheet(`<div class="pt"><h3>🍚 가족 밥상 약속 잡기</h3><button class="cls" onclick="closeSheet()">✕</button></div>
 <div class="muted small">날짜를 정해 올리면 가족이 「갈게요 / 어려워요」를 눌러요.</div>
 <span class="lbl">날짜</span><input type="date" id="mDate" value="${sat}" min="${today()}">
 <span class="lbl">시간</span><input type="time" id="mTime" value="18:30">
 <span class="lbl">어디서? (안 써도 돼요)</span><input type="text" id="mPlace" maxlength="60" placeholder="예: 우리 집, 교회 앞 식당">
 <span class="lbl">메뉴 (안 써도 돼요)</span><input type="text" id="mMenu" maxlength="60" placeholder="예: 엄마표 김치찌개">
 <span class="lbl">한마디</span><input type="text" id="mNote" maxlength="200" placeholder="예: 이번 주는 다 같이 저녁 먹자!">
 <button class="btn full" style="margin-top:16px" onclick="sendMeal()">가족에게 약속 올리기</button>`)}
async function sendMeal(){const d=$('#mDate').value;if(!d){toast('날짜를 골라 주세요');return}
 const ok=await act('post',{kind:'meal',text:$('#mNote').value.trim(),meal:{date:d,time:$('#mTime').value,place:$('#mPlace').value.trim(),menu:$('#mMenu').value.trim()}},'밥상 약속을 올렸어요');if(ok){closeSheet();go('meal')}}

/* ---------- 설정 ---------- */
function openSettings(){const link=location.origin+location.pathname+'?k='+encodeURIComponent(KEY);
 openSheet(`<div class="pt"><h3>⚙️ 설정</h3><button class="cls" onclick="closeSheet()">✕</button></div>
 <span class="lbl">나는 누구인가요?</span><div class="pick">${S.fam.map(f=>`<button class="${f.id===ME?'on':''}" onclick="pickMe('${f.id}');closeSheet()">${av(f.id,'sm')}${esc(f.name)}</button>`).join('')}</div>
 <span class="lbl">글자 크기</span><div class="vbtn" style="grid-template-columns:1fr 1fr"><button class="${document.body.classList.contains('big')?'':'on'}" onclick="setBig(0)">보통</button><button class="${document.body.classList.contains('big')?'on':''}" onclick="setBig(1)">크게</button></div>
 <span class="lbl">가족 초대하기</span><div class="muted small">이 링크를 가족 카톡방에 보내면 바로 들어올 수 있어요. 가족 밖으로는 보내지 마세요.</div>
 <button class="btn full" style="margin-top:8px" onclick="shareLink('${link}')">📤 초대 링크 보내기</button>
 <span class="lbl">가족 이름 바꾸기</span>${S.fam.map(f=>`<div class="row" style="margin:6px 0">${av(f.id,'sm')}<input type="text" id="fn_${f.id}" value="${esc(f.name)}" maxlength="12" style="flex:1.2"><input type="text" id="fr_${f.id}" value="${esc(f.role)}" maxlength="12" style="flex:1" placeholder="호칭"><input type="text" id="fe_${f.id}" value="${esc(f.emo)}" maxlength="4" style="width:64px;text-align:center"></div>`).join('')}
 <button class="btn line full" style="margin-top:8px" onclick="saveFam()">이름 저장</button>
 <span class="lbl">휴대폰 바탕화면에 앱 아이콘 만들기</span><div class="muted small">안드로이드: 크롬 오른쪽 위 ⋮ → 「홈 화면에 추가」 또는 「앱 설치」<br>아이폰: 사파리 아래 공유 버튼 → 「홈 화면에 추가」</div>
 <div class="ver">온식탁 ${VER}</div>`)}
function setBig(b){document.body.classList.toggle('big',!!b);LS.set('big',!!b);openSettings()}
async function shareLink(link){const text='우리 가족 따뜻한 식탁 「온식탁」에 들어와요 🍚\n'+link;try{if(navigator.share){await navigator.share({title:'온식탁',text});return}}catch(e){return}try{await navigator.clipboard.writeText(text);toast('링크를 복사했어요. 가족방에 붙여 넣어 주세요')}catch(e){prompt('이 링크를 복사해 주세요',link)}}
async function saveFam(){const list=S.fam.map(f=>({id:f.id,name:$('#fn_'+f.id).value.trim(),role:$('#fr_'+f.id).value.trim(),emo:$('#fe_'+f.id).value.trim()}));const ok=await act('fam',{list},'가족 이름을 저장했어요');if(ok)openSettings()}

/* 시트 */
function openSheet(html){$('#sheetIn').innerHTML=html;$('#sheet').classList.add('on');document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').classList.remove('on');document.body.style.overflow=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

render();load(!!S.fam.length);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
