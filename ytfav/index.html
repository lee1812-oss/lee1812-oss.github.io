<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유튜브 즐겨찾기</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="유튜브 즐겨찾기">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--red:#E3002B;--red2:#B80024;--ink:#111418;--sub:#4A5059;--line:#E3E6EA;--bg:#F4F5F7;--card:#FFFFFF;--soft:#F0F1F3;--ok:#1E7F45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.45;word-break:keep-all;overflow-wrap:break-word}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 120px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.hd{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:11px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small .cl{color:var(--ok);font-weight:700}
.ttl small .lc{color:#8A4B00;font-weight:700}
.btn{min-height:54px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:active{background:var(--red2)}
.btn.dark{background:#22262B;border-color:#22262B;color:#fff}
.btn.ghost{background:var(--soft);border-color:var(--soft)}
.btn.warn{background:#fff;border-color:#F2B8C0;color:#C4001F}
.btn.done{background:#E9F7EE;border-color:#E9F7EE;color:var(--ok)}
.btn.wide{width:100%}
.icon-btn{width:54px;height:54px;padding:0;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:24px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cats{display:flex;flex-wrap:wrap;gap:10px;padding:16px 0 6px}
.chip{min-height:50px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:18px;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:12px;height:12px;border-radius:50%}
.chip .n{color:var(--sub);font-weight:600;font-size:16px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .n{color:#D6D9DE}
.chip.add{border-style:dashed;color:var(--sub)}
.tools{display:flex;gap:10px;align-items:center;padding:8px 0 4px}
.find{flex:1;min-height:54px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 16px;font-size:18px;width:100%}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.sec .bar{width:6px;height:22px;border-radius:3px}
.sec .cnt{color:var(--sub);font-weight:600;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;min-height:96px}
.item .go{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left}
.thumb,.av{width:128px;height:72px;border-radius:12px;flex:none;overflow:hidden;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.av{display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:800}
.av img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.85)}
.meta{min-width:0;flex:1}
.meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:19px;font-weight:700;line-height:1.35}
.meta small{display:block;color:var(--sub);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:15px;color:var(--sub);font-weight:600}
.tag i{font-style:normal;padding:2px 9px;border-radius:999px;background:var(--soft);color:#333}
.tag i.live{background:#FDE7EA;color:#C4001F}
.empty{background:#fff;border:2px dashed var(--line);border-radius:18px;padding:30px 20px;text-align:center;color:var(--sub);font-size:18px}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.dim{position:fixed;inset:0;background:rgba(15,18,22,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.dim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:680px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.dim{align-items:center}.sheet{border-radius:24px}}
.sheet h2{margin:0 0 4px;font-size:23px;font-weight:800;display:flex;align-items:center;gap:10px}
.sheet h2 .x{margin-left:auto}
.sheet .lead{margin:0 0 14px;color:var(--sub);font-size:17px}
.step{display:inline-block;font-size:15px;font-weight:700;color:var(--red);margin-bottom:6px}
label.f{display:block;font-weight:700;margin:14px 0 8px}
.inp{width:100%;min-height:56px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;background:#fff}
.inp:focus,.find:focus{outline:none;border-color:#22262B}
textarea.inp{min-height:100px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-height:50px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.pick button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.pick .dot{width:14px;height:14px;border-radius:50%}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.colors button.on{box-shadow:0 0 0 3px var(--ink)}
.prev{display:flex;gap:14px;align-items:center;background:var(--soft);border-radius:16px;padding:12px;margin:4px 0 6px}
.note{background:#EEF4FF;color:#1F3B73;border-radius:14px;padding:12px 14px;font-size:16px;margin-top:14px}
.note.ok{background:#E9F7EE;color:#1E5B33}
.note.warn{background:#FFF3E5;color:#8A4B00}
.catrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow .nm{flex:1;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0}
.catrow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .nm .dot{width:16px;height:16px;border-radius:50%;flex:none}
.catrow .icon-btn{width:50px;height:50px;font-size:20px}
.hr{height:1px;background:var(--line);margin:18px 0}
/* 담기 창 */
.into{background:var(--soft);border-radius:16px;padding:12px 12px 14px;margin:6px 0 12px}
.into .lb{font-weight:800;font-size:16px;margin:0 0 8px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -4px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:50px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:17px;margin:0 2px}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.srow{display:flex;gap:8px;margin-bottom:10px}
.srow .inp{flex:1;min-width:0}
.res{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.res .thumb,.res .av{width:112px;height:63px}
.res .av img{width:50px;height:50px}
.res .btn{min-height:50px;padding:0 14px;font-size:17px;flex:none}
.wait{padding:30px 10px;text-align:center;color:var(--sub)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-5px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.bm{display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:0 18px;border-radius:14px;border:2px dashed var(--red);color:var(--red);font-weight:800;text-decoration:none;background:#fff;cursor:grab}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(220%);visibility:hidden;background:#22262B;color:#fff;border-radius:16px;padding:14px 16px 14px 20px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:14px;z-index:80;transition:transform .25s;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.toast button{min-height:44px;padding:0 14px;border-radius:10px;border:0;background:#fff;color:#111;font-weight:800}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 8px 24px rgba(227,0,43,.35);border-radius:999px;min-height:62px;padding:0 26px;font-size:20px}
@media(max-width:480px){.thumb,.av{width:104px;height:60px}.av{font-size:26px}.av img{width:48px;height:48px}.res .thumb,.res .av{width:96px;height:54px}.res .av img{width:44px;height:44px}.item{gap:10px}.item .go{gap:10px}.meta b{font-size:18px}.wrap{padding:0 12px 120px}.grid{grid-template-columns:1fr}.catrow{flex-wrap:wrap;justify-content:flex-end}.catrow .nm{flex:1 1 100%;margin-bottom:4px}.sheet{padding:18px 14px calc(22px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<header>
 <div class="hd">
  <img class="logo" src="icon-192.png?v=1" alt="">
  <div class="ttl"><h1>유튜브 즐겨찾기</h1><small id="sub">자주 가는 채널·영상을 한 번에</small></div>
  <button class="icon-btn" id="bSet" aria-label="설정">⚙</button>
 </div>
</header>
<div class="wrap">
 <div class="cats" id="cats"></div>
 <div class="tools" id="tools" style="display:none"><input class="find" id="find" placeholder="🔍 내 즐겨찾기에서 찾기" autocomplete="off"></div>
 <div id="list"></div>
</div>
<button class="btn red fab" id="bAdd">＋ 유튜브 담기</button>

<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="tbtn" style="display:none">되돌리기</button></div>

<script>
const VER='v002', UPD='2026.10.25';
const API='https://script.google.com/macros/s/AKfycby3X7q8busypLQJGRwRitG2vOF_9JDcmWNOi2MoW1AZsxns-7c79O4fujdpMl4WBdOLKw/exec';
const KEY='ytfav-data-v1', PKEY='ytfav-pref', TKEY='ytfav-tok';
const COLORS=['#E3002B','#F28C00','#E0B000','#1F9D55','#1A73E8','#6A3FC8','#D63384','#5F6B7A'];
const TYPE={channel:'채널',video:'영상',playlist:'재생목록',search:'검색',live:'생방송',shorts:'쇼츠',other:'유튜브'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unesc=s=>{const t=document.createElement('textarea');t.innerHTML=String(s||'');return t.value};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now=()=>Date.now();

// ---------- 저장 (이 기기 + 모든 기기 저장소) ----------
const MS='https://www.youtube.com/channel/UCOp1NMZk2VqnvuLZCHTay0Q', MSTH='https://yt3.ggpht.com/ytc/AIdro_lX_fMZLdOYltCt3iZB78mDcSMkhCcJfqXIb5CBtKrZ1w=s240-c-k-c0xffffffff-no-rj-mo';
function seed(){
 return {cats:[{id:'c1',name:'교회',color:COLORS[0],o:1,u:1},{id:'c2',name:'음악',color:COLORS[5],o:2,u:1},{id:'c3',name:'요리·베이킹',color:COLORS[1],o:3,u:1},{id:'c4',name:'공부·정보',color:COLORS[4],o:4,u:1}],
  items:[{id:'s1',title:'만성교회',url:MS,type:'channel',cat:'c1',o:1,u:2,th:MSTH},
   {id:'s2',title:'만성교회 생방송',url:MS+'/live',type:'live',cat:'c1',o:2,u:2}]};
}
let D; try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!D||!Array.isArray(D.items))D=seed();
let PF={}; try{PF=JSON.parse(localStorage.getItem(PKEY))||{}}catch(e){}
PF.cur=PF.cur||D.cur||'all';PF.open=PF.open||D.open||'app';delete D.cur;delete D.open;
// v001 자료 바꾸기 (순서 o, 고친 시각 u)
D.cats.forEach((c,i)=>{if(c.o==null)c.o=i+1;if(c.u==null)c.u=1});
D.items.forEach((x,i)=>{if(x.o==null)x.o=i+1;if(x.u==null)x.u=now()});
// 만성교회 기본 항목을 채널 번호 주소로 (손대지 않은 것만)
D.items.forEach(x=>{if(x.id==='s1'&&(x.u||0)<2){x.url=MS;x.th=MSTH;x.u=2}if(x.id==='s2'&&(x.u||0)<2){x.url=MS+'/live';x.u=2}});
let TOK=localStorage.getItem(TKEY)||'';
function save(){localStorage.setItem(KEY,JSON.stringify({cats:D.cats,items:D.items}));localStorage.setItem(PKEY,JSON.stringify(PF))}
const CT=()=>D.cats.filter(c=>!c.del).sort((a,b)=>a.o-b.o);
const IT=()=>D.items.filter(i=>!i.del).sort((a,b)=>a.o-b.o);
const touch=x=>{x.u=now();return x};
const maxO=a=>a.reduce((m,x)=>Math.max(m,x.o||0),0);

async function api(op,extra){
 const r=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({tok:TOK,op},extra||{}))});
 const j=await r.json(); if(!j.ok)throw new Error(j.err||'err'); return j;
}
let syncT,syncing=false,again=false,SYNC='';
function changed(){save();draw();if(TOK){clearTimeout(syncT);syncT=setTimeout(sync,600)}}
async function sync(){
 if(!TOK)return; if(syncing){again=true;return}
 syncing=true; SYNC='busy'; drawSub();
 try{const j=await api('put',{data:{cats:D.cats,items:D.items}});applyServer(j.data);SYNC='ok'}
 catch(e){SYNC=e.message==='auth'?'auth':'off'}
 syncing=false; drawSub(); if(again){again=false;sync()}
}
function applyServer(d){
 for(const k of ['cats','items']){const m=new Map(D[k].map(x=>[x.id,x]));for(const x of (d&&d[k])||[]){const l=m.get(x.id);if(!l||(x.u||0)>(l.u||0))m.set(x.id,x)}D[k]=[...m.values()]}
 // 같은 카테고리에 같은 주소가 두 번이면 하나만 남김
 const seen={};let dup=false;for(const x of IT()){const k=(x.cat||'')+'|'+x.url;if(seen[k]){x.del=true;touch(x);dup=true}else seen[k]=1}
 save();draw(); if(dup)sync();
}

// ---------- 유튜브 주소 해석 ----------
function findUrl(t){const m=String(t||'').match(/https?:\/\/[^\s"'<>]+/i);return m?m[0]:null}
function parse(raw){
 raw=String(raw||'').trim(); if(!raw)return null;
 let u=findUrl(raw);
 if(!u&&/^(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(raw))u='https://'+raw;
 if(!u&&/^@\S+$/.test(raw))u='https://www.youtube.com/'+raw;
 if(!u){return {type:'search',url:'https://www.youtube.com/results?search_query='+encodeURIComponent(raw),title:raw,q:raw}}
 let x; try{x=new URL(u)}catch(e){return null}
 const h=x.hostname.replace(/^(www\.|m\.|music\.)/,''); const p=x.pathname.split('/').filter(Boolean);
 if(h==='youtu.be'&&p[0])return vid(p[0]);
 if(!/youtube\.com$/.test(h))return {type:'other',url:x.href,title:x.hostname,ext:true};
 const v=x.searchParams.get('v'), list=x.searchParams.get('list');
 if(p[0]==='watch'&&v)return vid(v);
 if(p[0]==='shorts'&&p[1])return vid(p[1],'shorts');
 if(p[0]==='live'&&p[1])return vid(p[1],'live');
 if(p[0]==='playlist'&&list)return {type:'playlist',url:'https://www.youtube.com/playlist?list='+encodeURIComponent(list),title:'재생목록'};
 if(p[0]==='results'){const q=x.searchParams.get('search_query')||'';return {type:'search',url:x.href,title:q,q}}
 if(p[0]&&(p[0].startsWith('@')||p[0].startsWith('%40')||['channel','c','user'].includes(p[0]))){
  const isAt=!['channel','c','user'].includes(p[0]);
  const base=isAt?p[0]:p[0]+'/'+(p[1]||'');
  let name=isAt?p[0]:(p[1]||'채널'); try{name=decodeURIComponent(name)}catch(e){}
  name=name.replace(/^@/,''); if(p[0]==='channel')name='';
  const rest=p.slice(isAt?1:2); const live=rest[0]==='live';
  return {type:live?'live':'channel',url:'https://www.youtube.com/'+base+(live?'/live':''),title:name?name+(live?' 생방송':''):''};
 }
 return {type:'other',url:x.href,title:'유튜브'};
}
function vid(id,t){id=id.replace(/[^\w-]/g,'');return {type:t||'video',vid:id,url:t==='shorts'?'https://www.youtube.com/shorts/'+id:'https://www.youtube.com/watch?v='+id,title:'',needTitle:true}}
async function fetchTitle(url){try{const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent(url));const j=await r.json();return j&&j.title?{title:j.title}:null}catch(e){return null}}
function fromYT(r){ // 유튜브 목록(검색·구독 등) 한 줄 → 즐겨찾기 모양
 const t=unesc(r.title);
 if(r.kind==='video')return {type:r.live?'live':'video',vid:r.id,url:'https://www.youtube.com/watch?v='+r.id,title:t};
 if(r.kind==='channel')return {type:'channel',url:'https://www.youtube.com/channel/'+r.id,title:t,th:r.th};
 return {type:'playlist',url:'https://www.youtube.com/playlist?list='+r.id,title:t,th:r.th};
}

// ---------- 열기 (유튜브 앱으로) ----------
const isAndroid=/Android/i.test(navigator.userAgent), isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function openIt(it){
 const u=new URL(it.url).href;
 if(PF.open==='app'&&isAndroid&&!it.ext){location.href='intent://'+u.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent(u)+';end';return}
 if(PF.open==='app'&&isIOS&&!it.ext){let left=false;document.addEventListener('visibilitychange',()=>{left=true},{once:true});location.href=u.replace(/^https?:\/\//,'youtube://');setTimeout(()=>{if(!left&&document.visibilityState==='visible')window.open(u,'_blank')},1600);return}
 window.open(u,'_blank','noopener');
}

// ---------- 화면 ----------
const catOf=id=>D.cats.find(c=>c.id===id&&!c.del);
const nextColor=()=>COLORS.find(x=>!CT().some(c=>c.color===x))||COLORS[CT().length%COLORS.length];
function cnt(id){return IT().filter(i=>id==='all'?true:id==='none'?!catOf(i.cat):i.cat===id).length}
function drawSub(){
 const n=IT().length; let s=`${VER} · ${n}개 · `;
 if(!TOK)s+=`<span class="lc">이 기기에만 저장</span>`;
 else if(SYNC==='busy')s+=`<span class="cl">☁ 저장 중…</span>`;
 else if(SYNC==='off')s+=`<span class="lc">☁ 인터넷 확인 필요</span>`;
 else if(SYNC==='auth')s+=`<span class="lc">☁ 연결 다시 필요</span>`;
 else s+=`<span class="cl">☁ 모든 기기 연결됨</span>`;
 $('#sub').innerHTML=s;
}

 if(none)h+=`<button class="chip ${PF.cur==='none'?'on':''}" data-c="none"><span class="dot" style="background:#B8BEC6"></span>분류 없음 <span class="n">${none}</span></button>`;

function shade(hex){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.round(v*0.72));return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(f).map(v=>v.toString(16).padStart(2,'0')).join('')}
function thumb(it){
 if(it.vid)return `<div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/${esc(it.vid)}/mqdefault.jpg" alt=""></div>`;
 if(it.th&&it.type==='playlist')return `<div class="thumb"><img loading="lazy" src="${esc(it.th)}" alt=""></div>`;
 const c=catOf(it.cat);const col=c?c.color:'#8A929C';const bg=`background:linear-gradient(135deg,${col},${shade(col)})`;
 if(it.th)return `<div class="av" style="${bg}"><img loading="lazy" src="${esc(it.th)}" alt=""></div>`;
 const ic={live:'🔴',search:'🔍',playlist:'▶',other:'▶'}[it.type]||esc((it.title||'?').trim().charAt(0));
 return `<div class="av" style="${bg}">${ic}</div>`;
}
function card(it){

}
function drawList(){
 const q=($('#find').value||'').trim().toLowerCase(); const items=IT();

  const groups=[...CT().map(c=>({c,list:items.filter(i=>i.cat===c.id&&match(i))})),{c:null,list:items.filter(i=>!catOf(i.cat)&&match(i))}];

  if(!h)h=`<div class="empty"><b>「${esc(q)}」 찾는 결과가 없어요</b></div>`;
 } else {

  h=`<div class="sec"><span class="bar" style="background:${c?c.color:'#B8BEC6'}"></span>${c?esc(c.name):'분류 없음'} <span class="cnt">${list.length}개</span></div>`;

 }
 $('#list').innerHTML=h; drawSub();

  D.cats.push(touch({id:'c'+uid(),name:n.slice(0,20),color,o:maxO(D.cats)+1}));changed();catSheet();toast(`「${n}」 카테고리를 만들었어요`)};
 const swap=(a,b)=>{if(!a||!b)return;[a.o,b.o]=[b.o,a.o];touch(a);touch(b);changed();catSheet()};
 $('#sheet').querySelectorAll('[data-cu]').forEach(b=>b.onclick=()=>{const k=+b.dataset.cu;swap(cs[k],cs[k-1])});
 $('#sheet').querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>{const k=+b.dataset.cd;swap(cs[k],cs[k+1])});
 $('#sheet').querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>catEdit(b.dataset.ce));
 $('#sheet').querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{const c=catOf(b.dataset.cx);const n=cnt(c.id);
  if(!confirm(`「${c.name}」 카테고리를 지울까요?`+(n?`\n안에 있던 즐겨찾기 ${n}개는 지워지지 않고 「분류 없음」으로 옮겨져요.`:'')))return;
  c.del=true;touch(c);changed();catSheet();toast(`「${c.name}」 카테고리를 지웠어요`,()=>{c.del=false;touch(c);changed();catSheet()})});
}
function catEdit(id){
 const c=catOf(id);let color=c.color;
 sheet(`<h2>카테고리 바꾸기</h2>
 <label class="f" for="ceName">이름</label><input class="inp" id="ceName" value="${esc(c.name)}" maxlength="20">
 <label class="f">색</label><div class="colors" id="ceCol">${COLORS.map(x=>`<button data-col="${x}" class="${x===color?'on':''}" style="background:${x}" aria-label="색"></button>`).join('')}</div>
 <div class="row" style="margin-top:22px"><button class="btn" id="ceB">‹ 이전</button><button class="btn red" id="ceS">저장하기</button></div>`);
 $('#ceCol').querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{color=b.dataset.col;$('#ceCol').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
 $('#ceB').onclick=catSheet;
 $('#ceS').onclick=()=>{const n=$('#ceName').value.trim();if(!n){toast('이름을 적어 주세요');return}c.name=n;c.color=color;touch(c);changed();catSheet();toast('바꿨어요')};
}

// ===== 설정 =====
const BM=`javascript:(()=>{const t=document.title.replace(/^\\(\\d+\\)\\s*/,'').replace(/\\s*-\\s*YouTube$/,'');window.open('${location.origin}${location.pathname}?url='+encodeURIComponent(location.href)+'&title='+encodeURIComponent(t)+'&from=pc','ytfav','width=560,height=860')})()`;
function setSheet(){
 const link=TOK?location.origin+location.pathname+'#k='+TOK:'';
 sheet(`<h2>설정 <button class="icon-btn x" id="sX" aria-label="닫기">✕</button></h2><p class="lead">${VER} · 업데이트 ${UPD}</p>
 <label class="f" style="margin-top:0">☁ 모든 기기 연결 (휴대폰·PC·태블릿)</label>
 ${TOK?`<div class="note ok" style="margin-top:0">✅ 이 기기는 연결돼 있어요. 어느 기기에서 담아도 모든 기기에 똑같이 보여요. 내 유튜브(구독·좋아요·재생목록)도 불러올 수 있어요.</div>
  <p class="lead" style="margin:12px 0 10px">다른 기기를 연결하려면 아래 링크를 카톡 「나에게」로 보내고, 그 기기에서 한 번 열어 주세요.</p>
  <div class="row"><button class="btn dark" id="sLink">🔗 연결 링크 복사</button></div>`
 :`<div class="note warn" style="margin-top:0">이 기기는 아직 연결 전이에요. 지금은 이 기기에만 저장돼요.<br>연결된 기기의 ⚙ 설정에서 「연결 링크」를 받아 이 기기에서 열어 주세요.</div>`}
 <div class="hr"></div>
 <label class="f" style="margin-top:0">💻 PC에서 유튜브 보다가 바로 담기</label>
 <p class="lead" style="margin:0 0 10px">아래 빨간 테두리 버튼을 마우스로 꾹 눌러 <b>크롬 북마크바(즐겨찾기 줄)</b>로 끌어다 놓으세요. 유튜브를 보다가 그 버튼을 누르면 지금 보는 영상·채널이 바로 담겨요.</p>
 <a class="bm" id="bmA" href="#">⭐ 유튜브 즐겨찾기에 담기</a>
 <div class="hr"></div>
 <label class="f" style="margin-top:0">누르면 어디로 열까요?</label>
 <div class="pick" id="oPick"><button data-o="app" class="${PF.open==='app'?'on':''}">▶ 유튜브 앱으로 (추천)</button><button data-o="web" class="${PF.open==='web'?'on':''}">🌐 인터넷 창으로</button></div>
 <div class="hr"></div>
 <label class="f" style="margin-top:0">백업</label>
 <div class="row"><button class="btn ghost" id="sExp">💾 백업 파일 저장</button><button class="btn ghost" id="sImp">📂 백업 불러오기</button></div>
 <input type="file" id="sFile" accept=".json,application/json" style="display:none">
 ${TOK?`<div class="row" style="margin-top:18px"><button class="btn warn" id="sOff">이 기기 연결 끊기</button></div>`:''}`);
 $('#sX').onclick=close;
 const a=$('#bmA');a.setAttribute('href',BM);a.onclick=e=>{e.preventDefault();toast('누르지 말고 북마크바로 끌어다 놓아 주세요')};
 $('#oPick').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{PF.open=b.dataset.o;save();$('#oPick').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));toast(PF.open==='app'?'유튜브 앱으로 열게요':'인터넷 창으로 열게요')});
 if($('#sLink'))$('#sLink').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('복사했어요. 카톡 「나에게」에 붙여 넣으세요')}catch(e){prompt('길게 눌러 복사하세요',link)}};
 if($('#sOff'))$('#sOff').onclick=()=>{if(!confirm('이 기기의 연결을 끊을까요?\n즐겨찾기는 이 기기에 그대로 남고, 다른 기기와 같이 바뀌지 않게 돼요.'))return;TOK='';localStorage.removeItem(TKEY);close();draw()};
 $('#sExp').onclick=()=>{const b=new Blob([JSON.stringify({v:2,cats:CT(),items:IT()},null,1)],{type:'application/json'});const x=document.createElement('a');const d=new Date();
  x.href=URL.createObjectURL(b);x.download=`유튜브즐겨찾기_백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;x.click();toast('백업 파일을 저장했어요')};
 $('#sImp').onclick=()=>$('#sFile').click();
 $('#sFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{importData(JSON.parse(await f.text()))}catch(x){toast('백업 파일을 읽지 못했어요')}};
}
function importData(o){
 if(!o||!Array.isArray(o.items)){toast('가져올 내용이 없어요');return}
 if(!confirm(`즐겨찾기 ${o.items.length}개를 지금 것에 합칠까요? (같은 주소는 건너뜀)`))return;
 const map={};
 for(const c of (o.cats||[])){const same=CT().find(x=>x.name===c.name);if(same)map[c.id]=same.id;else{const nc=touch({id:'c'+uid(),name:c.name,color:c.color||nextColor(),o:maxO(D.cats)+1});D.cats.push(nc);map[c.id]=nc.id}}
 let n=0;for(const i of o.items){if(i.del||has(i.url))continue;D.items.push(touch(Object.assign({},i,{id:uid(),cat:map[i.cat]||'',o:maxO(D.items)+1})));n++}
 close();changed();toast(`${n}개를 가져왔어요`);
}

// ---------- 누르기 ----------
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-c]');if(c){PF.cur=c.dataset.c;save();draw();window.scrollTo({top:0});return}
 if(e.target.closest('#bCats')){catSheet();return}
 const o=e.target.closest('[data-open]');if(o){const it=D.items.find(i=>i.id===o.dataset.open);if(it)openIt(it);return}
 const ed=e.target.closest('[data-edit]');if(ed){editItem(ed.dataset.edit);return}
});
$('#bAdd').onclick=()=>addSheet();
$('#bSet').onclick=setSheet;
$('#find').addEventListener('input',drawList);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});

// ---------- 시작 ----------
(function(){
 if(location.hash.startsWith('#k=')){const k=location.hash.slice(3).replace(/[^\w]/g,'');history.replaceState(null,'',location.pathname+location.search);
  if(k){TOK=k;localStorage.setItem(TKEY,k);setTimeout(()=>toast('✅ 연결됐어요. 이제 모든 기기에 똑같이 보여요'),400)}}
 save();draw();sync();
 const sp=new URLSearchParams(location.search);const sh=[sp.get('text'),sp.get('url')].filter(Boolean).join(' ').trim();
 if(sh&&findUrl(sh)){const from=sp.get('from');history.replaceState(null,'',location.pathname);const u=findUrl(sh);
  let t=(sp.get('title')||'').trim(); const rest=sh.replace(u,'').trim(); if(!t&&rest&&!findUrl(rest))t=rest;
  const r=parse(u);if(r)confirmSheet(r,t,from==='pc'?'popup':'share')}
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
