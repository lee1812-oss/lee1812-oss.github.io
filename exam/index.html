<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#23211d;--sub:#7a766d;--line:#e8e5de;--ok:#2f8f5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px}
.hero{background:#23211d;color:#fff;border-radius:18px;padding:18px}
.hero .top{display:flex;justify-content:space-between;align-items:flex-end}
.dday{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1}
.hero small{opacity:.7;font-size:13px}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:#7ee0a8;border-radius:8px;transition:width .3s}
.stats{display:flex;gap:8px;margin-top:12px;font-size:13px}
.stats div{flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-size:18px}
h2{font-size:15px;margin:22px 4px 8px;color:var(--sub);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.dot{width:10px;height:34px;border-radius:5px;flex:none}
.sh .nm{flex:1;font-weight:700;font-size:16px}
.sh .pg{font-size:12px;color:var(--sub);text-align:right}
.mini{height:4px;background:var(--line)}
.mini i{display:block;height:100%}
.body{padding:4px 14px 14px;display:none;border-top:1px solid var(--line)}
.card.open .body{display:block}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-of-type{border-bottom:0}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid #c9c5bb;flex:none;display:grid;place-items:center;background:#fff;color:#fff;font-size:15px;cursor:pointer}
.it.done .ck{background:var(--ok);border-color:var(--ok)}
.it .t{flex:1;font-size:15px;word-break:break-all}
.it.done .t{text-decoration:line-through;color:#aaa69c}
.ib{border:0;background:none;font-size:18px;color:#c9c5bb;cursor:pointer;padding:4px 6px}
.ib.on{color:#f0a500}
.add{display:flex;gap:6px;margin-top:10px}
input,textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;background:#fcfbf8;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
button.p{border:0;background:#23211d;color:#fff;border-radius:10px;padding:0 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
button.s{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;color:var(--sub);cursor:pointer}
.empty{color:var(--sub);font-size:13.5px;padding:10px 0}
.today .it{padding:9px 0}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;color:#fff;flex:none}
.tw{flex:1;min-width:0}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.dl{background:#faf8f3;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0 4px}
.dlh{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.dlh span{font-size:12px;color:var(--sub)}
.dlt{font-size:14px;margin:8px 0 6px}
.dlt b{font-size:18px}
.dbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.dbar i{display:block;height:100%;background:#3a7be0;border-radius:8px;transition:width .3s}
.dbar i.full{background:var(--ok)}
.dgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.dd{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 0;text-align:center;font-size:11.5px;color:var(--sub);cursor:pointer;line-height:1.25}
.dd small{display:block;font-size:10.5px}
.dd.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dd.part{background:#fff4d6;border-color:#f0d58a;color:#8a6a00}
.dd.miss{background:#fbe9e7;border-color:#f3c4be;color:#b0473c}
.dd.sel{outline:2px solid #23211d}
.dd.tdy{font-weight:800}
.dlmini{padding:2px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dlmini .row{margin-top:8px}
button.s.run{background:#e0603a;color:#fff;border-color:#e0603a}
.gh{display:flex;align-items:center;gap:8px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:700;font-size:14.5px}
.gh .arr{width:14px;color:var(--sub);font-size:12px}
.gh .gp{margin-left:auto;font-size:12px;color:var(--sub);font-weight:500}
.gh.gdone .gnm{color:var(--ok)}
.gb{padding-left:10px;border-left:3px solid var(--line);margin:0 0 6px 4px}
.hint{font-size:12.5px;color:var(--sub);margin:6px 2px 0}
.bulk{display:none;margin-top:10px}
.bulk.show{display:block}
</style>
</head>

    S3("1번 · 고양이의 무차별적인 구조 본능","Unit 18 문단요약","[부교재 Unit 18 문단요약] 1번","Unit 18 문단요약|1번"),
    S3("4번 · 또래의 존재와 아동의 돕는 행동","Unit 18 문단요약","[부교재 Unit 18 문단요약] 4번","Unit 18 문단요약|4번"),
    S3("5번 · 시기심의 진짜 본질","Unit 18 문단요약","[부교재 Unit 18 문단요약] 5번","Unit 18 문단요약|5번"),
    S3("8번 · 기부에 있어 공감의 지속적인 힘","Unit 18 문단요약","[부교재 Unit 18 문단요약] 8번","Unit 18 문단요약|8번"),
    S3("9번 · 당신의 몸이 당신의 생각을 형성하는 방식","Unit 18 문단요약","[부교재 Unit 18 문단요약] 9번","Unit 18 문단요약|9번"),
    S3("31번","2026 10월 모의고사","[2026 10월 모의고사] 31번","2026 10월 모의고사|31번"),
    S3("32번","2026 10월 모의고사","[2026 10월 모의고사] 32번","2026 10월 모의고사|32번"),
    S3("35번","2026 10월 모의고사","[2026 10월 모의고사] 35번","2026 10월 모의고사|35번"),
    S3("37번","2026 10월 모의고사","[2026 10월 모의고사] 37번","2026 10월 모의고사|37번"),
    S3("40번","2026 10월 모의고사","[2026 10월 모의고사] 40번","2026 10월 모의고사|40번"),
    S3("본문 p.41~47","교과서 영어Ⅱ(능률) 2과","[교과서 영어Ⅱ(능률) 2과] 본문 p.41~47","교과서 영어Ⅱ(능률) 2과|본문 p.41~47")
  ]}
};
var S=load();

function mkItem(t){
  if(typeof t==="string")return {id:uid(),t:t,done:false,today:false};
  var o={id:uid(),t:t.t,done:false,today:false};
  if(t.g)o.g=t.g;
  if(t.steps){o.steps=t.steps;o.sd=t.steps.map(function(){return false;});}
  return o;
}
function migrate(s,sd,mode){
  var objs=sd.items.filter(function(x){return typeof x!=="string"&&x.old&&(mode==="old"||(mode==="o2"&&x.c3)||(mode==="o3"&&x.c4));});
  if(!objs.length)return;
  var by={};s.items.forEach(function(i){by[mode==="old"?i.t:(i.g||"")+"|"+i.t]=i;});
  var used={},out=[];
  objs.forEach(function(x){
    var n=mkItem(x),olds=x[mode==="old"?"old":mode].map(function(t){return by[t];});
    if(x.map){olds.forEach(function(o,k){if(o){used[o.id]=1;if(isDone(o))n.sd[k]=true;if(o.today)n.today=true;}});}
    else{var o=olds[0];if(o){used[o.id]=1;if(o.steps&&n.steps)n.sd=o.sd.slice();else if(o.done)n.done=true;if(o.today)n.today=true;}}
    out.push(n);
  });
  s.items=out.concat(s.items.filter(function(i){return !used[i.id];}));
}
function load(){
  var d=null;
  try{var r=localStorage.getItem(KEY);if(r){var x=JSON.parse(r);if(x&&x.length)d=x;}}catch(e){}
  if(!d)d=NAMES.map(function(n,i){return{id:"s"+i,name:n,color:COLORS[i],open:false,items:[]};});
  d.forEach(function(s){
    var sd=SEEDS[s.name];if(!sd)return;
    s.seeded=s.seeded||[];
    if(s.seeded.indexOf(sd.key)<0){
      sd.items.forEach(function(t){s.items.push(mkItem(t));});
      s.seeded.push(sd.key);s.open=true;s.layout=LAY;
    }else if((s.layout||0)<LAY){
      var l=s.layout||0;
      if(l<2)migrate(s,sd,"old");
      else{if(l<3)migrate(s,sd,"o2");if(l<4)migrate(s,sd,"o3");}
      sd.items.forEach(function(x){if(typeof x!=="string"&&x.add&&l<x.add)s.items.push(mkItem(x));});
      if(l<5&&s.name==="영어2")s.items.forEach(function(i){if(i.g&&i.steps&&i.t.indexOf(" · ")>0)i.t=i.t.replace(/ · [^()]*\((.+)\)$/," · $1");});
      s.layout=LAY;
    }
  });
  try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function daysLeft(){
  var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var p=EXAM.split("-"),e=new Date(+p[0],+p[1]-1,+p[2]);
  return Math.round((e-t)/86400000);
}
var DKEY="exam-todo-v001-daily";
var DAILY={"미적분":120};
var START="2026-11-17";
var D=loadD();
function loadD(){try{var r=localStorage.getItem(DKEY);if(r){var x=JSON.parse(r);if(x&&x.m)return x;}}catch(e){}return{m:{},run:null,sel:null};}
function saveD(){try{localStorage.setItem(DKEY,JSON.stringify(D));}catch(e){}}
function dstr(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function todayStr(){return dstr(new Date());}
function dayList(){var a=[],p=START.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);while(dstr(d)<EXAM){a.push(dstr(d));d.setDate(d.getDate()+1);}return a;}
function curMin(date){var m=D.m[date]||0;if(D.run&&D.run.date===date)m+=Math.floor((Date.now()-D.run.t)/60000);return m;}
function fmt(m){var h=Math.floor(m/60),r=m%60;return (h?h+"시간":"")+((r||!h)?(h?" ":"")+r+"분":"");}
function dsel(d){D.sel=d;saveD();updDaily();}
function dadd(n){var d=D.sel||todayStr();D.m[d]=Math.max(0,(D.m[d]||0)+n);saveD();updDaily();}
function dstart(){if(!D.run)D.run={date:todayStr(),t:Date.now()};saveD();updDaily();}
function dstop(){if(D.run){var m=Math.floor((Date.now()-D.run.t)/60000);D.m[D.run.date]=(D.m[D.run.date]||0)+m;D.run=null;}saveD();updDaily();}
function timerBtn(){return D.run?'<button class="s run" onclick="dstop()">■ 멈추고 저장</button>':'<button class="s" onclick="dstart()">▶ 공부 시작</button>';}
function dailyHTML(goal){
  var t=todayStr(),sel=D.sel||t,m=curMin(sel),pct=Math.min(100,Math.round(m/goal*100));
  var days=dayList(),ok=0,st=0,k;
  days.forEach(function(x){if(x<=t&&curMin(x)>=goal)ok++;});
  var idx=days.indexOf(t);if(idx<0)idx=days.length-1;
  if(idx>=0&&curMin(days[idx])<goal)idx--;
  for(k=idx;k>=0&&k<days.length&&curMin(days[k])>=goal;k--)st++;
  var lab=sel===t?"오늘":sel.slice(5).replace("-","/")+" 기록";
  var g=days.map(function(x){
    var mm=curMin(x),c="dd";
    if(mm>=goal)c+=" ok";else if(mm>0)c+=" part";else if(x<t)c+=" miss";
    if(x===sel)c+=" sel";if(x===t)c+=" tdy";
    return '<div class="'+c+'" onclick="dsel(\''+x+'\')">'+x.slice(5).replace("-","/")+'<small>'+(mm>=goal?"✓":(mm?mm+"분":"·"))+'</small></div>';}).join("");
  return '<div class="dl"><div class="dlh"><b>📐 매일 최소 '+fmt(goal)+'</b><span>'+ok+'일 달성 · 연속 '+st+'일</span></div>'+
    '<div class="dlt">'+lab+' <b>'+fmt(m)+'</b> / '+fmt(goal)+(m>=goal?' ✅':'')+'</div>'+
    '<div class="dbar"><i class="'+(m>=goal?'full':'')+'" style="width:'+pct+'%"></i></div>'+
    '<div class="row">'+timerBtn()+'<button class="s" onclick="dadd(30)">+30분</button><button class="s" onclick="dadd(60)">+1시간</button><button class="s" onclick="dadd(-30)">−30분</button></div>'+
    '<div class="dgrid">'+g+'</div>'+
    '<p class="hint">칸을 누르면 그 날의 시간을 고칠 수 있어요. 공부 시작을 누르고 앱을 닫아도 시간은 계속 가요. 위 진행률에는 포함되지 않아요.</p></div>';
}
function updDaily(){
  var t=todayStr(),box=document.getElementById("dlToday"),mh="";
  S.forEach(function(s){
    var goal=DAILY[s.name];if(!goal)return;
    var m=curMin(t),pct=Math.min(100,Math.round(m/goal*100));
    mh+='<div class="dlmini"><div class="dlt">📐 '+esc(s.name)+' 오늘 <b>'+fmt(m)+'</b> / '+fmt(goal)+(m>=goal?' ✅':'')+'</div><div class="dbar"><i class="'+(m>=goal?'full':'')+'" style="width:'+pct+'%"></i></div><div class="row">'+timerBtn()+'</div></div>';
    var el=document.getElementById("dl-"+s.id);if(el)el.innerHTML=dailyHTML(goal);
    var pg=document.getElementById("pg-"+s.id);if(pg)pg.innerHTML='오늘 '+fmt(m)+'<br>/ '+fmt(goal);
  });
  if(box)box.innerHTML=mh;
}
setInterval(function(){if(D.run)updDaily();},20000);
function groupsOf(s){
  var list=[],map={},un=[];
  s.items.forEach(function(i){
    if(!i.g){un.push(i);return;}
    if(!map[i.g]){map[i.g]={name:i.g,items:[]};list.push(map[i.g]);}
    map[i.g].items.push(i);
  });
  return {un:un,list:list};
}
function tgg(sid,gi){var s=find(sid),g=groupsOf(s).list[gi];s.go=s.go||{};s.go[g.name]=!s.go[g.name];save();render();}
function isDone(i){return i.steps?i.sd.every(Boolean):!!i.done;}
function units(i){return i.steps?i.steps.length:1;}
function doneU(i){return i.steps?i.sd.filter(Boolean).length:(i.done?1:0);}
function find(sid){return S.filter(function(s){return s.id===sid;})[0];}

function render(){
  var dl=daysLeft(),total=0,done=0;
  S.forEach(function(s){s.items.forEach(function(i){total+=units(i);done+=doneU(i);});});
  var left=total-done;
  document.getElementById("exam").textContent=EXAM.replace(/-/g,".");
  document.getElementById("dd").textContent=dl>0?"D-"+dl:(dl===0?"D-DAY":"D+"+(-dl));
  var pc=total?Math.round(done/total*100):0;
  document.getElementById("pct").textContent=pc+"%";
  document.getElementById("pbar").style.width=pc+"%";
  document.getElementById("sDone").textContent=done+"개";
  document.getElementById("sLeft").textContent=left+"개";
  var pace=(dl>0&&left>0)?Math.ceil(left/dl):0;
  document.getElementById("sPace").textContent=total?(left===0?"완료!":(dl>0?pace+"개":"-")):"-";
  document.title="2학기 기말고사 ("+document.getElementById("dd").textContent+")";

  // today
  var th="",cnt=0;
  S.forEach(function(s){s.items.forEach(function(i){
    if(i.today){cnt++;th+=itemHTML(s,i,true);}
  });});
  document.getElementById("todayList").innerHTML=cnt?th:'<div class="empty">아직 없어요. 과목 안의 ⭐을 눌러 오늘 할 일을 골라보세요.</div>';

  // subjects
  var h="";
  S.forEach(function(s){
    var d=0,n=0;s.items.forEach(function(i){n+=units(i);d+=doneU(i);});
    var p=n?Math.round(d/n*100):0;
    h+='<div class="card'+(s.open?' open':'')+'" data-s="'+s.id+'">'+
      '<div class="sh" onclick="tog(\''+s.id+'\')"><div class="dot" style="background:'+s.color+'"></div>'+
      '<div class="nm">'+esc(s.name)+'</div><div class="pg" id="pg-'+s.id+'">'+d+' / '+n+'<br>'+p+'%</div></div>'+
      '<div class="mini"><i style="width:'+p+'%;background:'+s.color+'"></i></div>'+
      '<div class="body">';
    if(DAILY[s.name])h+='<div id="dl-'+s.id+'"></div>';
    if(!n)h+='<div class="empty">'+(DAILY[s.name]?'시험범위(단원)가 정해지면 여기에 추가할 수 있어요.':'시험범위를 추가해주세요.')+'</div>';
    var gs=groupsOf(s);
    gs.un.forEach(function(i){h+=itemHTML(s,i,false);});
    gs.list.forEach(function(g,gi){
      var gd=0,gn=0,op=s.go&&s.go[g.name];
      g.items.forEach(function(i){gn+=units(i);gd+=doneU(i);});
      h+='<div class="gh'+(gn&&gd===gn?' gdone':'')+'" onclick="tgg(\''+s.id+'\','+gi+')"><span class="arr">'+(op?'▾':'▸')+'</span><span class="gnm">'+esc(g.name)+'</span><span class="gp">'+gd+' / '+gn+'</span></div>';
      if(op){h+='<div class="gb">';g.items.forEach(function(i){h+=itemHTML(s,i,false);});h+='</div>';}
    });
    h+='<div class="add"><input id="in-'+s.id+'" placeholder="단원/범위 추가 (예: 1단원 p.10~35)" onkeydown="if(event.key===\'Enter\')addOne(\''+s.id+'\')">'+
      '<button class="p" onclick="addOne(\''+s.id+'\')">추가</button></div>'+
      '<div class="row"><button class="s" onclick="tb(\''+s.id+'\')">📋 범위 한 번에 붙여넣기</button>'+
      '<button class="s" onclick="clearDone(\''+s.id+'\')">완료 항목 지우기</button></div>'+
      '<div class="bulk" id="bk-'+s.id+'"><textarea id="ta-'+s.id+'" placeholder="한 줄에 하나씩 붙여넣으세요&#10;예)&#10;1단원 수열의 극한&#10;2단원 미분법"></textarea>'+
      '<div class="row"><button class="p" style="padding:9px 14px" onclick="addBulk(\''+s.id+'\')">줄별로 추가</button></div></div>'+
      '</div></div>';
  });
  document.getElementById("subjects").innerHTML=h;
  updDaily();
}

function itemHTML(s,i,showTag){
  var dn=isDone(i),chips="";
  if(i.steps){chips='<div class="chips">'+i.steps.map(function(n,k){
    return '<span class="chip'+(i.sd[k]?' on':'')+'" onclick="stp(\''+s.id+'\',\''+i.id+'\','+k+')">'+(i.sd[k]?'✓ ':'')+esc(n)+'</span>';}).join('')+'</div>';}
  return '<div class="it'+(dn?' done':'')+'">'+
    '<div class="ck" onclick="chk(\''+s.id+'\',\''+i.id+'\')">'+(dn?'✓':'')+'</div>'+
    (showTag?'<span class="tag" style="background:'+s.color+'">'+esc(s.name.length>6?s.name.slice(0,5)+'…':s.name)+'</span>':'')+
    '<div class="tw"><div class="t"'+(i.steps?'':' onclick="chk(\''+s.id+'\',\''+i.id+'\')"')+'>'+esc((showTag&&i.g?i.g+' · ':'')+i.t)+'</div>'+chips+'</div>'+
    '<button class="ib'+(i.today?' on':'')+'" onclick="star(\''+s.id+'\',\''+i.id+'\')">'+(i.today?'★':'☆')+'</button>'+
    (showTag?'':'<button class="ib" onclick="del(\''+s.id+'\',\''+i.id+'\')">✕</button>')+
  '</div>';
}

function tog(id){var s=find(id);s.open=!s.open;save();render();}
function getIt(sid,iid){return find(sid).items.filter(function(i){return i.id===iid;})[0];}
function chk(sid,iid){var it=getIt(sid,iid);
  if(it.steps){var v=!isDone(it);it.sd=it.sd.map(function(){return v;});}else it.done=!it.done;
  if(isDone(it))it.today=false;save();render();}
function stp(sid,iid,k){var it=getIt(sid,iid);it.sd[k]=!it.sd[k];if(isDone(it))it.today=false;save();render();}
function star(sid,iid){var it=find(sid).items.filter(function(i){return i.id===iid;})[0];it.today=!it.today;save();render();}
function del(sid,iid){var s=find(sid);s.items=s.items.filter(function(i){return i.id!==iid;});save();render();}
function addOne(sid){
  var el=document.getElementById("in-"+sid),v=el.value.trim();if(!v)return;
  find(sid).items.push({id:uid(),t:v,done:false,today:false});save();render();
  var e2=document.getElementById("in-"+sid);if(e2)e2.focus();
}
function tb(sid){document.getElementById("bk-"+sid).classList.toggle("show");}
function addBulk(sid){
  var v=document.getElementById("ta-"+sid).value.split("\n");
  v.forEach(function(l){l=l.trim();if(l)find(sid).items.push({id:uid(),t:l,done:false,today:false});});
  save();render();
}
function clearDone(sid){var s=find(sid);s.items=s.items.filter(function(i){return !isDone(i);});save();render();}
render();
</script>
