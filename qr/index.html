<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>QR 바로 찍기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=4">
<link rel="apple-touch-icon" href="icon-192.png?v=4">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111827;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#111827;word-break:keep-all;overflow-wrap:break-word}
#cam{position:fixed;inset:0;overflow:hidden;background:#000}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;left:50%;top:44%;width:min(70vw,70vh,340px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.frame::before,.frame::after{content:"";position:absolute;inset:0;border-radius:22px;border:4px solid #fff;opacity:.95}
.frame.hit::before{border-color:#22c55e}
.line{position:absolute;left:8%;right:8%;height:3px;background:#22c55e;border-radius:3px;top:10%;animation:mv 2s ease-in-out infinite alternate;box-shadow:0 0 12px #22c55e}
@keyframes mv{to{top:88%}}
.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.top b{font-size:20px}
.top small{font-size:14px;opacity:.7}
.hint{position:absolute;left:0;right:0;top:calc(44% + min(35vw,35vh,170px) + 18px);text-align:center;color:#fff;font-size:19px;font-weight:600;text-shadow:0 1px 4px #000;padding:0 20px}
.bar{position:absolute;left:0;right:0;bottom:0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:10px;justify-content:center}
.bar button{flex:1;max-width:170px;min-height:62px;border:0;border-radius:16px;background:rgba(255,255,255,.16);color:#fff;font-size:17px;font-weight:700;backdrop-filter:blur(6px)}
.bar button.on{background:#facc15;color:#111827}
.bar button:active{transform:scale(.97)}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;background:#fff;border-radius:24px 24px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(110%);transition:transform .22s ease;max-height:88vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.sheet.show{transform:none}
.kind{display:inline-block;font-size:15px;font-weight:700;padding:5px 12px;border-radius:999px;background:#dcfce7;color:#166534;margin-bottom:10px}
.kind.txt{background:#e5e7eb;color:#374151}
.kind.warn{background:#fee2e2;color:#991b1b}
.val{font-size:19px;line-height:1.5;color:#111827;background:#f3f4f6;border-radius:14px;padding:14px 16px;word-break:break-all;max-height:30vh;overflow:auto;user-select:text}
.host{font-size:24px;font-weight:800;margin:0 0 8px;word-break:break-all}
.note{font-size:16px;color:#b45309;margin:10px 2px 0;line-height:1.5}
.btns{display:grid;gap:10px;margin-top:16px}
.btns button{min-height:60px;border-radius:16px;border:2px solid #d1d5db;background:#fff;font-size:19px;font-weight:700;color:#111827}
.btns button.main{background:#16a34a;border-color:#16a34a;color:#fff;font-size:21px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:#111827;color:#fff;font-size:17px;padding:12px 20px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:.95}
.page{position:fixed;inset:0;background:#f3f4f6;overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 10px) 16px 30px}
.page.show{display:block}
.page h2{font-size:24px;margin:10px 0 14px;display:flex;justify-content:space-between;align-items:center}
.page h2 button{min-height:54px;padding:0 18px;border-radius:14px;border:2px solid #d1d5db;background:#fff;font-size:17px;font-weight:700}
.item{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;border:1px solid #e5e7eb;font-size:17px;line-height:1.45;word-break:break-all;width:100%;text-align:left;display:block;color:#111827}
.item small{display:block;color:#6b7280;font-size:14px;margin-top:4px}
.empty{color:#6b7280;font-size:18px;text-align:center;padding:40px 0}
.msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#111827}
.msg.show{display:flex}
.msg div{background:#fff;border-radius:20px;padding:24px 20px;max-width:440px;font-size:18px;line-height:1.6}
.msg b{font-size:22px;display:block;margin-bottom:8px}
.msg button{width:100%;min-height:60px;margin-top:14px;border-radius:16px;border:0;background:#16a34a;color:#fff;font-size:19px;font-weight:700}
.opt{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;font-size:18px;font-weight:600;border:1px solid #e5e7eb}
.opt input{width:28px;height:28px}
</style>
</head>
<body>
<div id="cam">
  <video id="v" playsinline muted autoplay></video>
  <div class="frame" id="frame"><div class="line"></div></div>
  <div class="top"><b>QR 바로 찍기</b><small>v004</small></div>
  <div class="hint" id="hint">네모 안에 QR을 비춰 주세요</div>
  <div class="bar">
    <button id="bLight" style="display:none">손전등</button>
    <button id="bPhoto">사진에서 찾기</button>
    <button id="bHist">찍은 기록</button>
  </div>
  <div class="msg" id="msg"><div><b id="msgT"></b><span id="msgB"></span><button id="msgBtn">다시 시도</button><button id="msgPhoto" style="background:#fff;color:#111827;border:2px solid #d1d5db">사진에서 QR 찾기</button></div></div>
</div>

<div class="sheet" id="sheet">
  <span class="kind" id="kind">인터넷 주소</span>
  <p class="host" id="host"></p>
  <div class="val" id="val"></div>
  <p class="note" id="note" style="display:none"></p>
  <div class="btns" id="btns"></div>
</div>

<div class="page" id="hist">
  <h2>찍은 기록 <button id="bBack">← 카메라</button></h2>
  <label class="opt">주소 QR은 찍자마자 바로 열기 <input type="checkbox" id="autoOpen"></label>
  <div id="list"></div>
  <div class="btns"><button id="bClear">기록 모두 지우기</button></div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>
<canvas id="cv" hidden></canvas>

<script>
const $=id=>document.getElementById(id);
const video=$('v'),cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
let stream=null,track=null,detector=null,scanning=false,timer=null,torch=false,lastCode='',lastAt=0;
const HKEY='qr_hist_v1',AKEY='qr_auto_v1';

// QR 읽는 도구: 휴대폰 내장 기능이 있으면 그걸, 없으면 jsQR
async function setupDetector(){
  if('BarcodeDetector' in window){
    try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code')){detector=new BarcodeDetector({formats:['qr_code']});return}}catch(e){}
  }
  if(!window.jsQR){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='jsQR.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
}
async function decodeSource(src,w,h){
  if(detector){
    const r=await detector.detect(src);return r.length?r[0].rawValue:null;
  }
  const max=800,sc=Math.min(1,max/Math.max(w,h));
  cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
  ctx.drawImage(src,0,0,cv.width,cv.height);
  const d=ctx.getImageData(0,0,cv.width,cv.height);
  const r=jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'});
  return r?r.data:null;
}

async function startCam(){
  $('msg').classList.remove('show');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    const deny=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    showMsg(deny?'카메라를 허용해 주세요':'카메라를 켤 수 없어요',
      deny?'주소창 왼쪽 자물쇠(또는 설정) → 권한 → 카메라 「허용」으로 바꾼 뒤 「다시 시도」를 눌러 주세요. 카카오톡·네이버 앱 안에서 열었다면 「다른 브라우저로 열기」(Chrome·삼성 인터넷)로 열어 주세요.'
          :'다른 앱이 카메라를 쓰고 있을 수 있어요. 그 앱을 닫고 「다시 시도」를 눌러 주세요.');
    return;
  }
  video.srcObject=stream;await video.play().catch(()=>{});
  track=stream.getVideoTracks()[0];
  try{const c=track.getCapabilities?track.getCapabilities():{};$('bLight').style.display=c.torch?'':'none';
    if(c.focusMode&&c.focusMode.includes('continuous'))track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});}catch(e){}
  if(!$('sheet').classList.contains('show')&&!$('hist').classList.contains('show')){scanning=true;loop()}
}
function stopCam(){scanning=false;clearTimeout(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;track=null}torch=false;$('bLight').classList.remove('on')}
async function loop(){
  if(!scanning)return;
  if(video.readyState>=2&&video.videoWidth){
    try{const code=await decodeSource(video,video.videoWidth,video.videoHeight);if(code&&scanning)return found(code)}catch(e){}
  }
  timer=setTimeout(loop,120);
}
function showMsg(t,b){$('msgT').textContent=t;$('msgB').textContent=b;$('msg').classList.add('show')}

// 찍힌 내용 정리
function parse(code){
  const s=code.trim();
  if(/^https?:\/\//i.test(s)){let host='';try{host=new URL(s).hostname}catch(e){}return{type:'url',url:s,host}}
  if(/^www\./i.test(s))return{type:'url',url:'https://'+s,host:s.split('/')[0]};
  if(/^WIFI:/i.test(s)){const g=k=>{const m=s.match(new RegExp('[;:]'+k+':((?:\\\\.|[^;])*)','i'));return m?m[1].replace(/\\(.)/g,'$1'):''};return{type:'wifi',ssid:g('S'),pw:g('P')}}
  if(/^tel:/i.test(s))return{type:'tel',url:s,num:s.slice(4)};
  if(/^(mailto|sms|smsto|geo|market|intent|kakao\w*|nmap|naver\w*):/i.test(s))return{type:'link',url:s};
  return{type:'text'};
}
function found(code){
  const now=Date.now();
  if(code===lastCode&&now-lastAt<1500){timer=setTimeout(loop,300);return}
  lastCode=code;lastAt=now;scanning=false;
  if(navigator.vibrate)navigator.vibrate(80);
  $('frame').classList.add('hit');
  addHist(code);
  const p=parse(code);
  if(p.type==='url'&&localStorage.getItem(AKEY)==='1'){openUrl(p.url);showResult(code,p);return}
  showResult(code,p);
}
function btn(label,fn,cls){const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b}
function showResult(code,p){
  const k=$('kind'),h=$('host'),n=$('note'),bs=$('btns');
  bs.innerHTML='';n.style.display='none';h.style.display='none';k.className='kind';
  $('val').textContent=code;
  if(p.type==='url'){
    k.textContent='인터넷 주소';h.textContent=p.host;h.style.display='';
    if(/^http:/i.test(p.url)){n.textContent='보안 연결(https)이 아닌 주소예요. 처음 보는 곳이면 열기 전에 주소를 한 번 확인해 주세요.';n.style.display=''}
    bs.append(btn('열기',()=>openUrl(p.url),'main'));
  }else if(p.type==='wifi'){
    k.textContent='와이파이';h.textContent=p.ssid||'(이름 없음)';h.style.display='';
    $('val').textContent=p.pw?('비밀번호: '+p.pw):'비밀번호 없음';
    n.textContent='휴대폰 설정 → 와이파이에서 위 이름을 고르고 비밀번호를 붙여 넣어 주세요.';n.style.display='';
    if(p.pw)bs.append(btn('비밀번호 복사',()=>copy(p.pw),'main'));
  }else if(p.type==='tel'){
    k.textContent='전화번호';h.textContent=p.num;h.style.display='';
    bs.append(btn('전화 걸기',()=>{location.href=p.url},'main'));
  }else if(p.type==='link'){
    k.textContent='앱 연결';bs.append(btn('열기',()=>{location.href=p.url},'main'));
  }else{k.textContent='글자';k.className='kind txt'}
  const r=document.createElement('div');r.className='row';
  r.append(btn('복사',()=>copy(p.type==='url'?p.url:code)));
  if(navigator.share)r.append(btn('보내기',()=>navigator.share(p.type==='url'?{url:p.url}:{text:code}).catch(()=>{})));
  else r.append(btn('검색',()=>openUrl('https://www.google.com/search?q='+encodeURIComponent(code))));
  bs.append(r,btn('다시 찍기',again));
  $('sheet').classList.add('show');
}
function again(){$('sheet').classList.remove('show');$('frame').classList.remove('hit');lastCode='';if(stream){scanning=true;loop()}else startCam()}
function openUrl(u){const w=window.open(u,'_blank','noopener');if(!w)location.href=u}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('복사했어요')}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}

// 기록
function getHist(){try{return JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){return[]}}
function addHist(code){const h=getHist().filter(x=>x.c!==code);h.unshift({c:code,t:Date.now()});localStorage.setItem(HKEY,JSON.stringify(h.slice(0,30)))}
function fmt(t){const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function renderHist(){
  const h=getHist(),L=$('list');L.innerHTML='';
  if(!h.length){L.innerHTML='<div class="empty">아직 찍은 QR이 없어요</div>';return}
  h.forEach(x=>{const b=document.createElement('button');b.className='item';b.textContent=x.c;const s=document.createElement('small');s.textContent=fmt(x.t)+' · 눌러서 다시 보기';b.append(s);
    b.onclick=()=>{$('hist').classList.remove('show');scanning=false;showResult(x.c,parse(x.c))};L.append(b)});
}
$('bHist').onclick=()=>{$('sheet').classList.remove('show');scanning=false;$('autoOpen').checked=localStorage.getItem(AKEY)==='1';renderHist();$('hist').classList.add('show')};
$('bBack').onclick=()=>{$('hist').classList.remove('show');again()};
$('autoOpen').onchange=e=>{localStorage.setItem(AKEY,e.target.checked?'1':'0');toast(e.target.checked?'주소 QR은 바로 열어요':'찍은 뒤 「열기」를 눌러요')};
$('bClear').onclick=()=>{if(confirm('찍은 기록을 모두 지울까요?')){localStorage.removeItem(HKEY);renderHist()}};

// 손전등
$('bLight').onclick=async()=>{if(!track)return;torch=!torch;try{await track.applyConstraints({advanced:[{torch}]});$('bLight').classList.toggle('on',torch)}catch(e){torch=false;toast('손전등을 켤 수 없어요')}};

// 사진에서 찾기
$('bPhoto').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  scanning=false;
  try{const img=await createImageBitmap(f);let code=await decodeSource(img,img.width,img.height);
    if(code)return found(code);
  }catch(err){}
  toast('사진에서 QR을 못 찾았어요');again();
};
$('msgBtn').onclick=()=>startCam();
$('msgPhoto').onclick=()=>$('file').click();

// 화면을 벗어나면 카메라 끄기(배터리 절약), 돌아오면 다시 켜기
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopCam()}
  else if(!$('hist').classList.contains('show')){startCam()}
});

(async()=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showMsg('카메라를 쓸 수 없는 화면이에요','Chrome이나 삼성 인터넷으로 이 주소를 열어 주세요.');return}
  try{await setupDetector()}catch(e){showMsg('준비 중 문제가 생겼어요','인터넷 연결을 확인하고 다시 열어 주세요.');return}
  startCam();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
