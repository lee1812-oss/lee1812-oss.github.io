<style>
:root{--ac:#1d4ed8;--acb:#eaf1fe;--bd:#d6dbe3;--bg:#f4f6f9;--tx:#111827;--sub:#4b5563;--ok:#15803d;--warn:#c2410c;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:17px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px}

main{max-width:640px;margin:0 auto;padding:14px 14px 120px}
button,.btn{font:inherit;min-height:54px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--tx);padding:0 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}

input,textarea,select{font:inherit;width:100%;min-height:52px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fff;color:var(--tx)}

.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}

.kv:first-child{border-top:0}

.photo{width:100%;border-radius:12px;border:1px solid var(--bd);margin:8px 0}

#sheet{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;z-index:20}

#toast.on{opacity:1}
.tag{display:inline-block;background:#eef2f7;border-radius:8px;padding:2px 8px;font-size:14px;color:#374151;margin:2px 4px 0 0}

.phc{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin:16px 0 10px;font-weight:600;cursor:pointer}

#phV{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}

#phV .pvimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}

#phV .cb{display:flex;gap:8px}#phV .cb>*{flex:1;min-height:50px}
.sgp{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef0f3}.sgp input{width:24px;min-height:24px;flex:none}.sgp select{width:auto;min-height:42px;margin-left:auto}
.rawt{font-size:15px;line-height:1.9;background:#f7f7f7;border-radius:8px;padding:8px;margin-top:6px}.rawn{min-height:34px;padding:0 6px;font-weight:600;color:#1d4ed8;border-color:#9db7f3;display:inline}
.xrow{display:flex;gap:6px;margin-top:8px}.xrow .xl{flex:0 0 38%}.xrow .xd{flex:0 0 48px;padding:0}.xadd{margin-top:10px;border-style:dashed;color:#1d4ed8}
.shopbtn{margin:0 0 12px;border-color:#86c5a0;color:#15803d}
.alt{min-height:40px;margin-top:6px;font-size:15px;font-weight:500;color:#9a3412;background:#fff7ed;border-color:#fed7aa}
.mecard{display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--ac)}
.mecard img{width:100px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);flex:none}
.mereg{margin-bottom:12px;border:2px dashed var(--ac);color:var(--ac);background:#fff}
.mephoto{cursor:zoom-in;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#meFull{position:fixed;inset:0;background:#fff;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column}
#meFull img{max-width:96vw;max-height:88vh}
#meFull p{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#6b7280;margin:0}
@media (orientation:portrait){#meFull img{max-width:92vh;max-height:94vw;transform:rotate(90deg)}}
#crop{position:fixed;inset:0;background:#111;z-index:30;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;touch-action:none}
#crop .ch{color:#fff;font-size:17px;text-align:center;line-height:1.5}
#crop .cw{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;overflow:hidden}
#cropCv{display:block;max-width:100%}
#cropBox{position:absolute;border:3px solid #facc15;box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:auto;touch-action:none;cursor:move}
#crop .edp{width:min(612px,100%);display:flex;flex-direction:column;gap:8px}
#crop .sl{color:#fff;font-size:16px;display:block}#crop .sl b{color:#facc15;margin-left:6px}#crop .sl input{width:100%;min-height:40px;padding:0;accent-color:#facc15;background:transparent;border:0}
#crop .cb button{min-height:50px;padding:0 8px}
#crop .edt button:not(.pri){background:#374151;color:#fff;border-color:#4b5563}
#cropBox i{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:#facc15;border:3px solid #fff;pointer-events:auto;touch-action:none}
#crop .cb{display:flex;gap:8px;width:min(612px,100%)}#crop .cb>*{flex:1}
</style>

<body>
<header>
  <button class="ghost" id="backBtn" style="display:none" aria-label="뒤로">← 뒤로</button>
  <h1 id="ttl">바로연락<span class="ver">v018</span></h1>
  <button class="ghost" id="setBtn" aria-label="설정">설정</button>
</header>
<div id="instBar" style="display:none;max-width:640px;margin:10px auto 0;padding:0 14px"></div>
<main id="app"></main>
<button class="pri fab" id="fab">＋ 명함 추가</button>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="picIn" accept="image/*" hidden>
<input type="file" id="vcfIn" accept=".vcf,text/vcard,text/x-vcard" hidden>
<input type="file" id="meCam" accept="image/*" capture="environment" hidden>
<input type="file" id="mePic" accept="image/*" hidden>
<input type="file" id="signCam" accept="image/*" capture="environment" hidden>
<input type="file" id="signPic" accept="image/*" hidden>
<input type="file" id="phCam" accept="image/*" capture="environment" hidden>
<input type="file" id="phPic" accept="image/*" multiple hidden>
<input type="file" id="bakIn" accept=".json,application/json" hidden>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>
<script>
'use strict';
const VER='v018';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAnd=/Android/i.test(navigator.userAgent);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- 저장 (이 휴대폰 안에만) ---------- */
const DB={db:null,
  open(){return new Promise((ok,no)=>{const r=indexedDB.open('barolink',2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('c'))db.createObjectStore('c',{keyPath:'id'});if(!db.objectStoreNames.contains('ph')){const s=db.createObjectStore('ph',{keyPath:'id'});s.createIndex('cid','cid')}};r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>no(r.error)})},
  all(){return new Promise((ok,no)=>{const q=this.db.transaction('c').objectStore('c').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
  put(o){return new Promise((ok,no)=>{const t=this.db.transaction('c','readwrite');t.objectStore('c').put(o);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
  phList(cid){return new Promise((ok,no)=>{const q=this.db.transaction('ph').objectStore('ph').index('cid').getAll(cid);q.onsuccess=()=>ok(q.result.sort((a,b)=>a.at-b.at));q.onerror=()=>no(q.error)})},
  phAll(){return new Promise((ok,no)=>{const q=this.db.transaction('ph').objectStore('ph').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
  phPut(o){return new Promise((ok,no)=>{const t=this.db.transaction('ph','readwrite');t.objectStore('ph').put(o);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
  phDel(id){return new Promise((ok,no)=>{const t=this.db.transaction('ph','readwrite');t.objectStore('ph').delete(id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
  del(id){return new Promise((ok,no)=>{const t=this.db.transaction('c','readwrite');t.objectStore('c').delete(id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
};
let C=[];
const S=Object.assign({sign:'',mailVia:'app',tmapFirst:true,lastBak:0},JSON.parse(localStorage.getItem('baro_set')||'{}'));
const saveS=()=>localStorage.setItem('baro_set',JSON.stringify(S));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const digits=s=>String(s||'').replace(/\D/g,'');
function fmtPhone(s){let d=digits(s);if(d.startsWith('82')&&d.length>=11)d='0'+d.slice(2).replace(/^0/,'');
  if(/^02/.test(d)){return d.length===9?d.replace(/(02)(\d{3})(\d{4})/,'$1-$2-$3'):d.replace(/(02)(\d{4})(\d{4})/,'$1-$2-$3')}
  if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  if(d.length===10)return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
  if(d.length===8)return d.replace(/(\d{4})(\d{4})/,'$1-$2');
  return String(s||'').trim()}

/* ---------- 명함 글자 → 칸 나누기 ---------- */
const TITLES='대표이사|대표|회장|부회장|사장|부사장|전무|상무|이사|본부장|센터장|원장|소장|실장|국장|부장|차장|과장|팀장|대리|주임|계장|사원|연구원|선임|책임|수석|매니저|간사|교수|박사|변호사|세무사|회계사|노무사|변리사|관세사|기자|PD|CEO|CTO|COO|CFO|Manager|Director|President|Engineer|Designer|Owner|셰프|파트장|그룹장|지점장|점장';
const REG='서울|경기|인천|부산|대구|광주|대전|울산|세종|강원|충북|충남|충청|전북|전남|전라|경북|경남|경상|제주';
const COMP=/(\(주\)|㈜|주식회사|유한회사|\(유\)|㈔|사단법인|재단법인|협회|조합|공사|공단|센터|연구소|연구원|병원|의원|학교|대학교|은행|카페|베이커리|제과|식품|그룹|컴퍼니|코리아|Co\.|Corp|Inc|Ltd|LLC|Company)/i;
function parseCard(txt){
  const o={name:'',company:'',dept:'',title:'',mobile:'',tel:'',fax:'',email:'',address:'',web:'',kakao:''};
  let lines=String(txt||'').replace(/\r/g,'').split(/\n|\s{3,}|\|/).map(s=>s.trim()).filter(Boolean);
  const used=new Set();
  const all=lines.join('\n');
  const em=all.match(/[A-Za-z0-9._%+-]+\s?@\s?[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);if(em)o.email=em[0].replace(/\s/g,'');
  const wb=all.match(/(https?:\/\/[^\s]+|www\.[^\s]+)/i);if(wb&&!(o.email&&wb[0].includes('@')))o.web=wb[0];
  const kk=all.match(/(?:카카오톡|카톡|kakao(?:talk)?)\s*(?:id|ID|아이디)?\s*[:：]?\s*([A-Za-z0-9._-]{3,})/i);if(kk)o.kakao=kk[1];
  lines.forEach((l,i)=>{
    const phones=l.match(/(?:\+?82[\s.-]?\(?0?\)?|(?<!\d)0)\d{1,2}[\s.)-]{0,2}\d{3,4}[\s.-]?\d{4}(?!\d)/g);
    if(phones){
      phones.forEach(p=>{
        const before=l.slice(0,l.indexOf(p)).slice(-12);
        let d=digits(p);if(/^82/.test(d))d='0'+d.slice(2).replace(/^0/,'');
        if(/F|팩스|fax/i.test(before)&&!/[MH]/.test(before.slice(-3))){if(!o.fax)o.fax=fmtPhone(d)}
        else if(/^01[016789]/.test(d)){if(!o.mobile)o.mobile=fmtPhone(d)}
        else if(!o.tel)o.tel=fmtPhone(d); else if(!o.fax&&/F/i.test(before))o.fax=fmtPhone(d);
      });used.add(i);return}
    if(o.email&&l.replace(/\s/g,'').includes(o.email)){used.add(i);return}
    if(o.web&&l.includes(o.web)){used.add(i);return}
    const AP='^(?:(?:제?\\d+\\s*)?(?:공장|본사|본점|사무소|사무실|지사|지점|연구소|사업장|물류센터|매장|센터)\\s*[:：.]?\\s*)?(?:\\(?\\d{5}\\)?\\s*)?(주소|Add(ress)?|A\\.|A:)?\\s*[:：.]?\\s*(?:\\(?\\d{5}\\)?\\s*)?('+REG+')';
    if(o.address&&!o._a2&&new RegExp(AP).test(l)&&/(시|군|구|읍|면|동|로|길|번지|\d)/.test(l)){o._a2=l;used.add(i);return}
    if(!o.address&&(new RegExp(AP).test(l))&&/(시|군|구|읍|면|동|로|길|번지|\d)/.test(l)){
      const lab=(l.match(/^((?:제?\d+\s*)?(?:공장|본사|본점|사무소|사무실|지사|지점|연구소|사업장|물류센터|매장|센터))/)||[])[1];
      let a=l.replace(/^(?:(?:제?\d+\s*)?(?:공장|본사|본점|사무소|사무실|지사|지점|연구소|사업장|물류센터|매장|센터)\s*[:：.]?\s*)?/,'').replace(/^\(?\d{5}\)?\s*/,'').replace(/^(주소|Add(ress)?|A\.|A:)\s*[:：.]?\s*/i,'').replace(/^\(?\d{5}\)?\s*/,'');if(lab)o._lab=lab.replace(/\s/g,'');
      const nx=lines[i+1];if(nx&&!new RegExp(AP).test(nx)&&(/^(\d|[가-힣]+(동|층|호)|\(|,)/.test(nx)||/(\d+층|\d+호|빌딩|타워|프라자|상가|오피스텔)/.test(nx))&&!/[@]|\d{3,4}-\d{4}/.test(nx)){a+=' '+nx;used.add(i+1)}
      o.address=a.trim();used.add(i);return}
  });
  if(o._a2){o.memo=o._a2;}delete o._a2;delete o._lab;
  const rest=lines.filter((l,i)=>!used.has(i));
  const NOTCO=/(인증|농림축산식품부|식품의약품안전처|식약처|HACCP|ISO\s?\d|^PPANG|^www)/i;
  {const FREE=/^(naver|gmail|daum|hanmail|kakao|nate|hotmail|outlook|yahoo|icloud|korea)$/i;let dom=(o.web||'').replace(/^https?:\/\//i,'').replace(/^www\./i,'').split(/[.\/]/)[0];if(!dom&&o.email){dom=o.email.split('@')[1].split('.')[0];if(FREE.test(dom))dom=''}
   if(dom&&dom.length>=2){const c=rest.find(l=>l.replace(/[\s()㈜]|주식회사/g,'').toLowerCase()===dom.toLowerCase());if(c){o.company=c;used.add(lines.indexOf(c))}}}
  for(const l of rest){if(!o.company&&COMP.test(l)&&!NOTCO.test(l)){o.company=l;used.add(lines.indexOf(l))}}
  const tRe=new RegExp('('+TITLES+')','i');
  const DS='(팀|부|실|본부|사업부|사업본부|센터|그룹|파트|지점|사업단)';
  const isDept=t=>new RegExp('^[가-힣A-Za-z0-9]{1,10}'+DS+'$').test(t)&&t.length>=2;
  let nameC=[];
  for(const l of rest){
    if(l===o.company)continue;
    if(/^[A-Za-z .,&-]+$/.test(l)){if(!o.title&&l.length<=30&&new RegExp('^('+TITLES+')$','i').test(l.trim()))o.title=l.trim();continue}
    if(/(인증|농림축산식품부|식품의약품안전처|식약처)/.test(l))continue;
    {const sp=l.split(/\s*\/\s*/);if(!o.title&&sp.length===2&&sp.every(s=>s&&s.length<=12&&tRe.test(s))){o.title=sp.join(' / ');continue}}
    let tk=l.split(/[\s\/|·,()]+/).filter(Boolean);
    const j=[];for(const t of tk){if(/^[가-힣]$/.test(t)&&j.length&&/^[가-힣]{1,3}$/.test(j[j.length-1])&&j[j.length-1].length<4&&j._s){j[j.length-1]+=t}else{j.push(t);j._s=/^[가-힣]$/.test(t)}}tk=j;
    if(tk.length>=2&&/^[가-힣]{2,4}$/.test(tk[0])&&!tRe.test(tk[0])&&tk.slice(1).every(t=>/^[A-Z][A-Za-z-]*$/.test(t))){nameC.push({n:tk[0],w:3});continue}
    let hit=false;const loose=[];
    for(const t of tk){
      const dm=t.match(/^([가-힣A-Za-z0-9]{1,10}?)(사업본부장|사업부장|본부장|센터장|사업단장|지점장|그룹장|파트장|팀장|부장|실장)$/);
      if(dm&&!o.title){o.dept=o.dept||(dm[1]+dm[2].slice(0,-1));o.title=dm[2].replace(/^사업/,'');hit=true;continue}
      if(!o.title&&tRe.test(t)&&t.length<=8&&!isDept(t)){o.title=t;hit=true;continue}
      if(isDept(t)&&!tRe.test(t)){if(!o.dept)o.dept=t;else if(hit&&!o.dept.includes(t))o.dept+=' '+t;hit=true;continue}
      if(/^[가-힣]{2,4}$/.test(t)&&!COMP.test(t)&&!tRe.test(t))loose.push(t);
    }
    if(loose.length&&(hit||tk.length<=2))nameC.push({n:loose[0],w:(hit?2:1)+(loose[0].length===3?.5:0)});
  }
  if(!o.name&&nameC.length){nameC.sort((x,y)=>y.w-x.w);o.name=nameC[0].n}
  if(!o.name){
    const m=rest.join(' ').match(/(?:^|\s)([가-힣]{2,4})(?:\s|$)/);if(m&&!tRe.test(m[1])&&m[1]!==o.dept)o.name=m[1]
  }
  if(!o.company){const c=rest.find(l=>l!==o.dept&&!/^[가-힣]{2,4}$/.test(l.replace(/\s/g,''))&&!tRe.test(l)&&l.length>=2&&l.length<=24&&!/\d{3,}/.test(l));if(c)o.company=c}
  return o;
}

/* ---------- 휴대폰 연락처 파일(vCard) ---------- */
const vEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
function toVcf(c){
  const n=c.name||'';const fam=/^[가-힣]{2,4}$/.test(n)?n[0]:'';const giv=fam?n.slice(1):(n||c.company||'');
  const L=['BEGIN:VCARD','VERSION:3.0','N:'+vEsc(fam)+';'+vEsc(giv)+';;;','FN:'+vEsc(n||c.company||'이름 없음')];
  if(c.company||c.dept)L.push('ORG:'+vEsc(c.company)+(c.dept?';'+vEsc(c.dept):''));
  if(c.title)L.push('TITLE:'+vEsc(c.title));
  if(c.mobile)L.push('TEL;TYPE=CELL:'+c.mobile);
  if(c.tel)L.push('TEL;TYPE=WORK,VOICE:'+c.tel);
  if(c.fax)L.push('TEL;TYPE=WORK,FAX:'+c.fax);
  (c.xph||[]).forEach((x,i)=>{const t=/팩스/.test(x.l)?'WORK,FAX':(/^01/.test(digits(x.n))?'CELL':'WORK,VOICE');L.push('item'+(i+1)+'.TEL;TYPE='+t+':'+x.n);L.push('item'+(i+1)+'.X-ABLabel:'+vEsc(x.l))});
  if(c.email)L.push('EMAIL;TYPE=INTERNET,WORK:'+c.email);
  if(c.address)L.push('ADR;TYPE=WORK:;;'+vEsc(c.address)+';;;;');
  if(c.web)L.push('URL:'+c.web);
  const note=[c.metAt?'만난 날 '+c.metAt:'',c.shotAt?'간판 찍은 날 '+new Date(c.shotAt).toLocaleDateString('ko-KR'):'',c.metPlace?'만난 곳 '+c.metPlace:'',c.kakao?'카톡 ID '+c.kakao:'',c.bizNo?'사업자번호 '+c.bizNo:'',c.memo||''].filter(Boolean).join(' / ');
  if(note)L.push('NOTE:'+vEsc(note));
  L.push('END:VCARD');return L.join('\r\n')+'\r\n';
}
function parseVcf(t){
  const out=[];const un=s=>s.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
  t=t.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'');
  for(const blk of t.split(/BEGIN:VCARD/i).slice(1)){
    const c={name:'',company:'',dept:'',title:'',mobile:'',tel:'',fax:'',email:'',address:'',web:'',kakao:'',memo:''};
    for(const ln of blk.split(/\r?\n/)){
      const i=ln.indexOf(':');if(i<0)continue;const k=ln.slice(0,i).toUpperCase();let v=ln.slice(i+1);
      if(/CHARSET=UTF-8/i.test(k)&&/ENCODING=QUOTED-PRINTABLE/i.test(k)){try{v=decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(e){}}
      const key=k.split(';')[0].replace(/^ITEM\d+\./,'');
      if(key==='FN')c.name=un(v);
      else if(key==='N'&&!c.name){const p=v.split(';');c.name=un((p[0]||'')+(p[1]||''))}
      else if(key==='ORG'){const p=v.split(';');c.company=un(p[0]||'');c.dept=un(p[1]||'')}
      else if(key==='TITLE')c.title=un(v);
      else if(key==='TEL'){const ph=fmtPhone(v);const sl=/FAX/.test(k)?'fax':((/CELL|MOBILE/.test(k)||/^01/.test(digits(ph)))?'mobile':'tel');if(!c[sl])c[sl]=ph;else{c.xph=c.xph||[];c.xph.push({l:sl==='fax'?'팩스':(sl==='mobile'?'휴대폰':'기타'),n:ph})}}
      else if(key==='EMAIL')c.email=c.email||v.trim();
      else if(key==='ADR')c.address=c.address||un(v.split(';').filter(Boolean).join(' '));
      else if(key==='URL')c.web=c.web||un(v);
      else if(key==='NOTE')c.memo=un(v);
    }
    if(c.name||c.mobile||c.email)out.push(c);
  }
  return out;
}
function saveVcf(list,fname){
  const txt=list.map(toVcf).join('');

const OCR_URL='https://script.google.com/macros/s/AKfycbyd7xpHYYQs_qEvUvi1G8TuRotUry38pDevJxFJ7jnp9e6I9r4Qd_ooEGNoHNgtzFM/exec';const OCR_KEY='brl-ocr-v1';

let GEO={st:'none'},SG=null;
function geoStart(){if(!navigator.geolocation){GEO={st:'fail',why:'이 휴대폰은 위치를 못 줘요'};return}
  GEO={st:'wait'};navigator.geolocation.getCurrentPosition(async p=>{GEO={st:'ok',lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),at:Date.now()};sgRefresh();
    try{const r=await srv({act:'rgeo',lat:GEO.lat,lng:GEO.lng});if(r.ok){GEO.addr=r.addr;GEO.dong=r.dong;GEO.gu=r.gu}}catch(e){}sgRefresh();if(SG&&SG.name&&!SG.res&&!SG.busy)sgSearch()},
   e=>{GEO={st:'fail',why:e.code===1?'위치 권한이 꺼져 있어요':'위치를 못 찾았어요'};sgRefresh()},{enableHighAccuracy:true,timeout:20000,maximumAge:30000})}
async function srv(b){const r=await fetch(OCR_URL,{method:'POST',body:JSON.stringify(Object.assign({k:OCR_KEY},b))});return r.json()}
function signStart(){geoStart();sheet(`<h3>🏪 간판 찍어 거래처 등록</h3><div class="note">가게 <b>간판이 잘 보이게</b> 찍어 주세요. 찍는 곳의 <b>위치(GPS)</b>도 함께 저장해서 주변 가게 중에서 찾아요.</div>
  <button class="opt pri" onclick="sheet();$('#signCam').click()">📷 간판 사진 찍기</button><button class="opt" onclick="sheet();$('#signPic').click()">🖼️ 앨범에서 고르기 (지금 그 가게 앞일 때)</button><button class="opt" onclick="sheet()">닫기</button>`)}
async function onSignPhoto(file){if(!file)return;let cv;try{cv=await imgToCanvas(file,2000)}catch(e){return toast('사진을 열지 못했어요')}openEditor(cv,readSignCv,{read:true})}
const SIGN_SKIP=/^(영업중|open|close|closed|오픈|주차|주차장|tel|전화|무료|할인|세일|sale|입구|출구|화장실|배달|포장|예약|환영|welcome|since|\d+층|\d+f|b\d|wifi|와이파이)$/i;
const PH_LBL=['매장','사장님 휴대폰','휴대폰','팩스','기타'];
function phLabelOf(n,ctx){const d=digits(n);if(/(F|FAX|팩스|팩)\s*[.:)]?\s*$/i.test(ctx))return '팩스';if(/^01/.test(d))return '휴대폰';return '매장'}
function phValid(d){if(/^1[5-9]\d{6}$/.test(d))return true;if(!/^0/.test(d))return false;if(/^01[016789]\d{7,8}$/.test(d))return true;if(/^02\d{7,8}$/.test(d))return true;if(/^0(3[1-3]|4[1-4]|5[1-5]|6[1-4]|70|50\d|80)\d{7,8}$/.test(d))return d.length>=10&&d.length<=12;return false}
function signPhones(t){const s=String(t||'').replace(/\r/g,''),o=[];
  const fix=x=>x.replace(/[Oo○ㅇ]/g,'0').replace(/[lI|ㅣ!]/g,'1').replace(/[Ss]/g,'5').replace(/[Bb]/g,'8');
  const add=(raw,idx)=>{let d=digits(fix(raw));if(d.startsWith('82')&&d.length>=11)d='0'+d.slice(2).replace(/^0/,'');if(!phValid(d))return;const n=fmtPhone(d);if(o.some(y=>digits(y.n)===d))return;
    const ctx=s.slice(Math.max(0,idx-8),idx);o.push({n,l:phLabelOf(n,ctx),on:true})};
  const re1=/(?:\+?82[\s.-]?)?\(?[0OoIl|]?[0-9OoIl|]{1,3}\)?[\s.)\-~]{0,3}[0-9OoIl|SsBb]{3,4}[\s.\-~]{0,3}[0-9OoIl|SsBb]{4}(?![0-9])/g;
  for(const m of s.matchAll(re1)){const raw=m[0];if((raw.match(/[0-9]/g)||[]).length<6)continue;add(raw,m.index)}
  for(const m of s.matchAll(/(?<![0-9])(1[5-9][0-9OoIl|]{2})[\s.\-~]{0,3}([0-9OoIl|]{4})(?![0-9])/g))add(m[1]+m[2],m.index);
  return o.slice(0,6)}
function signCands(t){const out=[];String(t||'').split(/\n/).map(s=>s.replace(/[|*•·~"'“”‘’<>\[\]{}]/g,' ').replace(/\s+/g,' ').trim()).forEach(l=>{
  if(!l||l.length<2||l.length>24)return;if(/\d{2,4}[-.\s]\d{3,4}[-.\s]\d{4}/.test(l)||/(www\.|https?:|@|\.com|\.kr)/i.test(l))return;if(SIGN_SKIP.test(l))return;if(!/[가-힣A-Za-z]/.test(l))return;if(!out.includes(l))out.push(l)});
  return out.sort((a,b)=>(/[가-힣]/.test(b)-/[가-힣]/.test(a))).slice(0,6)}
async function readSignCv(cv){
  const full=scaleCv(cv,900).toDataURL('image/jpeg',.75),thumb=scaleCv(cv,160).toDataURL('image/jpeg',.7);
  SG={photo:thumb,photoFull:full,name:'',cands:[],phones:[],res:null,busy:false,shotAt:Date.now()};
  if(GEO.st==='none')geoStart();
  sheet('<h3>간판 글자 읽는 중…</h3><p class="muted">보통 5초쯤 걸려요.</p><div class="prog"><i style="width:55%"></i></div>');
  try{const base=scaleCv(cv,1600);const [r1,r2]=await Promise.allSettled([ocrServer(base),ocrServer(enhance(base))]);
    const t=[...new Set([r1,r2].filter(r=>r.status==='fulfilled').map(r=>r.value).join('\n').split('\n').map(s=>s.trim()).filter(Boolean))].join('\n');SG.raw=t;SG.phones=signPhones(t);SG.cands=signCands(t);SG.name=SG.cands[0]||''}catch(e){}
  sheet();go('sign');if(SG.name&&GEO.st==='ok')sgSearch()}
function sgRefresh(){if(view==='sign'){const g=$('#sgGeo');if(g)g.innerHTML=geoLine()}}
function geoLine(){if(GEO.st==='ok')return '📍 찍은 곳: <b>'+esc(GEO.addr||(GEO.lat+', '+GEO.lng))+'</b> <span class="muted">(오차 약 ±'+GEO.acc+'m)</span>';
  if(GEO.st==='wait')return '📍 지금 위치를 찾는 중이에요…';
  return '<span style="color:#b91c1c">📍 '+esc(GEO.why||'위치를 못 받았어요')+'</span> <button class="ghost" style="min-height:36px" onclick="geoStart();sgRefresh()">다시 시도</button><br><small class="muted">휴대폰 설정에서 위치를 켜고, 브라우저에 위치 권한을 허용해 주세요. 위치 없이도 이름으로 찾을 수 있어요.</small>'}
function renderSign(a){if(!SG){view='list';return render()}
  a.innerHTML=`<h2 style="margin-top:4px">🏪 간판으로 거래처 등록</h2>
  <img class="photo" src="${SG.photoFull}" alt="간판 사진" style="max-height:220px;object-fit:contain;background:#111">
  <div class="note" id="sgGeo">${geoLine()}</div>
  <label class="f" for="sgName">가게 이름 (간판에서 읽은 글자 · 틀리면 고치세요)</label><input id="sgName" value="${esc(SG.name)}">
  ${SG.cands.length>1?'<div class="chips" style="margin-top:8px">'+SG.cands.map((c,i)=>'<button class="chip" data-i="'+i+'">'+esc(c)+'</button>').join('')+'</div>':''}
  <div class="card" id="sgPh" style="margin-top:10px">${sgPhHtml()}</div>
  <button class="pri full" id="sgGo" style="margin-top:6px">🔍 주변에서 이 가게 찾기</button>
  <div id="sgRes">${sgResHtml()}</div>
  <button class="full" id="sgNone" style="margin-top:10px">목록에 없어요 → 찍은 곳 주소로 등록</button>`;
  a.querySelectorAll('.chips .chip').forEach(b=>b.onclick=()=>{$('#sgName').value=SG.cands[+b.dataset.i];SG.name=$('#sgName').value;sgSearch()});
  $('#sgName').oninput=e=>{SG.name=e.target.value};
  $('#sgGo').onclick=()=>{SG.name=$('#sgName').value.trim();if(!SG.name)return toast('가게 이름을 넣어 주세요');sgSearch()};
  $('#sgNone').onclick=()=>sgPick(null);
  sgPhBind();
  a.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>sgPick(SG.res[+el.dataset.p]))}
function sgPhHtml(){const P=SG.phones||[];
  return '<b>☎ 간판에서 찾은 번호</b> <small class="muted">체크한 번호를 연락처에 넣어요</small>'+(P.length?P.map((p,i)=>'<label class="sgp"><input type="checkbox" data-pi="'+i+'" '+(p.on?'checked':'')+'><span class="nw" style="font-size:18px">'+esc(p.n)+'</span><select data-pl="'+i+'">'+PH_LBL.map(l=>'<option '+(l===p.l?'selected':'')+'>'+l+'</option>').join('')+'</select></label>').join(''):'<p class="muted" style="margin:6px 0">간판에서 번호를 못 찾았어요. 아래 원문에서 번호를 누르거나 직접 넣어 주세요.</p>')+
  '<div class="row" style="margin-top:8px"><input id="sgAddN" inputmode="tel" placeholder="번호 직접 넣기 (예: 031-123-4567)"><button id="sgAddB" style="flex:0 0 96px;white-space:nowrap">＋ 추가</button></div>'+
  (SG.raw?'<details style="margin-top:8px"><summary class="muted">간판에서 읽은 글자 원문 보기 (숫자를 누르면 번호로 넣어요)</summary><div class="rawt">'+esc(SG.raw).replace(/[0-9OoIl|()+.\-\s]{7,}/g,m=>/[0-9].*[0-9].*[0-9].*[0-9]/.test(m)?'<button class="rawn" data-r="'+m.replace(/"/g,'')+'">'+m+'</button>':m).replace(/\n/g,'<br>')+'</div></details>':'')}
function sgPhBind(){const box=$('#sgPh');if(!box)return;
  box.querySelectorAll('[data-pi]').forEach(c=>c.onchange=()=>{SG.phones[+c.dataset.pi].on=c.checked});
  box.querySelectorAll('[data-pl]').forEach(s=>s.onchange=()=>{SG.phones[+s.dataset.pl].l=s.value});
  const addN=raw=>{const d=digits(raw);if(d.length<8)return toast('번호가 너무 짧아요');const n=fmtPhone(d);if(SG.phones.some(p=>digits(p.n)===digits(n)))return toast('이미 있는 번호예요');SG.phones.push({n,l:phLabelOf(n,''),on:true});box.innerHTML=sgPhHtml();sgPhBind();toast(n+' 넣었어요')};
  $('#sgAddB').onclick=()=>addN($('#sgAddN').value);
  box.querySelectorAll('.rawn').forEach(b=>b.onclick=e=>{e.preventDefault();addN(b.dataset.r.replace(/[OoIl|]/g,m=>/[Oo]/.test(m)?'0':'1'))})}
function sgResHtml(){if(SG.busy)return '<p class="muted">찾는 중…</p>';if(!SG.res)return '';if(!SG.res.length)return '<div class="note warn">주변에서 같은 이름의 가게를 못 찾았어요. 이름을 고쳐 다시 찾거나, 아래 「찍은 곳 주소로 등록」을 누르세요.</div>';
  return '<h2>이 중에 맞는 가게를 누르세요</h2>'+SG.res.map((p,i)=>'<div class="card item" data-p="'+i+'"><div class="av">🏪</div><div style="min-width:0"><div class="nm">'+esc(p.name)+'</div><div class="co">'+esc(p.cat||'')+'</div><div class="co">'+esc(p.addr||'')+'</div>'+(p.tel?'<div class="co">☎ '+esc(p.tel)+'</div>':'')+'</div>'+(p.dist!=null?'<span class="muted nw" style="margin-left:auto">'+(p.dist<1000?p.dist+'m':(p.dist/1000).toFixed(1)+'km')+'</span>':'')+'</div>').join('')}
async function sgSearch(){if(!SG||!SG.name)return;SG.busy=true;if(view==='sign'){const r=$('#sgRes');if(r)r.innerHTML=sgResHtml()}
  try{const b={act:'place',q:SG.name};if(GEO.st==='ok'){b.lat=GEO.lat;b.lng=GEO.lng;b.hint=[GEO.dong,GEO.gu].filter(Boolean).join('|')}const r=await srv(b);SG.res=r.ok?r.list:[]}catch(e){SG.res=[];toast('인터넷 연결을 확인해 주세요')}
  SG.busy=false;if(view==='sign')renderSign($('#app'))}
function sgPick(p){const g=GEO.st==='ok'?GEO:{};
  draft=Object.assign(blank(),{kind:'shop',company:p?p.name:(SG.name||''),address:p?p.addr:(g.addr||''),memo:[p&&p.cat?'업종: '+p.cat:'',p&&p.url?'카카오맵: '+p.url:''].filter(Boolean).join('\n'),
    lat:p?p.lat:(g.lat||null),lng:p?p.lng:(g.lng||null),shotLat:g.lat||null,shotLng:g.lng||null,shotAt:SG.shotAt,photo:SG.photo,photoFull:SG.photoFull,tags:'거래처',metPlace:'간판 촬영'+(g.addr?' · '+g.addr:''),_ocr:0,_raw:SG.raw||''});
  const SP=(SG.phones||[]).filter(x=>x.on),sp=SP.map(x=>x.n),mp=p&&p.tel?fmtPhone(p.tel):'';const fld=ph=>/^01/.test(digits(ph))?'mobile':'tel';
  draft.xph=[];const DEF={tel:'매장',mobile:'휴대폰',fax:'팩스'};const put=(ph,l)=>{const f=l==='팩스'?'fax':fld(ph);if(!draft[f]&&(!l||l===DEF[f])){draft[f]=ph;return}draft.xph.push({l:l||'기타',n:ph})};
  SP.forEach(x=>put(x.n,x.l));
  if(!draft.tel&&!draft.mobile&&draft.xph.length){const x=draft.xph.find(y=>!/팩스/.test(y.l));if(x){draft.xph=draft.xph.filter(y=>y!==x);draft[fld(x.n)]=x.n;if(x.l&&x.l!==DEF[fld(x.n)])draft.memo=[draft.memo,'대표 번호('+x.n+'): '+x.l].filter(Boolean).join('\n')}}
  if(mp){if(!sp.length)put(mp);else if(!sp.some(x=>digits(x)===digits(mp))){const f=fld(mp);if(draft[f]){draft._alt=Object.assign(draft._alt||{},{[f]:mp});draft._phoneNote='간판 번호를 넣었어요. 지도에 나온 번호('+mp+')와 달라요. 아래 주황 버튼을 누르면 지도 번호로 바뀌어요.'}else put(mp)}}
  if(sp.length)draft.memo=[draft.memo,'간판 전화: '+sp.join(', ')].filter(Boolean).join('\n');
  if(!draft.xph.length)delete draft.xph;
  history.replaceState({v:'edit'},'');view='edit';render()}
$('#phCam').onchange=e=>{const f=[...e.target.files];e.target.value='';phAddFiles(f,true)};
$('#phPic').onchange=e=>{const f=[...e.target.files];e.target.value='';phAddFiles(f,false)};

$('#signPic').onchange=e=>{onSignPhoto(e.target.files[0]);e.target.value=''};

const ME_FIELDS=[['name','이름'],['title','직함'],['company','회사'],['dept','부서'],['mobile','휴대폰','tel'],['tel','회사 전화','tel'],['fax','팩스','tel'],['email','메일','email'],['address','주소'],['web','홈페이지','url'],['kakao','카톡 ID'],['memo','추가 정보 (예: 2공장 주소, 하는 일)']];

function meText(){const m=ME;return cardText(m)+(m.web?'\n홈페이지 '+m.web:'')+(m.memo?'\n'+m.memo:'')}

  <button class="pri full" onclick="meShare()">💬 내 명함 보내기 (카톡·문자)</button><p></p>
  <div class="row"><button onclick="meVcf()">📇 연락처 파일로 보내기</button><button onclick="copy(meText(),'내 명함 글자를 복사했어요')">📋 글자로 복사</button></div>
  <div class="card" style="margin-top:12px">${row('휴대폰',c.mobile)}${row('전화',c.tel)}${row('팩스',c.fax)}${row('메일',c.email)}${row('주소',c.address)}${row('홈페이지',c.web)}${row('카톡 ID',c.kakao)}${row('추가 정보',c.memo)}</div>

function meMenu(){sheet(`<h3>내 명함 사진</h3><button class="opt pri" onclick="sheet();$('#meCam').click()">📷 사진 찍기</button><button class="opt" onclick="sheet();$('#mePic').click()">🖼️ 앨범에서 고르기</button><button class="opt" onclick="sheet()">닫기</button>`)}
function meShow(){const o=document.createElement('div');o.id='meFull';o.innerHTML='<img src="'+ME.photoFull+'" alt="내 명함"><p>화면을 누르면 닫혀요</p>';o.onclick=()=>o.remove();document.body.appendChild(o)}
async function meShare(){const t=meText();
  if(ME.photoFull&&navigator.canShare){try{const bl=await (await fetch(ME.photoFull)).blob();const f=new File([bl],'명함_'+(ME.name||'내명함')+'.jpg',{type:'image/jpeg'});
    if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:t});return}}catch(e){if(e.name==='AbortError')return}}
  if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}
  copy(t,'내 명함 글자를 복사했어요. 카톡에 붙여넣으세요')}

/* 사진 편집: 자르기·돌리기·뒤집기·기울기·밝기·대비·자동 보정 */
function scaleCv(src,max){const r=Math.min(1,max/Math.max(src.width,src.height));const c=document.createElement('canvas');c.width=Math.round(src.width*r);c.height=Math.round(src.height*r);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
function rotCv(src,dir){const c=document.createElement('canvas');c.width=src.height;c.height=src.width;const g=c.getContext('2d');if(dir<0){g.translate(0,c.height);g.rotate(-Math.PI/2)}else{g.translate(c.width,0);g.rotate(Math.PI/2)}g.drawImage(src,0,0);return c}
function flipCv(src){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(src,0,0);return c}
function tiltCv(src,deg){if(!deg)return src;const a=deg*Math.PI/180,s=Math.abs(Math.sin(a)),co=Math.abs(Math.cos(a));const W=Math.round(src.width*co+src.height*s),H=Math.round(src.width*s+src.height*co);
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.translate(W/2,H/2);g.rotate(a);g.drawImage(src,-src.width/2,-src.height/2);return c}
function adjustCv(cv,o){const b=+o.b||0,ct=+o.c||0;if(!b&&!ct&&!o.auto)return cv;const g=cv.getContext('2d');const d=g.getImageData(0,0,cv.width,cv.height),p=d.data;
  let lo=0,hi=255;if(o.auto){const h=new Uint32Array(256);let n=0;for(let i=0;i<p.length;i+=16){h[(p[i]*77+p[i+1]*150+p[i+2]*29)>>8]++;n++}let s=0;for(lo=0;lo<255;lo++){s+=h[lo];if(s>n*.01)break}s=0;for(hi=255;hi>0;hi--){s+=h[hi];if(s>n*.01)break}if(hi-lo<30){lo=0;hi=255}}
  const C=ct*2.55,k=(259*(C+255))/(255*(259-C));const L=new Uint8ClampedArray(256);for(let i=0;i<256;i++){let v=(i-lo)*255/(hi-lo);v=k*(v-128)+128+b*2.55;L[i]=v}
  for(let i=0;i<p.length;i+=4){p[i]=L[p[i]];p[i+1]=L[p[i+1]];p[i+2]=L[p[i+2]]}g.putImageData(d,0,0);return cv}

  let work=null;
  const o=document.createElement('div');o.id='crop';
  o.innerHTML=`<div class="ch" id="edHelp"></div><div class="cw"><canvas id="cropCv"></canvas><div id="cropBox"><i data-h="tl"></i><i data-h="tr"></i><i data-h="bl"></i><i data-h="br"></i></div></div>

  function draw(){work=xf(small);const W=wrap.clientWidth,H=wrap.clientHeight||300;const r=Math.min(W/work.width,H/work.height,1.5);pv.width=Math.max(1,Math.round(work.width*r));pv.height=Math.max(1,Math.round(work.height*r));
    const g=pv.getContext('2d');g.drawImage(work,0,0,pv.width,pv.height);adjustCv(pv,st);place()}
  let raf=0;const redraw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)};
  function place(){const ox=pv.offsetLeft,oy=pv.offsetTop,w=pv.width,h=pv.height,B=st.B;box.style.left=(ox+B.x0*w)+'px';box.style.top=(oy+B.y0*h)+'px';box.style.width=((B.x1-B.x0)*w)+'px';box.style.height=((B.y1-B.y0)*h)+'px';
    const hs=box.querySelectorAll('i');const bw=(B.x1-B.x0)*w,bh=(B.y1-B.y0)*h;[[0,0],[bw,0],[0,bh],[bw,bh]].forEach(([x,y],i)=>{hs[i].style.left=(x-3)+'px';hs[i].style.top=(y-3)+'px'})}
  const frac=ev=>{const r=pv.getBoundingClientRect();return [Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height))]};
  box.querySelectorAll('i').forEach(el=>{el.onpointerdown=e=>{e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);const k=el.dataset.h;
    el.onpointermove=ev=>{const [fx,fy]=frac(ev),B=st.B;if(k[1]==='l')B.x0=Math.min(fx,B.x1-.08);else B.x1=Math.max(fx,B.x0+.08);if(k[0]==='t')B.y0=Math.min(fy,B.y1-.08);else B.y1=Math.max(fy,B.y0+.08);place()};

    box.onpointerup=box.onpointercancel=()=>{box.onpointermove=null}};
  const tab=n=>{st.tab=n;q('#edP1').style.display=n===1?'':'none';q('#edP2').style.display=n===2?'':'none';q('#edT1').classList.toggle('pri',n===1);q('#edT2').classList.toggle('pri',n===2);help();redraw()};

  const resetBox=()=>{st.B={x0:.04,y0:.04,x1:.96,y1:.96}};
  q('#edL').onclick=()=>{st.rot--;resetBox();redraw()};q('#edR').onclick=()=>{st.rot++;resetBox();redraw()};
  q('#edF').onclick=()=>{st.flip=!st.flip;redraw()};q('#edA').onclick=()=>{st.B={x0:0,y0:0,x1:1,y1:1};place()};
  q('#edTilt').oninput=e=>{st.tilt=+e.target.value;q('#edTv').textContent=st.tilt+'°';redraw()};
  q('#edB').oninput=e=>{st.b=+e.target.value;q('#edBv').textContent=st.b;redraw()};
  q('#edC').oninput=e=>{st.c=+e.target.value;q('#edCv').textContent=st.c;redraw()};

  q('#edReset').onclick=()=>{Object.assign(st,{rot:0,flip:false,tilt:0,b:0,c:0,auto:false});resetBox();['edTilt','edB','edC'].forEach(i=>q('#'+i).value=0);q('#edTv').textContent='0°';q('#edBv').textContent='0';q('#edCv').textContent='0';q('#edAuto').textContent='✨ 자동 보정 끔';q('#edAuto').classList.remove('pri');redraw()};
