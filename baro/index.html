<html lang="ko">
<head>

<style>
:root{--ac:#1d4ed8;--acb:#eaf1fe;--bd:#d6dbe3;--bg:#f4f6f9;--tx:#111827;--sub:#4b5563;--ok:#15803d;--warn:#c2410c;--bad:#b91c1c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:17px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:21px;margin:0;flex:1;color:var(--ac)}
header .ver{font-size:13px;color:#6b7280;font-weight:400;margin-left:6px}
main{max-width:640px;margin:0 auto;padding:14px 14px 120px}
button,.btn{font:inherit;min-height:54px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--tx);padding:0 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:active,.btn:active{transform:scale(.98)}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.ghost{background:transparent;border-color:transparent;color:var(--ac);min-height:44px;padding:0 8px}

.row{display:flex;gap:8px}.row>*{flex:1}
input,textarea,select{font:inherit;width:100%;min-height:52px;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fff;color:var(--tx)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;margin:12px 0 4px;font-weight:600;color:var(--sub);font-size:15px}
.search{position:relative;margin-bottom:12px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{min-height:40px;border-radius:20px;padding:0 14px;font-weight:600;font-size:15px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}

.av{width:52px;height:52px;border-radius:12px;background:var(--acb);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none;overflow:hidden}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(612px,calc(100% - 28px));font-size:19px;box-shadow:0 6px 18px rgba(29,78,216,.3);z-index:6}

.empty{text-align:center;padding:40px 10px;color:var(--sub)}

#toast.on{opacity:1}
.tag{display:inline-block;background:#eef2f7;border-radius:8px;padding:2px 8px;font-size:14px;color:#374151;margin:2px 4px 0 0}
h2{font-size:19px;margin:18px 0 8px}
.phc{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin:16px 0 10px;font-weight:600;cursor:pointer}

.pk{cursor:pointer}.pk input{width:26px;min-height:26px;flex:none}
.fab:disabled{opacity:.5}
.alt{min-height:40px;margin-top:6px;font-size:15px;font-weight:500;color:#9a3412;background:#fff7ed;border-color:#fed7aa}
</style>

<body>
<header>
  <button class="ghost" id="backBtn" style="display:none" aria-label="뒤로">← 뒤로</button>

<input type="file" id="bakIn" accept=".json,application/json" hidden>

<script>
'use strict';
const VER='v007';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAnd=/Android/i.test(navigator.userAgent);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- 저장 (이 휴대폰 안에만) ---------- */
const DB={db:null,
  open(){return new Promise((ok,no)=>{const r=indexedDB.open('barolink',1);r.onupgradeneeded=()=>{r.result.createObjectStore('c',{keyPath:'id'})};r.onsuccess=()=>{this.db=r.result;ok()};r.onerror=()=>no(r.error)})},
  all(){return new Promise((ok,no)=>{const q=this.db.transaction('c').objectStore('c').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
  put(o){return new Promise((ok,no)=>{const t=this.db.transaction('c','readwrite');t.objectStore('c').put(o);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
  del(id){return new Promise((ok,no)=>{const t=this.db.transaction('c','readwrite');t.objectStore('c').delete(id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
};
let C=[];
const S=Object.assign({sign:'',mailVia:'app',tmapFirst:true,lastBak:0},JSON.parse(localStorage.getItem('baro_set')||'{}'));
const saveS=()=>localStorage.setItem('baro_set',JSON.stringify(S));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const digits=s=>String(s||'').replace(/\D/g,'');
function fmtPhone(s){let d=digits(s);if(d.startsWith('82')&&d.length>=11)d='0'+d.slice(2).replace(/^0/,'');
  if(/^02/.test(d)){return d.length===9?d.replace(/(02)(\d{3})(\d{4})/,'$1-$2-$3'):d.replace(/(02)(\d{4})(\d{4})/,'$1-$2-$3')}
  if(d.length===11)return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  if(d.length===10)return d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
  if(d.length===8)return d.replace(/(\d{4})(\d{4})/,'$1-$2');
  return String(s||'').trim()}

/* ---------- 명함 글자 → 칸 나누기 ---------- */
const TITLES='대표이사|대표|회장|부회장|사장|부사장|전무|상무|이사|본부장|센터장|원장|소장|실장|국장|부장|차장|과장|팀장|대리|주임|계장|사원|연구원|선임|책임|수석|매니저|간사|교수|박사|변호사|세무사|회계사|노무사|변리사|관세사|기자|PD|CEO|CTO|COO|CFO|Manager|Director|President|Engineer|Designer|Owner|셰프|파트장|그룹장|지점장|점장';
const REG='서울|경기|인천|부산|대구|광주|대전|울산|세종|강원|충북|충남|충청|전북|전남|전라|경북|경남|경상|제주';
const COMP=/(\(주\)|㈜|주식회사|유한회사|\(유\)|㈔|사단법인|재단법인|협회|조합|공사|공단|센터|연구소|연구원|병원|의원|학교|대학교|은행|카페|베이커리|제과|식품|그룹|컴퍼니|코리아|Co\.|Corp|Inc|Ltd|LLC|Company)/i;
function parseCard(txt){
  const o={name:'',company:'',dept:'',title:'',mobile:'',tel:'',fax:'',email:'',address:'',web:'',kakao:''};
  let lines=String(txt||'').replace(/\r/g,'').split(/\n|\s{3,}|\|/).map(s=>s.trim()).filter(Boolean);
  const used=new Set();
  const all=lines.join('\n');
  const em=all.match(/[A-Za-z0-9._%+-]+\s?@\s?[A-Za-z0-9.-]+\.[A-Za-z]{2,}/);if(em)o.email=em[0].replace(/\s/g,'');
  const wb=all.match(/(https?:\/\/[^\s]+|www\.[^\s]+)/i);if(wb&&!(o.email&&wb[0].includes('@')))o.web=wb[0];
  const kk=all.match(/(?:카카오톡|카톡|kakao(?:talk)?)\s*(?:id|ID|아이디)?\s*[:：]?\s*([A-Za-z0-9._-]{3,})/i);if(kk)o.kakao=kk[1];
  lines.forEach((l,i)=>{
    const phones=l.match(/(?:\+?82[\s.-]?\(?0?\)?|(?<!\d)0)\d{1,2}[\s.)-]{0,2}\d{3,4}[\s.-]?\d{4}(?!\d)/g);
    if(phones){
      phones.forEach(p=>{
        const before=l.slice(0,l.indexOf(p)).slice(-12);
        let d=digits(p);if(/^82/.test(d))d='0'+d.slice(2).replace(/^0/,'');
        if(/F|팩스|fax/i.test(before)&&!/[MH]/.test(before.slice(-3))){if(!o.fax)o.fax=fmtPhone(d)}
        else if(/^01[016789]/.test(d)){if(!o.mobile)o.mobile=fmtPhone(d)}
        else if(!o.tel)o.tel=fmtPhone(d); else if(!o.fax&&/F/i.test(before))o.fax=fmtPhone(d);
      });used.add(i);return}
    if(o.email&&l.replace(/\s/g,'').includes(o.email)){used.add(i);return}
    if(o.web&&l.includes(o.web)){used.add(i);return}
    if(!o.address&&(new RegExp('^(주소|Add(ress)?|A\\.|A:)?\\s*[:：.]?\\s*('+REG+')').test(l))&&/(시|군|구|읍|면|동|로|길|번지|\d)/.test(l)){
      let a=l.replace(/^(주소|Add(ress)?|A\.|A:)\s*[:：.]?\s*/i,'');
      const nx=lines[i+1];if(nx&&(/^(\d|[가-힣]+(동|층|호)|\(|,)/.test(nx)||/(\d+층|\d+호|빌딩|타워|프라자|상가|오피스텔)/.test(nx))&&!/[@]|\d{3,4}-\d{4}/.test(nx)){a+=' '+nx;used.add(i+1)}
      o.address=a.trim();used.add(i);return}
  });
  const rest=lines.filter((l,i)=>!used.has(i));
  for(const l of rest){if(!o.company&&COMP.test(l)){o.company=l;used.add(lines.indexOf(l))}}
  const tRe=new RegExp('('+TITLES+')','i');
  const DS='(팀|부|실|본부|사업부|사업본부|센터|그룹|파트|지점|사업단)';
  const isDept=t=>new RegExp('^[가-힣A-Za-z0-9]{1,10}'+DS+'$').test(t)&&t.length>=2;
  let nameC=[];
  for(const l of rest){
    if(l===o.company)continue;
    if(/^[A-Za-z .,&-]+$/.test(l)){if(!o.title&&l.length<=30&&new RegExp('^('+TITLES+')$','i').test(l.trim()))o.title=l.trim();continue}
    let tk=l.split(/[\s\/|·,()]+/).filter(Boolean);
    const j=[];for(const t of tk){if(/^[가-힣]$/.test(t)&&j.length&&/^[가-힣]{1,3}$/.test(j[j.length-1])&&j[j.length-1].length<4&&j._s){j[j.length-1]+=t}else{j.push(t);j._s=/^[가-힣]$/.test(t)}}tk=j;
    let hit=false;const loose=[];
    for(const t of tk){
      const dm=t.match(/^([가-힣A-Za-z0-9]{1,10}?)(사업본부장|사업부장|본부장|센터장|사업단장|지점장|그룹장|파트장|팀장|부장|실장)$/);
      if(dm&&!o.title){o.dept=o.dept||(dm[1]+dm[2].slice(0,-1));o.title=dm[2].replace(/^사업/,'');hit=true;continue}
      if(!o.title&&tRe.test(t)&&t.length<=8&&!isDept(t)){o.title=t;hit=true;continue}
      if(isDept(t)&&!tRe.test(t)){if(!o.dept)o.dept=t;else if(hit&&!o.dept.includes(t))o.dept+=' '+t;hit=true;continue}
      if(/^[가-힣]{2,4}$/.test(t)&&!COMP.test(t)&&!tRe.test(t))loose.push(t);
    }
    if(loose.length&&(hit||tk.length<=2))nameC.push({n:loose[0],w:hit?2:1});
  }
  if(!o.name&&nameC.length){nameC.sort((x,y)=>y.w-x.w);o.name=nameC[0].n}
  if(!o.name){
    const m=rest.join(' ').match(/(?:^|\s)([가-힣]{2,4})(?:\s|$)/);if(m&&!tRe.test(m[1])&&m[1]!==o.dept)o.name=m[1]
  }
  if(!o.company){const c=rest.find(l=>l!==o.dept&&!/^[가-힣]{2,4}$/.test(l.replace(/\s/g,''))&&!tRe.test(l)&&l.length>=2&&l.length<=24&&!/\d{3,}/.test(l));if(c)o.company=c}
  return o;
}

/* ---------- 휴대폰 연락처 파일(vCard) ---------- */
const vEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
function toVcf(c){
  const n=c.name||'';const fam=/^[가-힣]{2,4}$/.test(n)?n[0]:'';const giv=fam?n.slice(1):n;
  const L=['BEGIN:VCARD','VERSION:3.0','N:'+vEsc(fam)+';'+vEsc(giv)+';;;','FN:'+vEsc(n||c.company||'이름 없음')];
  if(c.company||c.dept)L.push('ORG:'+vEsc(c.company)+(c.dept?';'+vEsc(c.dept):''));
  if(c.title)L.push('TITLE:'+vEsc(c.title));
  if(c.mobile)L.push('TEL;TYPE=CELL:'+c.mobile);
  if(c.tel)L.push('TEL;TYPE=WORK,VOICE:'+c.tel);
  if(c.fax)L.push('TEL;TYPE=WORK,FAX:'+c.fax);
  if(c.email)L.push('EMAIL;TYPE=INTERNET,WORK:'+c.email);
  if(c.address)L.push('ADR;TYPE=WORK:;;'+vEsc(c.address)+';;;;');
  if(c.web)L.push('URL:'+c.web);
  const note=[c.metAt?'만난 날 '+c.metAt:'',c.metPlace?'만난 곳 '+c.metPlace:'',c.kakao?'카톡 ID '+c.kakao:'',c.memo||''].filter(Boolean).join(' / ');
  if(note)L.push('NOTE:'+vEsc(note));
  L.push('END:VCARD');return L.join('\r\n')+'\r\n';
}
function parseVcf(t){
  const out=[];const un=s=>s.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
  t=t.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'');
  for(const blk of t.split(/BEGIN:VCARD/i).slice(1)){
    const c={name:'',company:'',dept:'',title:'',mobile:'',tel:'',fax:'',email:'',address:'',web:'',kakao:'',memo:''};
    for(const ln of blk.split(/\r?\n/)){
      const i=ln.indexOf(':');if(i<0)continue;const k=ln.slice(0,i).toUpperCase();let v=ln.slice(i+1);
      if(/CHARSET=UTF-8/i.test(k)&&/ENCODING=QUOTED-PRINTABLE/i.test(k)){try{v=decodeURIComponent(v.replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(e){}}
      const key=k.split(';')[0].replace(/^ITEM\d+\./,'');
      if(key==='FN')c.name=un(v);
      else if(key==='N'&&!c.name){const p=v.split(';');c.name=un((p[0]||'')+(p[1]||''))}
      else if(key==='ORG'){const p=v.split(';');c.company=un(p[0]||'');c.dept=un(p[1]||'')}
      else if(key==='TITLE')c.title=un(v);
      else if(key==='TEL'){const ph=fmtPhone(v);if(/FAX/.test(k))c.fax=c.fax||ph;else if(/CELL|MOBILE/.test(k)||/^01/.test(digits(ph)))c.mobile=c.mobile||ph;else c.tel=c.tel||ph}
      else if(key==='EMAIL')c.email=c.email||v.trim();
      else if(key==='ADR')c.address=c.address||un(v.split(';').filter(Boolean).join(' '));
      else if(key==='URL')c.web=c.web||un(v);
      else if(key==='NOTE')c.memo=un(v);
    }
    if(c.name||c.mobile||c.email)out.push(c);
  }
  return out;
}
function saveVcf(list,fname){
  const txt=list.map(toVcf).join('');
  const file=new File([txt],fname,{type:'text/vcard'});window._lastVcf=file;
  markPhone(list);
  const n=list.length;
  if(isIOS){const u=URL.createObjectURL(file);location.href=u;
    setTimeout(()=>sheet(`<h3>📱 휴대폰 연락처에 저장</h3><div class="note">연락처 화면이 열리면 <b>「새로운 연락처 생성」</b>${n>1?'(여러 명이면 「모든 연락처 추가」)':''}을 누르세요.</div><button class="opt" onclick="shareVcfAgain()">안 열리면: 공유 창으로 연락처 앱에 보내기</button><button class="opt pri" onclick="sheet()">확인</button>`),1200);return}
  dl(file);

    if(dup&&confirm((dup.name||'같은 사람')+'이(가) 이미 있어요. 기존 연락처에 합칠까요?\n(취소를 누르면 따로 저장해요)')){
      for(const k of Object.keys(d)){if(d[k]&&!k.startsWith('_')&&k!=='id')dup[k]=d[k]}dup.updated=Date.now();await DB.put(dup);draft=null;toast('기존 연락처에 합쳤어요');history.replaceState({v:'detail',id:dup.id},'');curId=dup.id;view='detail';render();if(toPhone)saveVcf([dup],(dup.name||'연락처')+'.vcf');return}
    d.id=newId();d.created=Date.now()}
  d.updated=Date.now();delete d._ocr;delete d._raw;delete d._alt;
  await DB.put(d);const i=C.findIndex(x=>x.id===d.id);if(i>=0)C[i]=d;else C.push(d);
  draft=null;curId=d.id;toast('저장했어요');history.replaceState({v:'detail',id:d.id},'');view='detail';render();
  if(toPhone)saveVcf([d],(d.name||d.company||'연락처')+'.vcf');
}

/* ---------- 명함 사진 → 글자 읽기 ---------- */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)})}
function imgToCanvas(file,max){return new Promise((ok,no)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv)};im.onerror=no;im.src=u})}
const OCR_URL='https://script.google.com/macros/s/AKfycbyd7xpHYYQs_qEvUvi1G8TuRotUry38pDevJxFJ7jnp9e6I9r4Qd_ooEGNoHNgtzFM/exec';const OCR_KEY='brl-ocr-v1';
function enhance(src){const W=src.width,H=src.height;const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(src,0,0);
  const d=g.getImageData(0,0,W,H),p=d.data,N=W*H;const L=new Float32Array(N);for(let i=0;i<N;i++)L[i]=.299*p[i*4]+.587*p[i*4+1]+.114*p[i*4+2];
  const blur=s=>{const o=new Float32Array(N);o.set(s);for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;o[i]=(s[i-W-1]+s[i-W]+s[i-W+1]+s[i-1]+s[i]+s[i+1]+s[i+W-1]+s[i+W]+s[i+W+1])/9}return o};
  const B=blur(blur(L));const S=new Float32Array(N);for(let i=0;i<N;i++)S[i]=L[i]+1.2*(L[i]-B[i]);
  const smp=[];for(let i=0;i<N;i+=37)smp.push(S[i]);smp.sort((a,b)=>a-b);const lo=smp[Math.floor(smp.length*.01)],hi=smp[Math.floor(smp.length*.99)]||255;
  for(let i=0;i<N;i++){let v=(S[i]-lo)/((hi-lo)||1)*255;v=v<0?0:v>255?255:v;p[i*4]=p[i*4+1]=p[i*4+2]=v}g.putImageData(d,0,0);return c}
async function ocrServer(cv){const b=cv.toDataURL('image/jpeg',.88).split(',')[1];
  const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),40000);
  try{const r=await fetch(OCR_URL,{method:'POST',body:JSON.stringify({k:OCR_KEY,img:b,mime:'image/jpeg'}),signal:ac.signal});const j=await r.json();if(!j.ok)throw new Error(j.err);return j.text.replace(/\r/g,'')}finally{clearTimeout(tm)}}
const TLD=/\.(co\.kr|or\.kr|go\.kr|ac\.kr|re\.kr|ne\.kr|kr|com|net|org|biz|info|io|me|jp|cn|us|co)$/i;
function fieldScore(k,v){if(!v)return -1;const d=digits(v);
  if(k==='email')return /^[\w.%+-]+@[\w-]+(\.[\w-]+)+$/.test(v)?(TLD.test(v)?3:1):0;
  if(k==='mobile')return /^01[016789]\d{7,8}$/.test(d)&&(d.length===11||d.length===10)?3:0;
  if(k==='tel'||k==='fax')return d.length>=9&&d.length<=11?3:0;
  if(k==='address')return /(시|군|구)\s/.test(v)&&/(로|길|동|읍|면)/.test(v)?2:1;
  return 1}
function mergeParse(a,b){const o={},alt={};for(const k of Object.keys(a)){const x=a[k]||'',y=b[k]||'';
  if(x===y||!y){o[k]=x;continue}if(!x){o[k]=y;continue}
  const sx=fieldScore(k,x),sy=fieldScore(k,y);o[k]=sy>sx?y:x;alt[k]=sy>sx?x:y}return {o,alt}}
async function onPhoto(file){
  if(!file)return;
  sheet(`<h3>명함 글자 읽는 중…</h3><p class="muted" id="ocrMsg">구글 글자인식으로 읽고 있어요. 보통 5~10초 걸려요.</p><div class="prog"><i id="ocrBar" style="width:15%"></i></div><button class="opt" onclick="ocrCancel=true;sheet()">그만두고 직접 입력</button>`);
  ocrCancel=false;
  let thumb,full;
  try{
    const base=await imgToCanvas(file,1600);
    thumb=await imgToCanvas(file,160);full=await imgToCanvas(file,900);window._lastThumb=thumb.toDataURL('image/jpeg',.7);
    const bar=()=>{const b=$('#ocrBar');if(b)b.style.width=Math.min(95,parseFloat(b.style.width)+8)+'%'};const iv=setInterval(bar,700);
    let t1='',t2='',raw='',alt={},p;
    const [r1,r2]=await Promise.allSettled([ocrServer(base),ocrServer(enhance(base))]);clearInterval(iv);
    if(r1.status==='fulfilled')t1=r1.value;if(r2.status==='fulfilled')t2=r2.value;
    if(t1||t2){const a=parseCard(t1||t2),b=parseCard(t2||t1);const m=mergeParse(a,b);p=m.o;alt=m.alt;raw=t1||t2}
    else{ // 인터넷·서버 문제일 때 휴대폰 안에서 읽기 (정확도 낮음)
      const t=$('#ocrMsg');if(t)t.textContent='서버 연결이 안 돼 휴대폰 안에서 읽는 중… (정확도가 낮을 수 있어요)';
      const big=await imgToCanvas(file,1800);
      if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      const w=await Tesseract.createWorker(['kor','eng']);const r=await w.recognize(big);await w.terminate();
      raw=r.data.text.replace(/[ \t]+/g,' ').split('\n').map(s=>s.trim()).filter(Boolean).join('\n');p=parseCard(raw)}
    if(ocrCancel)return;
    sheet();
    draft=Object.assign(blank(),p,{_ocr:1,_raw:raw,_alt:alt,photo:thumb.toDataURL('image/jpeg',.7),photoFull:full.toDataURL('image/jpeg',.72)});
    go('edit',null);
  }catch(e){
    sheet(`<h3>글자를 못 읽었어요</h3><p class="muted">인터넷이 연결돼 있는지 확인해 주세요. 사진은 그대로 붙여 두고 직접 입력할 수 있어요.</p>
     <button class="opt pri" onclick="sheet();draft=Object.assign(blank(),{photo:window._lastThumb||''});go('edit',null)">직접 입력하기</button><button class="opt" onclick="sheet()">닫기</button>`);
  }
}
let ocrCancel=false;
$('#camIn').onchange=e=>{onPhoto(e.target.files[0]);e.target.value=''};
$('#picIn').onchange=e=>{onPhoto(e.target.files[0]);e.target.value=''};
$('#vcfIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const L=parseVcf(await f.text());if(!L.length)return toast('연락처를 찾지 못했어요');
  if(L.length===1){draft=Object.assign(blank(),L[0]);go('edit',null);return}

$('#bakIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());const L=j.contacts||[];
  if(!confirm('백업의 '+L.length+'명을 불러올까요? 같은 연락처는 백업 내용으로 바뀌어요.'))return;for(const c of L){await DB.put(c)}C=await DB.all();toast(L.length+'명을 불러왔어요');history.back()}catch(err){toast('백업 파일이 아니에요')}};
async function pickContacts(){try{const L=await navigator.contacts.select(['name','tel','email','address'],{multiple:true});let n=0;
  for(const x of L){const o=Object.assign(blank(),{id:newId(),name:(x.name||[])[0]||'',email:(x.email||[])[0]||'',metAt:'',created:Date.now(),updated:Date.now()});
    for(const t of (x.tel||[])){const ph=fmtPhone(t);if(/^01/.test(digits(ph))&&!o.mobile)o.mobile=ph;else if(!o.tel)o.tel=ph}
    const ad=(x.address||[])[0];if(ad)o.address=(ad.addressLine||[]).join(' ')||[ad.region,ad.city].filter(Boolean).join(' ');
    await DB.put(o);C.push(o);n++}toast(n+'명을 가져왔어요');render()}catch(e){toast('가져오기를 취소했어요')}}

const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let instEvt=null;
function instFix(){sheet(`<h3>설치돼 있다는데 안 보이거나 안 열릴 때</h3>
  <div class="note"><b>1. 먼저 찾아보기</b><br>홈 화면을 위로 쓸어 올려 <b>앱스 화면</b>을 열고, 맨 위 검색 칸에 <b>「바로연락」</b>을 쳐 보세요. 보이면 꾹 눌러 홈 화면으로 끌어오면 돼요.</div>
  <div class="note warn"><b>2. 아이콘을 눌러도 「앱을 열 수 없음」이 뜨면</b> (설치가 중간에 꼬인 경우)<br>① 설정 → 애플리케이션 → 「바로연락」 → <b>삭제</b><br>② 휴대폰을 껐다 켜기<br>③ 크롬에서 이 주소를 다시 열고 ⋮ → <b>「앱 설치」</b> → 1분쯤 기다리기</div>
  <div class="note"><b>3. 그래도 안 되면</b><br>삼성 인터넷으로 이 주소를 열고 ≡ → 「현재 페이지 추가」 → 「홈 화면」을 누르세요.</div>
  <p class="muted">저장한 연락처는 휴대폰 안 같은 곳에 있어서, 앱으로 열든 크롬으로 열든 그대로 보여요. (앱을 삭제할 때는 크롬의 사이트 데이터만 지우지 않으면 돼요)</p>
  <button class="opt pri" onclick="sheet()">확인</button>`)}
async function instCheck(){
  const bar=$('#instBar');if(standalone){bar.style.display='none';return}
  let installed=false;
  try{if(navigator.getInstalledRelatedApps){const r=await navigator.getInstalledRelatedApps();installed=r.length>0}}catch(e){}
  if(installed){bar.innerHTML='<div class="note ok" style="margin:0">✓ 이 휴대폰에 「바로연락」 앱이 <b>이미 설치돼 있어요.</b><br>홈 화면이나 앱스 화면에서 「바로연락」 아이콘을 눌러 여세요.<br><button class="ghost" style="padding:0;min-height:36px" onclick="instFix()">아이콘이 안 보이거나 안 열려요 →</button></div>';bar.style.display='block';return}
  if(instEvt){bar.innerHTML='<button class="full pri" id="instBtn">📲 이 휴대폰에 앱으로 설치</button>';bar.style.display='block';$('#instBtn').onclick=async()=>{instEvt.prompt();const c=await instEvt.userChoice.catch(()=>({}));instEvt=null;bar.style.display='none';if(c.outcome==='accepted')toast('설치하고 있어요. 1분쯤 뒤 홈 화면을 확인하세요')};return}
  bar.style.display='none';
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;instCheck()});
addEventListener('appinstalled',()=>{instEvt=null;instCheck()});
(async()=>{
  await DB.open();C=await DB.all();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  history.replaceState({v:'list'},'');render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  instCheck();
})();
