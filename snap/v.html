<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>사진 크게 보기</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0D1C42"><script>(function(){var d=document.documentElement;function fit(){d.style.zoom='';var sw=screen.width,vw=window.innerWidth;if(matchMedia('(pointer:coarse)').matches&&sw>0&&sw<1100&&vw>sw*1.25){d.style.zoom=Math.min(vw/sw,3.5);}}fit();addEventListener('orientationchange',function(){setTimeout(fit,300)});})();</script>
<style>body{margin:0;background:#111;color:#fff;font:17px/1.5 -apple-system,"Malgun Gothic",sans-serif;word-break:keep-all}header{padding:12px 16px;background:#0D1C42;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{margin:0;font-size:19px}.ver{font-size:14px;background:#FCF1D0;color:#0D1C42;border-radius:999px;padding:3px 10px;font-weight:700}img{display:block;max-width:100%;margin:0 auto;cursor:zoom-in}img.big{max-width:none;cursor:zoom-out}#wrap{overflow:auto}.bar{display:grid;gap:10px;padding:14px;max-width:640px;margin:0 auto}a.b{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:#fff;color:#0D1C42;font-weight:800;text-decoration:none;font-size:18px}p{color:#e5e7eb;font-size:16px;text-align:center;margin:6px 14px}</style></head><body>
<header><h1>📷 <span id="t"></span> 사진</h1><span class="ver">v007 · 11/11 11:06 업데이트</span></header>
<img id="im" alt="사진" title="누르면 크게·작게"><p id="msg"></p><p id="hint">사진을 누르면 크게 볼 수 있어요. 저장은 사진을 길게 누르거나(휴대폰) 오른쪽 클릭 → 「이미지 저장」(PC).</p>
<div class="bar"><a class="b" href="./" style="background:#FCF1D0">📸 사진 바로 나에게 앱 열기</a><a class="b" id="dr" target="snap_drive" rel="noopener">구글 드라이브에서 원본 보기</a></div>
<p>이 화면은 받은 사진을 크게 보는 곳이에요. 사진을 찍으려면 위 「앱 열기」를 누르세요.</p><p>카톡 사진 카드는 카카오가 100일 뒤 지워요. 오래 둘 사진은 드라이브에 있어요(이혜영 구글 계정으로 로그인해야 보여요).</p>
<script>const q=new URLSearchParams(location.search);const u=q.get('u')||'';const ok=/^https:\/\/[a-z0-9.-]*kakaocdn\.net\//i.test(u);
document.getElementById('t').textContent=q.get('t')||'';
if(ok){im.src=u;im.onclick=()=>im.classList.toggle('big');im.onerror=()=>{msg.textContent='카톡용 사진이 지워졌어요(100일 지남). 아래 드라이브에서 보세요.';im.remove();hint.remove();}}else{im.remove();hint.remove();msg.textContent='사진 주소가 없어요.';}
/* v007: 사진 크게 보기 창은 늘 1개만. 새로 열리면 먼저 열려 있던 창은 스스로 닫힘 */
try{const bc=new BroadcastChannel('snap-viewer');const me=Date.now()+'-'+Math.random();bc.onmessage=e=>{const m=e.data||{};if(m.type==='open'&&m.id!==me){try{window.close()}catch(_){}}};bc.postMessage({type:'open',id:me,u:u});}catch(_){}
const d=q.get('d')||'';if(/^[A-Za-z0-9_-]{10,}$/.test(d))dr.href='https://drive.google.com/drive/folders/'+d;else dr.remove();</script></body></html>
