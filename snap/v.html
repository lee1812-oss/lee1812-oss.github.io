<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>사진 크게 보기</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#0D1C42">
<style>body{margin:0;background:#111;color:#fff;font:17px/1.5 -apple-system,"Malgun Gothic",sans-serif;word-break:keep-all}header{padding:12px 16px;background:#0D1C42;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{margin:0;font-size:19px}.ver{font-size:14px;background:#FCF1D0;color:#0D1C42;border-radius:999px;padding:3px 10px;font-weight:700}img{display:block;max-width:100%;margin:0 auto}.bar{display:grid;gap:10px;padding:14px;max-width:640px;margin:0 auto}a.b{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:#fff;color:#0D1C42;font-weight:800;text-decoration:none;font-size:18px}p{color:#e5e7eb;font-size:16px;text-align:center;margin:6px 14px}</style></head><body>
<header><h1>📷 <span id="t"></span> 사진</h1><span class="ver">v004 · 11/09 15:17 업데이트</span></header>
<img id="im" alt="사진"><p id="msg"></p>
<div class="bar"><a class="b" href="./" style="background:#FCF1D0">📸 사진 바로 나에게 앱 열기</a><a class="b" id="dl" target="_blank" rel="noopener">사진 새 창으로 열기 (길게 눌러 저장)</a><a class="b" id="dr" target="_blank" rel="noopener">구글 드라이브에서 원본 보기</a></div>
<p>이 화면은 받은 사진을 크게 보는 곳이에요. 사진을 찍으려면 위 「앱 열기」를 누르세요.</p><p>카톡 사진 카드는 카카오가 100일 뒤 지워요. 오래 둘 사진은 드라이브에 있어요(이혜영 구글 계정으로 로그인해야 보여요).</p>
<script>const q=new URLSearchParams(location.search);const u=q.get('u')||'';const ok=/^https:\/\/[a-z0-9.-]*kakaocdn\.net\//i.test(u);
document.getElementById('t').textContent=q.get('t')||'';
if(ok){im.src=u;dl.href=u;im.onerror=()=>{msg.textContent='카톡용 사진이 지워졌어요(100일 지남). 아래 드라이브에서 보세요.';im.remove();dl.remove();}}else{im.remove();dl.remove();msg.textContent='사진 주소가 없어요.';}
const d=q.get('d')||'';if(/^[A-Za-z0-9_-]{10,}$/.test(d))dr.href='https://drive.google.com/drive/folders/'+d;else dr.remove();</script></body></html>
