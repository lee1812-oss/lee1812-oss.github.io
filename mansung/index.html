<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>만성교회 유튜브</title><meta name="theme-color" content="#B3261E">
<link rel="manifest" href="manifest.webmanifest?v=1"><link rel="icon" href="icon-192.png?v=1"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="만성교회">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#f4f4f5;color:#18181b;word-break:keep-all;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.top img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
h1{font-size:26px;margin:0}.sub{font-size:16px;color:#52525b;margin-top:2px}
#msg{background:#fff;border-radius:14px;padding:14px 16px;font-size:17px;margin-bottom:16px;border:1px solid #e4e4e7}
a.btn{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 18px;margin-bottom:12px;border-radius:16px;text-decoration:none;font-size:21px;font-weight:700;color:#18181b;background:#fff;border:1px solid #e4e4e7;box-shadow:0 1px 2px rgba(0,0,0,.05)}
a.btn small{display:block;font-size:15px;font-weight:400;color:#52525b;margin-top:3px}
a.main{background:#E00000;color:#fff;border:0;min-height:96px;font-size:24px}a.main small{color:#ffe4e4}
.ic{font-size:30px;width:36px;text-align:center}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:12px 16px;font-size:17px;margin-top:8px}
select{font-size:17px;padding:8px;border-radius:10px;border:1px solid #a1a1aa;min-height:44px}
.ver{text-align:center;color:#71717a;font-size:13px;margin-top:16px}
</style></head><body><div class="wrap">
<div class="top"><img src="icon-192.png?v=1" alt=""><div><h1>만성교회</h1><div class="sub">유튜브 예배 영상 바로가기</div></div></div>
<div id="msg">유튜브를 여는 중이에요…</div>
<a class="btn main" data-k="home" href="#"><span class="ic">▶</span><span>만성교회 채널 열기<small>오늘 예배 생중계가 맨 위에 나와요</small></span></a>
<a class="btn" data-k="live" href="#"><span class="ic">🔴</span><span>지금 생중계 바로 보기<small>예배 중일 때 바로 영상으로</small></span></a>
<a class="btn" data-k="streams" href="#"><span class="ic">📺</span><span>지난 예배 다시 보기<small>라이브 목록</small></span></a>
<div class="opt"><span>앱을 열면 바로</span><select id="auto"><option value="home">채널 열기</option><option value="live">생중계 보기</option><option value="off">이동 안 함</option></select></div>
<div class="ver">v001 · 2026.10.25</div></div>
<script>
const CH='UCOp1NMZk2VqnvuLZCHTay0Q';
const P={home:'/channel/'+CH, live:'/channel/'+CH+'/live', streams:'/channel/'+CH+'/streams'};
const ua=navigator.userAgent, isAnd=/Android/i.test(ua), isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function go(k){
  const web='https://www.youtube.com'+P[k];
  if(isAnd){location.href='intent://www.youtube.com'+P[k]+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent(web)+';end';}
  else if(isIOS){const t=Date.now();location.href='youtube://www.youtube.com'+P[k];setTimeout(()=>{if(!document.hidden&&Date.now()-t<2500)location.href=web;},1500);}
  else{location.href=web;}
}
document.querySelectorAll('a.btn').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.k);}));
const sel=document.getElementById('auto');sel.value=localStorage.getItem('auto')||'home';
sel.onchange=()=>{localStorage.setItem('auto',sel.value);};
const msg=document.getElementById('msg');
function auto(){const v=sel.value;if(v==='off'){msg.textContent='아래 버튼을 눌러 주세요.';return;}
  msg.textContent='유튜브를 여는 중이에요… 안 열리면 아래 빨간 버튼을 눌러 주세요.';go(v);}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();}else if(hiddenAt&&Date.now()-hiddenAt>10*60*1000){auto();}});
setTimeout(auto,300);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
