<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>만성교회</title><meta name="theme-color" content="#E00000">
<link rel="manifest" href="manifest.webmanifest?v=1"><link rel="icon" href="icon-192.png?v=1"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="만성교회">
<script>
var CH='UCOp1NMZk2VqnvuLZCHTay0Q',P='/channel/'+CH;
var ua=navigator.userAgent,isAnd=/Android/i.test(ua),isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var WEB='https://www.youtube.com'+P;
function go(){
 if(isAnd){location.href='intent://www.youtube.com'+P+'#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url='+encodeURIComponent(WEB)+';end';}
 else if(isIOS){var t=Date.now();location.href='youtube://www.youtube.com'+P;setTimeout(function(){if(!document.hidden&&Date.now()-t<2500)location.href=WEB;},1500);}
 else{location.href=WEB;}
}
go();
// 유튜브로 넘어가면 이 창은 스스로 닫아서, 다음에 아이콘을 누를 때 다시 바로 열리게 함
document.addEventListener('visibilitychange',function(){if(document.hidden&&(isAnd||isIOS)){setTimeout(function(){try{window.close();}catch(e){}},300);}});
</script>
<style>html,body{margin:0;height:100%}body{background:#E00000;color:#fff;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;cursor:pointer;-webkit-tap-highlight-color:transparent}
img{width:120px;height:120px;border-radius:50%;border:4px solid #fff;object-fit:cover}h1{font-size:30px;margin:18px 0 8px}p{font-size:19px;margin:6px 20px;opacity:.95}.v{position:fixed;bottom:12px;left:0;right:0;font-size:12px;opacity:.7}</style></head>
<body onclick="go()"><div><img src="icon-192.png?v=1" alt=""><h1>만성교회</h1><p>유튜브를 여는 중이에요…</p><p>안 열리면 화면 아무 곳이나 눌러 주세요</p></div><div class="v">v002</div>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
