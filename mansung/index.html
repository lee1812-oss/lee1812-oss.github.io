<html lang="ko"><head><meta charset="utf-8">

<style>
@font-face{font-family:'NSR';font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/NanumSquareRoundR.woff2) format('woff2')}
@font-face{font-family:'NSR';font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/NanumSquareRoundB.woff2) format('woff2')}
@font-face{font-family:'NSR';font-weight:800;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/NanumSquareRoundEB.woff2) format('woff2')}
@font-face{font-family:'NSR';font-weight:900;font-display:swap;src:url(https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/NanumSquareRoundEB.woff2) format('woff2')}
:root{--fs:18px;--navy:#1E3A5F;--line:#e4e4e7;--sub:#52525b}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
html,body,.rdb{overflow-anchor:none}
.rd,.rdb{overscroll-behavior:contain}
.fsz button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{margin:0;background:#f4f4f5;color:#18181b;font-family:"NSR","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 0 calc(30px + env(safe-area-inset-bottom))}
header{background:#fff;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px}
.hrow img{width:52px;height:52px;border-radius:50%;object-fit:cover}
h1{font-size:1.35rem;margin:0}
.when{color:var(--sub);font-size:.9rem;margin-top:2px}
.tools{display:flex;gap:8px;margin-top:12px}
.yt{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;border-radius:14px;background:#E00000;border:0;color:#fff;font-weight:800;font-size:1.05rem;text-decoration:none}
.fsb{min-width:54px;min-height:54px;border-radius:14px;border:1px solid #a1a1aa;background:#fff;font-size:1rem;font-weight:700;color:#18181b}
.datebar{background:#fff;padding:12px 12px 12px;border-bottom:1px solid var(--line)}
.dmain{display:flex;align-items:center;gap:8px}
.dmain button.ar{flex:0 0 58px;min-height:58px;border-radius:14px;border:1px solid #cbd5e1;background:#f8fafc;font-size:1.4rem;font-weight:800;color:var(--navy)}
.dmain button.ar:disabled{opacity:.3}
.dnow{flex:1;text-align:center;border-radius:14px;background:#EEF3F9;padding:8px 6px;min-height:58px;display:flex;flex-direction:column;justify-content:center}
.dnow .dd{font-size:1.3rem;font-weight:900;color:var(--navy)}
.dnow .rel{font-size:.8rem;font-weight:800;color:#fff;background:var(--navy);border-radius:999px;padding:2px 10px;align-self:center;margin-top:3px}
.dnow .rel.past{background:#71717a}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:76px;min-height:58px;border-radius:14px;border:1px solid #d4d4d8;background:#fff;font-family:inherit;color:#18181b;padding:4px 10px;line-height:1.25}
.chip b{display:block;font-size:1.05rem}
.chip span{font-size:.72rem;color:#71717a;font-weight:700}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on span{color:#dbeafe}
.chip.wait{border-style:dashed;color:#a1a1aa}
.dmsg{margin-top:8px;font-size:.85rem;color:#b45309;font-weight:700;text-align:center}
nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-height:54px;padding:0 14px;border:0;background:none;font-size:.95rem;font-weight:700;color:#71717a;border-bottom:4px solid transparent;font-family:inherit}
nav button.on{color:var(--navy);border-bottom-color:var(--navy)}
main{padding:14px 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.svc h2{font-size:1.2rem;margin:0 0 4px}
.svc .meta{color:var(--sub);font-size:.88rem}
.word{border-left:6px solid var(--navy)}
.word .lbl{font-size:.8rem;font-weight:800;color:var(--navy);letter-spacing:.02em}
.word .st{font-size:1.15rem;font-weight:800;margin:6px 0 4px;line-height:1.45}
.word .ser{color:var(--sub);font-size:.88rem}
.item{display:flex;gap:10px;padding:13px 2px;border-top:1px solid #f0f0f2;align-items:flex-start}
.item:first-child{border-top:0}
.item .n{flex:0 0 6.2em;font-weight:700;color:#3f3f46;font-size:.95rem;padding-top:1px}
.item .n .stand{display:block;font-size:.7rem;font-weight:700;color:#b45309;margin-top:2px}
.item .c{flex:1;min-width:0}
.item .what{font-size:1rem;font-weight:700;line-height:1.45}
.item .who{color:var(--sub);font-size:.85rem;margin-top:2px}
.item .note{color:#1d4ed8;font-size:.82rem;margin-top:3px}
.sec{text-align:center;color:var(--navy);font-weight:800;padding:10px 0 4px;font-size:.95rem}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btns a,.btns button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid #cbd5e1;background:#f8fafc;color:var(--navy);font-weight:700;font-size:.9rem;text-decoration:none;font-family:inherit}
.bible{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px 14px;margin-top:8px}
.bible .bt{font-weight:800;color:#92400e;font-size:.92rem;margin-bottom:6px}
.bible p{margin:0 0 8px;font-size:1.08rem;line-height:1.8}
.bible sup{font-size:.75rem;font-weight:800;color:#b45309;margin-right:4px;vertical-align:baseline}
.copy{font-size:.72rem;color:#71717a;margin-top:4px}
.creed{background:#f0f9ff;border:1px solid #bae6fd;border-radius:14px;padding:12px 14px;margin-top:8px;font-size:1.05rem;line-height:1.8}
.news h3{font-size:1.02rem;margin:0 0 6px;color:var(--navy)}
.news p{margin:0;white-space:pre-line;line-height:1.7;font-size:.98rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td{padding:9px 4px;border-top:1px solid #f0f0f2;vertical-align:top}
td:first-child{font-weight:700}
/* 크게 보기(찬송 가사·성경) */
.ph{display:inline-block;max-width:100%}
.bible{cursor:pointer}
.bible .more{display:block;text-align:center;margin-top:8px;font-weight:800;color:#92400e;font-size:.9rem}
.rd{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;--rfs:23px}
.rdh{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px);padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:#fff}
.rdh .x{min-width:84px;min-height:54px;border-radius:14px;border:0;background:#1E3A5F;color:#fff;font-size:17px;font-weight:800;font-family:inherit}
.rdt{flex:1;min-width:0;font-weight:900;font-size:18px;line-height:1.3;color:#18181b}
.rdt small{display:block;font-size:13px;font-weight:700;color:#b45309;margin-top:2px}
.rdh .fsb{min-width:50px;min-height:54px}
.rdb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,calc((100% - 680px)/2)) 24px;font-size:var(--rfs);line-height:1.75}
.st{border-radius:16px;padding:14px 16px;margin-bottom:12px;background:#fafafa;border:1px solid #ececef}
.st .lb{display:inline-block;font-size:.62em;font-weight:900;color:#fff;background:#1E3A5F;border-radius:999px;padding:2px 12px;margin-bottom:6px}
.st.sing{background:#FFFBEB;border:2px solid #F59E0B}
.st.sing .lb{background:#B45309}
.st.dim{opacity:.5}
.st .ln{display:block;margin:2px 0 6px}
.st.ref{background:#EEF3F9;border-color:#C9D7EA}
.st.ref .lb{background:#4B6A91}
.amen{text-align:center;font-weight:900;color:#1E3A5F;margin:6px 0 10px}
.vs{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid #f1f1f3}
.vs .vn{flex:0 0 auto;min-width:1.7em;font-size:.7em;font-weight:900;color:#B45309;padding-top:.35em;text-align:right}
.vs .vt{flex:1;min-width:0}
.rdf{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.rdf button{flex:1;min-height:58px;border-radius:14px;border:1px solid #cbd5e1;background:#f8fafc;color:#1E3A5F;font-size:16px;font-weight:800;font-family:inherit}
.rdf button:disabled{opacity:.35}
.rdf .nx{background:#1E3A5F;color:#fff;border:0}
.fsz{display:flex;align-items:center;border:1px solid #a1a1aa;border-radius:14px;background:#fff;overflow:hidden;flex:0 0 auto}
.fsz button{width:50px;min-height:54px;border:0;background:#fff;font-size:28px;font-weight:900;color:#1E3A5F;font-family:inherit;line-height:1}
.fsz button:active{background:#EEF3F9}
.fsz span{font-size:13px;font-weight:800;color:#52525b;padding:0 2px}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(30,58,95,.92);color:#fff;font-weight:900;font-size:20px;padding:14px 22px;border-radius:16px;z-index:80;pointer-events:none}
.st .ln.b .ph{display:block}
.bitem{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:8px 12px;margin-top:6px;font-size:.88rem;color:#92400e;font-weight:700}
/* 크게 보기 본문: 부드럽고 굵게 */
.rdb{font-weight:700;color:#1f1f1f;line-height:1.7}
.rdb .st .lb,.rdt,.amen{font-weight:800}
.st.ref .ln,.st .ln{font-weight:700}
.st.dim .ln{font-weight:400}
button,a{font-family:inherit}
.foot{color:#71717a;font-size:.75rem;text-align:center;margin:14px 10px}
.empty{padding:40px 20px;text-align:center;color:var(--sub)}
[hidden]{display:none!important}
/* 은혜 메모 */
.md{z-index:60;--rfs:20px}
.mdb{display:flex;flex-direction:column;gap:10px}
.mdi{background:#EEF3F9;border:1px solid #C9D7EA;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:700;color:#1E3A5F;line-height:1.5}
.mdi b{display:block;font-size:17px;font-weight:800;color:#18181b}
.mta{width:100%;box-sizing:border-box;min-height:46vh;border:2px solid #cbd5e1;border-radius:16px;padding:14px 16px;font-family:inherit;font-size:var(--rfs);font-weight:700;line-height:1.7;color:#1f1f1f;background:#FFFEF7;resize:vertical}
.mta:focus{outline:none;border-color:#1E3A5F}
.mst{font-size:14px;font-weight:700;color:#15803d;min-height:20px}
.mst.w{color:#b45309}
.mhelp{font-size:13px;color:#71717a;font-weight:700}
.btns .memo{background:#FFFBEB;border-color:#F59E0B;color:#92400e}
.mprev{white-space:pre-wrap;background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:8px 12px;margin-top:6px;font-size:.88rem;color:#3f3f46;font-weight:700;max-height:5.2em;overflow:hidden}
.mcard .mt{white-space:pre-wrap;font-size:1rem;font-weight:700;line-height:1.7;color:#1f1f1f;margin:8px 0 4px}
.mcard .md0{font-size:.82rem;font-weight:800;color:#b45309}
.mcard h3{font-size:1.02rem;margin:2px 0 0;color:var(--navy)}
.ptag{display:inline-block;font-size:.72rem;font-weight:800;color:#fff;background:#4B6A91;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle}
/* 아이패드·태블릿 화면 맞춤 (v015) */
:root{--k:1}
html{font-size:calc(var(--fs) * var(--k))}
.rdb,.mta{font-size:calc(var(--rfs) * var(--k))}
@media (min-width:700px){
 :root{--k:1.15}
 .wrap{max-width:none;padding-left:max(20px,calc((100% - 1400px)/2));padding-right:max(20px,calc((100% - 1400px)/2))}
 header{padding:20px 4px 12px}
 .hrow img{width:64px;height:64px}
 .rdb{padding-left:max(28px,calc((100% - 1360px)/2));padding-right:max(28px,calc((100% - 1360px)/2))}
 .rdt{font-size:21px}.rdt small{font-size:15px}
 .rdh,.rdf{padding-left:max(16px,calc((100% - 1400px)/2));padding-right:max(16px,calc((100% - 1400px)/2))}
 .rdf button{font-size:18px;min-height:62px}
}
@media (min-width:1100px){:root{--k:1.22}}

/* ===== v017 디자인: 남색·금색 주보 스타일 ===== */
:root{--navy:#1E3A5F;--navy2:#0E2340;--gold:#B8893B;--gold2:#F4EAD3;--cream:#F6F3ED;--ink:#1c1917;--sub:#57534e;--line:#ebe5da}
body{background:var(--cream);color:var(--ink)}
header{position:relative;background:linear-gradient(160deg,#27507F 0%,var(--navy) 45%,var(--navy2) 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 46px;border:0;overflow:hidden}
header::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(244,234,211,.18),rgba(244,234,211,0) 70%);pointer-events:none}
header .hrow{position:relative;z-index:1}
.hrow img{width:56px;height:56px;border:3px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.25);background:#fff}
.kick{font-size:.72rem;font-weight:800;color:#E9D3A6;letter-spacing:.04em}
h1{font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:-.01em;line-height:1.25}
header .when{color:#D6E0EE;font-weight:700}
header .tools{position:relative;z-index:1;margin-top:16px}
.yt{background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.22);font-weight:900}
.yt .yi{display:inline-flex;align-items:center;justify-content:center;width:34px;height:24px;border-radius:7px;background:#E00000;color:#fff;font-size:.8rem}
header .fsz{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:16px}
header .fsz button{background:transparent;color:#fff}
header .fsz button:active{background:rgba(255,255,255,.2)}
header .fsz span{color:#E9D3A6}
.datebar{position:relative;z-index:2;margin:-30px 12px 0;border:0;border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(30,58,95,.14);padding:12px}
.dmain button.ar{background:#fff;border:1.5px solid #E2D6BE;color:var(--navy);border-radius:16px}
.dnow{background:linear-gradient(180deg,#F8F3E8,#F1E7D2);border-radius:16px}
.dnow .dd{color:var(--navy2)}
.dnow .rel{background:var(--gold)}
.chip{border:1.5px solid #E7E1D6;border-radius:16px;background:#FCFBF8}
.chip.on{background:var(--navy);border-color:var(--navy);box-shadow:0 4px 12px rgba(30,58,95,.3)}
.chip.on span{color:#E9D3A6}
nav{top:0;margin-top:12px;background:rgba(246,243,237,.92);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border:0;gap:8px;padding:8px 12px}
nav button{flex:0 0 auto;min-height:50px;padding:0 18px;border-radius:999px;border:1.5px solid #E2D6BE;background:#fff;color:#57534e;font-weight:800}
nav button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(30,58,95,.28)}
main{padding:6px 12px 14px}
.card{border:0;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(28,25,23,.05),0 8px 24px rgba(28,25,23,.06)}
.svc{padding:18px 18px 16px}
.svc .kick2{font-size:.78rem;font-weight:900;color:var(--gold);letter-spacing:.04em;margin-bottom:2px}
.svc h2{font-size:1.4rem;font-weight:900;color:var(--navy2);margin:0 0 10px}
.svc .meta{display:flex;flex-wrap:wrap;gap:6px}
.svc .meta span{display:inline-flex;align-items:center;gap:4px;background:#F4F1EA;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:800;color:#44403c}
.word{position:relative;overflow:hidden;border:0;background:linear-gradient(150deg,#27507F,var(--navy) 50%,var(--navy2));color:#fff;padding:20px 20px 18px}
.word::before{content:"\201C";position:absolute;right:14px;top:-18px;font-size:7rem;font-family:Georgia,serif;color:rgba(233,211,166,.22);line-height:1}
.word .lbl{display:inline-block;color:var(--navy2);background:#E9D3A6;border-radius:999px;padding:3px 12px;font-size:.78rem}
.word .st{font-size:1.35rem;font-weight:900;margin:12px 0 8px;line-height:1.45;color:#fff;border:0;background:none;padding:0}
.word .ser{color:#D6E0EE;font-weight:700}
.order{padding:8px 16px 8px 14px}
.item{position:relative;display:block;padding:16px 4px 16px 34px;border-top:1px dashed #EDE7DC}
.item:first-child{border-top:0}
.item::after{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:#EDE3CF}
.item:first-child::after{top:24px}
.item:last-child::after{bottom:auto;height:24px}
.item::before{content:"";position:absolute;z-index:1;left:6px;top:22px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #C9B98F;box-sizing:border-box}
.item.k-h::before{border-color:var(--gold);background:var(--gold2)}
.item.k-b::before,.item.k-c::before{border-color:var(--navy);background:#DCE6F2}
.item.k-w::before{width:18px;height:18px;left:4px;top:20px;border-color:var(--navy);background:var(--navy)}
.item .n{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:.85rem;font-weight:900;color:var(--gold);letter-spacing:.02em;padding:0;margin-bottom:3px}
.item.k-b .n,.item.k-c .n,.item.k-w .n{color:var(--navy)}
.item .n .stand{display:inline-block;margin:0;font-size:.7rem;font-weight:900;color:#fff;background:#C2410C;border-radius:999px;padding:1px 8px}
.item .what{font-size:1.08rem;font-weight:800;color:var(--ink)}
.item.k-w{background:linear-gradient(90deg,#F8F3E8,rgba(248,243,232,0));border-radius:16px;border-top-color:transparent}
.item.k-w+.item{border-top-color:transparent}
.item .who{color:var(--sub);font-weight:700}
.sec{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:900;font-size:.88rem;letter-spacing:.06em;padding:16px 4px 6px}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(184,137,59,0),rgba(184,137,59,.6),rgba(184,137,59,0))}
.btns{gap:8px;margin-top:10px}
.btns a,.btns button{min-height:54px;padding:0 18px;border-radius:16px;font-weight:800;font-size:.92rem;background:#fff;border:1.5px solid #D9CFBD;color:var(--navy)}
.btns button{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(30,58,95,.22)}
.btns button:active,.btns a:active{transform:translateY(1px)}
.btns .memo{background:#FFF7E6;border-color:var(--gold);color:#7C5A1E;box-shadow:none}
.bitem{background:#FBF7EE;border:0;border-left:4px solid var(--gold);border-radius:12px;color:#7C5A1E}
.mprev{background:#FBF7EE;border:0;border-left:4px solid var(--gold)}
.ptag{background:var(--gold)}
.news h3,.mcard h3{display:flex;align-items:center;gap:8px;font-size:1.08rem;font-weight:900;color:var(--navy2)}
.news h3::before{content:"";flex:0 0 5px;align-self:stretch;min-height:1.1em;border-radius:3px;background:var(--gold)}
.news p{color:#292524}
td{border-top:1px solid #F0EBE1}
td:first-child{color:var(--navy)}
.foot{color:#a8a29e}

<div class="ysh" id="ysh" hidden><div class="yshc">
 <h3>▶ 유튜브 예배, 어떻게 볼까요?</h3>
 <button class="rec" id="ysA"><span class="bi">📺</span><span>앱 안에서 보기 + 순서 자막<span class="rtag">추천</span><small>영상 옆(휴대폰은 아래)에 지금 순서·찬송 가사·성경 말씀이 나와요</small></span></button>
 <button id="ysB"><span class="bi">▶</span><span>유튜브 앱으로 보기<small>지금처럼 만성교회 유튜브 채널을 열어요</small></span></button>
 <button class="cx" id="ysX">닫기</button>
</div></div>
<div class="yv" id="yv" hidden>
 <div class="yvh"><button class="x" id="yvx">✕ 닫기</button><div class="yvt" id="yvt"></div><button class="ytog on" id="ytog">자막 켜짐</button><div class="fsz"><button id="yfm" aria-label="자막 글자 작게">−</button><button id="yfp" aria-label="자막 글자 크게">+</button></div></div>
 <div class="yvb" id="yvb">
  <div class="yvv"><div class="yvr" id="yvr"><div id="yvp"></div></div></div>
  <div class="yvs"><div class="ychips" id="ychips"></div><div class="ynow" id="ynow"></div><div class="ynote" id="ynote"></div><div class="yvc" id="yvc"></div>
   <div class="yvn"><button id="ypv">◀ 이전</button><button class="fx" id="yfx">⏱ 지금 이 순서</button><button class="nx" id="ynx">다음 ▶</button></div></div>
 </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
let yp=null,ysv=null,yIdx=0,yAuto=-1,yTimer=null,yList=[],yLive=false;window.yOpen=false;
let yfs=+(localStorage.getItem('jb_yfs')||22);const setYfs=v=>{yfs=Math.max(16,Math.min(36,v));$('yv').style.setProperty('--yfs',yfs+'px');localStorage.setItem('jb_yfs',yfs);};setYfs(yfs);
$('yfm').onclick=()=>{setYfs(yfs-2);toast('자막 글자 '+(yfs-14));};$('yfp').onclick=()=>{setYfs(yfs+2);toast('자막 글자 '+(yfs-14));};
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x;};
const lKey=()=>'jb_ytm_'+sel+'_'+ysv.id;
function marks(){const o={};((ysv.yt&&ysv.yt.marks)||[]).forEach(([t,i])=>o[i]=t);let l={};try{l=JSON.parse(localStorage.getItem(lKey())||'{}');}catch(e){}if(!yLive)Object.assign(o,l);return o;}
window.ytChoose=()=>{$('ysh').hidden=false;};
$('ysX').onclick=()=>{$('ysh').hidden=true;};$('ysh').onclick=e=>{if(e.target.id==='ysh')$('ysh').hidden=true;};
$('ysB').onclick=()=>{$('ysh').hidden=true;ytApp();};
$('ysA').onclick=()=>{$('ysh').hidden=true;openY();};
function api(){return new Promise((res,rej)=>{if(window.YT&&YT.Player)return res();const p=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{p&&p();res();};if(!$('ytapi')){const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';s.onerror=rej;document.head.appendChild(s);}});}
const pLabel=r=>(D.passages&&D.passages[r]&&D.passages[r].label)||r;
function itemName(it){return it.hymn?`찬송 ${it.hymn}장 · ${hInfo(it.hymn).title}`:it.song?it.song:it.bible?String(it.bible).split(/\s*,\s*/).map(pLabel).join(', '):it.creed?'사도신경':(it.sermon&&D.sermon)?'「'+D.sermon.title+'」':(it.msg||it.info||'');}
function itemCont(it){
 if(it.hymn&&hInfo(it.hymn).stanzas.length)return rCont({k:'h',n:it.hymn,verses:it.verses,t:it.t}).h;
 if(it.song&&sInfo(it.song))return rCont({k:'s',name:it.song,t:it.t}).h;
 if(it.bible)return String(it.bible).split(/\s*,\s*/).filter(Boolean).map((r,i)=>rCont({k:'b',ref:r,page:i===0?it.page:'',t:it.t}).h).join('');
 if(it.creed)return rCont({k:'c',t:it.t,stand:it.stand}).h;
 if(it.sermon&&D.sermon){const s=D.sermon;return `<div class="ybig" style="padding-top:8px">「${esc(s.title)}」<small>${esc([s.series,s.preacher].filter(Boolean).join(' · '))}</small></div><div style="text-align:center;margin:0 0 14px"><button class="ymemo" onclick="openM()">✍ 은혜 메모 쓰기</button></div>`+(s.ref&&D.passages&&D.passages[s.ref]?rCont({k:'b',ref:s.ref,t:it.t}).h:'');}
 const nm=itemName(it)||it.t;
 return `<div class="ybig">${esc(nm)}${it.who?`<small>${esc(it.who)}</small>`:''}${it.stand?'<small>🙋 일어서서</small>':''}</div>`;}
function drawChips(){const mk=marks();$('ychips').innerHTML=yList.map(([it,i],k)=>`<button data-k="${k}" class="${k===yIdx?'on':''}">${esc(it.t)}${mk[i]!=null&&!yLive?`<span class="tm">${fmt(mk[i])}</span>`:''}</button>`).join('');
 $('ychips').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.k,1));
 const on=$('ychips').querySelector('.on');if(on){const c=$('ychips');c.scrollTo({left:on.offsetLeft-c.clientWidth/2+on.offsetWidth/2,behavior:'smooth'});}}
function drawNow(){const [it]=yList[yIdx]||[];if(!it)return;const nm=itemName(it);
 $('ynow').innerHTML=`<span class="nn">${yIdx+1}/${yList.length} · ${esc(it.t)}${it.stand?' · 일어서서':''}</span>${nm?`<div class="nt">${esc(nm)}</div>`:''}${it.who?`<div class="ns">${esc(it.who)}</div>`:''}`;
 $('yvc').innerHTML=itemCont(it);$('yvc').scrollTop=0;const f=$('yvc').querySelector('.st.sing');if(f)setTimeout(()=>$('yvc').scrollTop=f.offsetTop-$('yvc').offsetTop-6,30);
 $('ypv').disabled=yIdx<=0;$('ynx').disabled=yIdx>=yList.length-1;drawChips();}
function go(k,seek){yIdx=Math.max(0,Math.min(yList.length-1,k));drawNow();
 if(seek&&yp&&yp.seekTo&&!yLive){const t=marks()[yList[yIdx][1]];if(t!=null){yp.seekTo(t,true);yAuto=yIdx;}}}
$('ypv').onclick=()=>go(yIdx-1,1);$('ynx').onclick=()=>go(yIdx+1,1);
$('yfx').onclick=()=>{if(!yp||!yp.getCurrentTime){toast('영상이 나온 뒤에 눌러 주세요');return;}const t=Math.round(yp.getCurrentTime());let l={};try{l=JSON.parse(localStorage.getItem(lKey())||'{}');}catch(e){}l[yList[yIdx][1]]=t;localStorage.setItem(lKey(),JSON.stringify(l));yAuto=yIdx;drawChips();toast(`「${yList[yIdx][0].t}」 → ${fmt(t)}로 맞췄어요`);};
function tick(){if(!yp||!yp.getCurrentTime||yLive)return;let t=0;try{t=yp.getCurrentTime()||0;}catch(e){return;}const mk=marks();let best=-1,bt=-1;yList.forEach(([it,i],k)=>{const m=mk[i];if(m!=null&&m<=t+1.5&&m>=bt){bt=m;best=k;}});
 if(best>=0&&best!==yAuto){yAuto=best;if(best!==yIdx){yIdx=best;drawNow();}}}
function err(msg){$('yvr').insertAdjacentHTML('beforeend',`<div class="yerr">${msg}<button onclick="ytApp()">▶ 유튜브 앱으로 보기</button></div>`);}
async function openY(){
 ysv=D.services.find(x=>x.id===cur)||D.services.find(x=>x.id==='w2')||D.services[0];
 yList=ysv.items.map((it,i)=>[it,i]);
 const id=ysv.yt&&ysv.yt.id;yLive=!id;yIdx=0;yAuto=-1;
 $('yvt').innerHTML=`${esc(md(sel))} · ${esc(ysv.tab||ysv.name)}<small>${yLive?'🔴 생중계 · ◀ ▶로 순서를 넘겨요':(ysv.yt.approx?'영상을 따라 순서가 바뀌어요 (시간은 대략)':'영상을 따라 순서가 바뀌어요')}</small>`;
 $('ynote').textContent=yLive?'이 예배 영상이 아직 등록되지 않아 생중계 화면을 열었어요. 순서는 ◀ ▶로 넘겨 주세요.':'순서를 누르면 영상이 그 부분으로 가요. 어긋나면 그 순서에서 ⏱를 눌러 맞춰 주세요.';
 $('yfx').hidden=yLive;
 $('yvr').innerHTML='<div id="yvp"></div>';$('yv').hidden=false;document.body.style.overflow='hidden';window.yOpen=true;history.pushState({yv:1},'');drawNow();
 try{await api();}catch(e){err('영상을 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.');return;}
 if(!window.yOpen)return;
 const ev={onError:()=>err(yLive?'지금은 생중계 시간이 아니에요.<br><span style="font-size:15px;font-weight:700">주일 오전 11시 · 오후 2시 · 수요일 오후 7시</span>':'이 영상은 앱 안에서 틀 수 없어요.'),onReady:()=>tick()};
 if(yLive){$('yvp').outerHTML=`<iframe id="yvp" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube.com/embed/live_stream?channel=${CH}&enablejsapi=1&playsinline=1&rel=0&origin=${encodeURIComponent(location.origin)}"></iframe>`;yp=new YT.Player('yvp',{events:ev});}
 else{const mk=marks();const k0=yList.findIndex(([it,i])=>mk[i]!=null);yp=new YT.Player('yvp',{videoId:id,playerVars:{playsinline:1,rel:0,start:k0>=0?mk[yList[k0][1]]:0},events:ev});}
 clearInterval(yTimer);yTimer=setInterval(tick,1000);}
window.closeY=fromPop=>{if(!window.yOpen)return;window.yOpen=false;clearInterval(yTimer);try{yp&&yp.destroy&&yp.destroy();}catch(e){}yp=null;$('yvr').innerHTML='<div id="yvp"></div>';$('yv').hidden=true;document.body.style.overflow='';if(!fromPop)history.back();};
$('yvx').onclick=()=>closeY();
const subOff=off=>{$('yvb').classList.toggle('off',off);$('ytog').classList.toggle('on',!off);$('ytog').textContent=off?'자막 꺼짐':'자막 켜짐';};
$('ytog').onclick=()=>{const off=!$('yvb').classList.contains('off');subOff(off);localStorage.setItem('jb_ysub',off?'0':'1');};
subOff(localStorage.getItem('jb_ysub')==='0');
})();
</script>
</body></html>
