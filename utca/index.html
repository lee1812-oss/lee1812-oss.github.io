<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1C42">
<title>UTCA 출력일보</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--nv:#0D1C42;--nv2:#22396F;--nv3:#E8EDF7;--bg:#F3F5F9;--line:#D5DBE6;--tx:#111827;--sub:#374151;
--g:#15803D;--gbg:#E5F6EA;--r:#C62828;--rbg:#FDECEC;--o:#C2410C;--obg:#FFF1E6;--b:#1D4ED8;--bbg:#E8F0FE;--p:#6D28D9;--pbg:#F1EAFE;--gr:#4B5563;--grbg:#EEF0F3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--nv);color:#fff;padding:10px 14px calc(10px) 14px;display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
.top .who{margin-left:auto;font-size:15px;opacity:.95;text-align:right}
.top .ver{font-size:12px;opacity:.7}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;min-height:62px;border:0;background:none;font-size:15px;font-weight:700;color:var(--gr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.nav button .ic{font-size:20px;line-height:1}
.nav button.on{color:var(--nv);background:var(--nv3)}
.nav .dot{position:absolute;top:6px;right:calc(50% - 22px);background:var(--r);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;min-width:20px}
main{max-width:1180px;margin:0 auto;padding:14px 12px 96px}
@media(min-width:900px){.nav{position:sticky;top:52px;bottom:auto;border:0;border-bottom:1px solid var(--line);justify-content:center}.nav button{flex:0 0 150px;flex-direction:row;gap:8px;min-height:54px}.nav .dot{position:static}main{padding-bottom:40px}}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:19px;margin:0 0 10px}
.card h3{font-size:17px;margin:12px 0 8px;color:var(--nv2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:54px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:17px}
.btn.pri{background:var(--nv);border-color:var(--nv);color:#fff}
.btn.ok{background:var(--g);border-color:var(--g);color:#fff}
.btn.warn{background:var(--r);border-color:var(--r);color:#fff}
.btn.sm{min-height:44px;padding:0 12px;font-size:16px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 14px;border-radius:24px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:16px}
.chip.on{border-color:var(--nv);background:var(--nv);color:#fff}
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.datebar .d{flex:1;text-align:center;font-size:20px;font-weight:800}
.datebar input{position:absolute;opacity:0;pointer-events:none;width:1px}
.datebar button{min-width:54px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap}
.t-g{background:var(--gbg);color:var(--g)}.t-r{background:var(--rbg);color:var(--r)}.t-o{background:var(--obg);color:var(--o)}.t-b{background:var(--bbg);color:var(--b)}.t-p{background:var(--pbg);color:var(--p)}.t-gr{background:var(--grbg);color:var(--gr)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.big .n{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.big .n b{display:block;font-size:30px;line-height:1.1}
.big .n span{font-size:15px;color:var(--sub)}
.plist{display:flex;flex-direction:column;gap:8px}
.pp{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;min-height:62px;text-align:left;width:100%}
.pp.unset{border-color:var(--r);background:#FFF8F8}
.pp .nm{font-weight:800;font-size:18px}
.pp .sm{font-size:14px;color:var(--sub)}
.pp .st{margin-left:auto;text-align:right}
.grp{font-size:15px;font-weight:800;color:var(--nv2);margin:14px 2px 6px;display:flex;justify-content:space-between}
.warnbox{border-left:6px solid var(--r);background:var(--rbg);padding:10px 12px;border-radius:8px;margin:8px 0;font-weight:600}
.infobox{border-left:6px solid var(--b);background:var(--bbg);padding:10px 12px;border-radius:8px;margin:8px 0}
.okbox{border-left:6px solid var(--g);background:var(--gbg);padding:10px 12px;border-radius:8px;margin:8px 0;font-weight:600}
.orbox{border-left:6px solid var(--o);background:var(--obg);padding:10px 12px;border-radius:8px;margin:8px 0}
ol.list{margin:6px 0;padding-left:24px}ol.list li{margin:4px 0}
table.t{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
table.t th,table.t td{border:1px solid var(--line);padding:6px 6px;text-align:center;vertical-align:middle}
table.t th{background:var(--nv3);color:var(--nv);font-weight:800}
table.t td.l{text-align:left}
.board td{padding:4px}
.cell{display:block;width:100%;min-height:54px;border-radius:10px;border:0;font-weight:800;font-size:14px;padding:4px}
.c-missing{background:var(--rbg);color:var(--r)}.c-mism{background:var(--r);color:#fff}.c-wait{background:var(--obg);color:var(--o)}.c-ready{background:var(--bbg);color:var(--b)}.c-done{background:var(--gbg);color:var(--g)}.c-off{background:var(--grbg);color:var(--gr)}.c-none{background:#fff;color:#9CA3AF}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
label.f{display:block;font-weight:700;margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;min-height:52px;border:1px solid #9CA3AF;border-radius:10px;padding:8px 12px;background:#fff;font-size:17px}
textarea.i{min-height:70px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:900px){.sheet{align-items:center}.sheet .in{border-radius:18px}}
.sheet h2{margin:0 0 8px;font-size:20px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stgrid button{min-height:58px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:16px;text-align:left;padding:6px 10px}
.stgrid button small{display:block;font-weight:600;font-size:13px;color:var(--sub)}
.stgrid button.on{border-color:var(--nv);background:var(--nv3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:80;font-weight:700;max-width:90vw}
.muted{color:var(--sub);font-size:15px}
.kt{white-space:pre-wrap;background:#FFFBE6;border:1px solid #E5D48A;border-radius:10px;padding:10px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-weight:800;text-align:center;font-size:14px;color:var(--nv2)}
.cal .dd{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:3px;font-size:12.5px;background:#fff}
.cal .dd .dn{font-weight:800;font-size:14px}
.cal .dd.sun .dn,.cal .dd.hol .dn{color:var(--r)}.cal .dd.sat .dn{color:var(--b)}
.cal .dd .wl{display:flex;justify-content:space-between;gap:2px;line-height:1.35}
.lock{max-width:520px;margin:40px auto}
#print{display:none}
@media print{
 @page{size:A4 landscape;margin:8mm}
 body{background:#fff;font-size:11pt}
 .top,.nav,main,.toast,.sheet{display:none!important}
 #print{display:block}
 #print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #print h1{font-size:16pt;margin:0 0 4mm}
 #print table{border-collapse:collapse;width:100%;font-size:9pt}
 #print th,#print td{border:1px solid #555;padding:2px 3px;text-align:center}
 #print thead{display:table-header-group}
 #print tr{break-inside:avoid}
 #print .pg{break-after:page}
 #print .pg:last-child{break-after:auto}
 #print .cal .dd{min-height:24mm;font-size:8pt;border:1px solid #555}
 #print .foot{font-size:9pt;margin-top:3mm}
}
</style>
</head>
<body>
<div class="top"><div><h1>UTCA 출력일보</h1><div class="ver" id="ver"></div></div><div class="who" id="who"></div></div>
<nav class="nav" id="nav"></nav>
<main id="app"><div class="card">불러오는 중...</div></main>
<div id="print"></div>
<script>
'use strict';
const APP_VER='v001';
const API_URL='https://script.google.com/macros/s/AKfycbwQQiInBqD92iWow3Ap40Dm8qUpynAl8E-YEY8iewYiC9kRByU6BwEkoFovNr87-UQTBQ/exec';
const LS='utcaDaily.';
const DEMO=/[?&]demo=1/.test(location.search)||API_URL.indexOf('__')===0;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const WD=['일','월','화','수','목','금','토'];

/* ---------- 날짜 (미국 동부 시간 기준) ---------- */
function todayET(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return p;}
function addD(d,n){const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);}
function dow(d){return new Date(d+'T12:00:00Z').getUTCDay();}
function md(d){return (+d.slice(5,7))+'/'+(+d.slice(8,10))+'('+WD[dow(d)]+')';}
function ymd2(d){return d.slice(2,4)+'.'+d.slice(5,7)+'.'+d.slice(8,10)+'('+WD[dow(d)]+')';}
function monthDays(ym){const out=[];let d=ym+'-01';while(d.slice(0,7)===ym){out.push(d);d=addD(d,1);}return out;}
function holName(d){const h=(S.cfg.holidays||[]).find(x=>x.d===d);return h?h.name:'';}
function dayClass(d){if(holName(d))return 'hol';const w=dow(d);return w===0?'sun':w===6?'sat':'wk';}
function isRest(d){const c=dayClass(d);return c==='sun'||c==='hol';}
function nowKST(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',dateStyle:'short',timeStyle:'short'}).format(new Date());}

/* ---------- 상태 정의 (현장 공수 기준표 v1, 2026-10-29) ---------- */
const ST={
 work:{l:'출근',gs:1,c:'g',time:1,d:'정상 근무 (OT 자동 계산)'},
 night:{l:'야간 근무',gs:1,c:'g',time:1,d:'16~22시 · 1공수, OT 없음'},
 mgr:{l:'관리자 근무',gs:1,c:'g',d:'관리자는 출퇴근 생략'},
 move:{l:'이동·대기',gs:1,c:'b',need:'어디에서 어디로',d:'현장 이동·대기일 1공수'},
 arrive:{l:'입국일',gs:1,c:'b',need:'항공편·도착 시간',d:'입국한 날부터 1공수'},
 siteoff:{l:'현장사정 쉼',gs:1,c:'b',need:'사유 (날씨·현장 중지 등)',d:'개인 사유 아님 → 1공수'},
 paid:{l:'유급휴가',gs:0,c:'p',need:'기간 (예: 10/29~11/07)',d:'사전 협의된 유급휴가'},
 depart:{l:'출국 (휴가 시작)',gs:0,c:'p',need:'복귀 예정일',d:'한국행 비행기 타는 날'},
 off:{l:'개인 휴무',gs:0,c:'o',need:'사유',d:'개인 사정 쉼 → 공수 빠짐'},
 absent:{l:'결근',gs:0,c:'r',need:'사유',d:'연락 없이 안 나옴 등'},
 other:{l:'다른 현장 근무',gs:0,c:'o',needWp:1,d:'다른 현장 보고에 들어가야 함'},
 quit:{l:'퇴사',gs:0,c:'r',need:'퇴사일·사유',d:'퇴사 → 인원에서 빠짐'}
};
const ST_SITE=['work','night','move','arrive','siteoff','paid','depart','off','absent','other','quit'];
const ST_LOCAL=['work','off','absent','siteoff','paid','other','quit'];
const WORKED=['work','night','mgr','move','arrive'];
const KIND={KR:'한국인',KRM:'관리자',LF:'로컬 고정급',LD:'로컬 일당'};
const isLocal=k=>k==='LF'||k==='LD';
const tagC={g:'t-g',r:'t-r',o:'t-o',b:'t-b',p:'t-p',gr:'t-gr'};
function stTag(st,extra){if(!st)return '<span class="tag t-r">선택 안 함</span>';const s=ST[st]||{l:st,c:'gr'};return `<span class="tag ${tagC[s.c]}">${esc(s.l)}${extra?' · '+esc(extra):''}</span>`;}

/* ---------- 시간·OT ---------- */
const tm=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null;};
function otHours(row,d){
 if(row.kind!=='KR'||row.st!=='work')return 0;
 const a=tm(row.in),b0=tm(row.out);if(a==null||b0==null)return 0;
 let b=b0<a?b0+1440:b0;const c=dayClass(d),R=S.cfg.rules||{};
 let m=0;
 if(c==='sun'||c==='hol'){m=b-a;if(m>=360)m-=(R.lunchMin||60);}
 else if(c==='sat'){m=Math.max(0,b-tm(R.satEnd||'15:00'));}
 else{m=Math.max(0,b-tm(R.wkEnd||'17:00'));}
 return Math.round(m/30)/2;
}
function baseFor(d){const c=dayClass(d);return c==='sat'?{in:'08:00',out:'15:00'}:{in:'08:00',out:'17:00'};}

/* ---------- 상태 ---------- */
const S={me:null,people:{list:[]},peopleRev:0,cfg:{wps:[],holidays:[],rules:{}},cfgRev:0,items:{},view:'',date:todayET(),wp:'',month:todayET().slice(0,7),draft:null,draftKey:'',loaded:{from:'9999',to:'0000'},lroll:null};
const TOKEN=(()=>{const m=/[#&]k=([a-z0-9]+)/i.exec(location.hash);if(m){localStorage.setItem(LS+'k',m[1]);history.replaceState(null,'',location.pathname+location.search);return m[1];}return localStorage.getItem(LS+'k')||'';})();

/* ---------- 서버 ---------- */
async function api(a,body){
 body=Object.assign({a,t:TOKEN},body||{});
 if(DEMO)return demoApi(body);
 const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error('서버 응답 '+r.status);
 return r.json();
}
async function loadRange(from,to){
 const r=await api('load',{from,to});
 if(!r.ok){if(r.code==='auth')localStorage.removeItem(LS+'k');throw new Error(r.error);}
 applyLoad(r);
 if(from<S.loaded.from)S.loaded.from=from;if(to>S.loaded.to)S.loaded.to=to;
}
function applyLoad(r){
 if(r.people){S.people=r.people.data||{list:[]};S.peopleRev=r.people.rev;}
 if(r.cfg){S.cfg=r.cfg.data;S.cfgRev=r.cfg.rev;}
 Object.assign(S.items,r.items||{});
 localStorage.setItem(LS+'cache',JSON.stringify({people:S.people,peopleRev:S.peopleRev,cfg:S.cfg,cfgRev:S.cfgRev,at:Date.now()}));
}
async function refresh(){const t=todayET();const f=S.loaded.from<addD(t,-20)?S.loaded.from:addD(t,-20);S.loaded={from:'9999',to:'0000'};S.items={};await loadRange(f,addD(t,3));}
async function save(key,data,reason){
 const cur=S.items[key]||(key==='people'?{rev:S.peopleRev}:key==='cfg'?{rev:S.cfgRev}:null);
 const r=await api('save',{key,data,rev:cur?cur.rev:0,reason:reason||''});
 if(!r.ok){
  if(r.code==='conflict'){if(r.cur){if(key==='people'){S.people=r.cur.data;S.peopleRev=r.cur.rev;}else if(key==='cfg'){S.cfg=r.cur.data;S.cfgRev=r.cur.rev;}else S.items[key]=r.cur;}}
  throw new Error(r.error);
 }
 if(key==='people'){S.people=data;S.peopleRev=r.rev;}else if(key==='cfg'){S.cfg=data;S.cfgRev=r.rev;}else S.items[key]={data,rev:r.rev,at:r.at,by:r.by};
 return r;
}
const I=k=>S.items[k]&&S.items[k].data;

/* ---------- 사람·현장 ---------- */
const WPS=()=>(S.cfg.wps||[]).filter(w=>w.active);
const wpName=id=>{const w=(S.cfg.wps||[]).find(x=>x.id===id);return w?w.name:id||'';};
const pById=id=>(S.people.list||[]).find(p=>p.id===id);
function rosterAt(wp,d){return (S.people.list||[]).filter(p=>p.active!==false&&p.wp===wp&&(!p.start||p.start<=d)&&(!p.end||p.end>=d));}
function myWps(){const me=S.me;if(!me)return [];if(me.role==='office'||me.role==='view'||me.wps.includes('*'))return WPS().map(w=>w.id);return me.wps.filter(id=>WPS().some(w=>w.id===id));}
function siteWps(){return myWps().filter(id=>{const w=(S.cfg.wps||[]).find(x=>x.id===id);return w&&w.siteReport;});}

/* ---------- 크로스체크 계산 ---------- */
function cross(d){
 const res={byWp:{},list:[],pending:[]};
 const roll=I('l:'+d),fixes=(I('c:'+d)||{}).fixes||{};
 const site={};
 WPS().forEach(w=>{res.byWp[w.id]={mism:0,open:0,list:[]};const r=I('r:'+d+':'+w.id);if(r&&!r.dayOff)(r.rows||[]).forEach(x=>{const k=x.pid||('new:'+x.name);(site[k]=site[k]||[]).push(Object.assign({wp:w.id},x));});});
 const rl={};if(roll)(roll.rows||[]).forEach(x=>{rl[x.pid||('new:'+x.name)]=x;});
 const keys=new Set();
 Object.keys(site).forEach(k=>{const e=site[k][0];if(isLocal(e.kind))keys.add(k);});
 Object.keys(rl).forEach(k=>keys.add(k));
 keys.forEach(k=>{
  const s=(site[k]||[]).filter(x=>x.st!=='other'),s0=s.find(x=>WORKED.includes(x.st))||s[0],r=rl[k];
  const name=(s0&&s0.name)||(r&&r.name)||k;
  const sW=!!(s0&&WORKED.includes(s0.st)),rW=!!(r&&WORKED.includes(r.st));
  const wpR=r?r.wp:'',wpS=s0?s0.wp:'';
  const wpRcfg=(S.cfg.wps||[]).find(w=>w.id===wpR);
  let prob='';
  if(!roll){if(s0&&isLocal(s0.kind))res.pending.push({k,name,wp:wpS,why:'로컬 출근부 대기'});return;}
  if(!r){prob='출근부에 없음 (현장 보고에는 '+(ST[s0.st]||{}).l+')';}
  else if(!s0){
   if(rW&&wpRcfg&&wpRcfg.siteReport){const rep=I('r:'+d+':'+wpR);if(!rep){res.pending.push({k,name,wp:wpR,why:'현장 보고 대기'});return;}if(rep.dayOff)prob='현장은 전체 휴무로 보고, 출근부는 나옴';else prob='현장 보고에 없음 (출근부에는 나옴)';}
   else return;
  }
  else if(sW!==rW)prob='현장 보고 '+(ST[s0.st]||{}).l+' ↔ 출근부 '+(ST[r.st]||{}).l;
  else if(sW&&rW&&wpS!==wpR)prob='현장이 다름: 현장 보고 '+wpName(wpS)+' ↔ 출근부 '+wpName(wpR);
  if(!prob)return;
  const fx=fixes[k];
  const item={k,name,prob,wpS,wpR,s:s0||null,r:r||null,fix:fx||null};
  res.list.push(item);
  [wpS,wpR].filter((x,i,a)=>x&&a.indexOf(x)===i).forEach(w=>{if(res.byWp[w]){res.byWp[w].mism++;if(!fx)res.byWp[w].open++;res.byWp[w].list.push(item);}});
 });
 return res;
}
/* 한국 인력 등 같은 날 두 현장 중복·다른 현장 표시 확인 */
function dupCheck(d){
 const seen={},out=[];
 WPS().forEach(w=>{const r=I('r:'+d+':'+w.id);if(!r||r.dayOff)return;(r.rows||[]).forEach(x=>{const k=x.pid||('new:'+x.name);if(WORKED.includes(x.st))(seen[k]=seen[k]||[]).push(w.id);});});
 Object.keys(seen).forEach(k=>{if(seen[k].length>1){const p=pById(k);out.push({k,name:p?p.name:k.replace('new:',''),wps:seen[k],t:'같은 날 두 현장에 출근으로 보고됨: '+seen[k].map(wpName).join(', ')});}});
 WPS().forEach(w=>{const r=I('r:'+d+':'+w.id);if(!r||r.dayOff)return;(r.rows||[]).forEach(x=>{if(x.st==='other'&&x.wp2){const r2=I('r:'+d+':'+x.wp2);const w2=(S.cfg.wps||[]).find(y=>y.id===x.wp2);if(w2&&w2.siteReport&&r2&&!(r2.rows||[]).some(y=>(y.pid||'')===(x.pid||'')&&WORKED.includes(y.st)))out.push({k:x.pid,name:x.name,wps:[w.id,x.wp2],t:wpName(w.id)+' 보고에 「'+wpName(x.wp2)+' 근무」라고 했는데 '+wpName(x.wp2)+' 보고에는 없음'});}});});
 return out;
}
function hasLocals(w,d){return rosterAt(w,d).some(p=>isLocal(p.kind));}
function cellState(d,w){
 const wc=(S.cfg.wps||[]).find(x=>x.id===w);if(!wc)return {s:'none',t:''};
 const today=todayET(),since=S.cfg.since||'2000-01-01';
 if(d>today)return {s:'none',t:''};
 const conf=((I('k:'+d)||{}).confirms||{})[w];
 const cr=cross(d).byWp[w]||{open:0,mism:0};
 const roll=I('l:'+d);
 if(wc.siteReport){
  const r=I('r:'+d+':'+w);
  if(!r){if(d<since)return {s:'none',t:'-'};return isRest(d)?{s:'off',t:'보고 없음\n(휴일)'}:{s:'missing',t:'미보고'};}
  if(r.dayOff)return conf?{s:'done',t:'휴무 ✓'}:{s:'off',t:'현장 휴무'};
  const n=(r.rows||[]).filter(x=>WORKED.includes(x.st)).length;
  if(cr.open)return {s:'mism',t:'불일치 '+cr.open};
  if(!roll&&hasLocals(w,d))return {s:'wait',t:n+'명\n출근부 대기'};
  if(conf)return {s:'done',t:n+'명 ✓'};
  return {s:'ready',t:n+'명\n확인 대기'};
 }
 if(!hasLocals(w,d))return {s:'none',t:'-'};
 if(!roll){if(d<since)return {s:'none',t:'-'};return isRest(d)?{s:'off',t:'출근부 없음\n(휴일)'}:{s:'missing',t:'출근부 없음'};}
 const n=(roll.rows||[]).filter(x=>x.wp===w&&WORKED.includes(x.st)).length;
 if(cr.open)return {s:'mism',t:'불일치 '+cr.open};
 if(conf)return {s:'done',t:n+'명 ✓'};
 return {s:'ready',t:n+'명\n확인 대기'};
}

/* ---------- 최종 공수 (집계용) ---------- */
function dayFinal(d){
 const out=[],roll=I('l:'+d),fixes=(I('c:'+d)||{}).fixes||{};
 const rl={};if(roll)(roll.rows||[]).forEach(x=>{rl[x.pid||('new:'+x.name)]=x;});
 const usedLocal=new Set();
 WPS().forEach(w=>{const r=I('r:'+d+':'+w.id);if(!r||r.dayOff)return;(r.rows||[]).forEach(x=>{
  const k=x.pid||('new:'+x.name);
  if(isLocal(x.kind)){
   if(roll&&rl[k]&&!(fixes[k]&&fixes[k].pick==='site'))return; // 출근부 기준
   usedLocal.add(k);
  }
  if(x.st==='other')return;
  out.push(Object.assign({wp:w.id,src:'현장'},x,{ot:otHours(x,d),gs:(ST[x.st]||{}).gs||0}));
 });});
 if(roll)(roll.rows||[]).forEach(x=>{const k=x.pid||('new:'+x.name);if(usedLocal.has(k))return;if(x.st==='other')return;out.push(Object.assign({src:'출근부'},x,{ot:0,gs:(ST[x.st]||{}).gs||0}));});
 return out;
}

function issues(){
 const t=todayET(),since=S.cfg.since||'2000-01-01',out=[];
 for(let d=addD(t,-14);d<=t;d=addD(d,1)){
  if(d<since)continue;
  WPS().forEach(w=>{
   if(!myWps().includes(w.id))return;
   const c=cellState(d,w.id);
   if(c.s==='missing')out.push({lv:'r',d,w:w.id,t:md(d)+' '+w.name+' '+(w.siteReport?'출력일보 미보고':'로컬 출근부 없음'),go:w.siteReport?['report',d,w.id]:['local',d]});
  });
  const cr=cross(d);
  cr.list.filter(x=>!x.fix).forEach(x=>{if(myWps().includes(x.wpS)||myWps().includes(x.wpR))out.push({lv:'r',d,t:md(d)+' '+x.name+': '+x.prob,go:['check',d]});});
  dupCheck(d).forEach(x=>{if(x.wps.some(w=>myWps().includes(w)))out.push({lv:'r',d,t:md(d)+' '+x.name+': '+x.t,go:['day',d,x.wps[0]]});});
  WPS().forEach(w=>{const r=I('r:'+d+':'+w.id);if(!r)return;(r.rows||[]).forEach(x=>{if(x.isNew&&!pById(x.pid))out.push({lv:'o',d,t:md(d)+' '+w.name+' 새 이름 「'+x.name+'」 인원 등록 필요',go:['people']});});
   if(r.hist&&r.hist.length>1){const h=r.hist[r.hist.length-1];const conf=((I('k:'+d)||{}).confirms||{})[w.id];if(!conf)out.push({lv:'b',d,t:md(d)+' '+w.name+' 정정 보고: '+(h.reason||''),go:['day',d,w.id]});}});
 }
 const seen=new Set();return out.filter(x=>{const k=x.t;if(seen.has(k))return false;seen.add(k);return true;});
}

function validateReport(D){
 const err=[],warn=[];
 if(D.dayOff){if(!D.offNote.trim())err.push('현장 전체 쉼 이유를 적어 주세요.');return {err,warn};}
 if(!D.base)err.push('2번 기본 근무시간을 골라 주세요.');
 D.rows.forEach(x=>{
  if(!x.st){err.push(x.name+': 상태를 고르지 않았어요.');return;}
  const s=ST[x.st];
  if(s.need&&!(x.note||'').trim())err.push(x.name+': '+s.l+' → 메모('+s.need+')를 적어 주세요.');
  if(s.needWp&&!x.wp2)err.push(x.name+': 어느 현장에서 일했는지 골라 주세요.');
  if(s.time){const a=x.in||(D.base||{}).in,b=x.out||(D.base||{}).out;if(!a||!b)err.push(x.name+': 출근·퇴근 시간이 없어요.');}
 });
 if(!D.rows.length)err.push('사람이 한 명도 없어요. 「+ 사람 추가」로 넣어 주세요.');
 // 같은 날 다른 현장 중복
 WPS().forEach(w=>{if(w.id===D.wp)return;const r=I('r:'+D.date+':'+w.id);if(!r||r.dayOff)return;(r.rows||[]).forEach(y=>{if(!WORKED.includes(y.st))return;const me=D.rows.find(x=>x.pid&&x.pid===y.pid&&WORKED.includes(x.st));if(me)warn.push(me.name+': 같은 날 '+w.name+' 보고에도 출근으로 있어요. 한 곳만 맞으면 고쳐 주세요.');});});
 // 로컬 출근부와 미리 비교
 const roll=I('l:'+D.date);
 if(roll){D.rows.filter(x=>isLocal(x.kind)).forEach(x=>{const r=(roll.rows||[]).find(y=>y.pid===x.pid);const a=WORKED.includes(x.st),b=r&&WORKED.includes(r.st);if(!r)warn.push(x.name+': 지창석 부장님 출근부에 없어요.');else if(a!==b)warn.push(x.name+': 출근부에는 「'+ST[r.st].l+'」이에요.');else if(a&&r.wp!==D.wp)warn.push(x.name+': 출근부에는 '+wpName(r.wp)+' 근무예요.');});
  (roll.rows||[]).filter(y=>y.wp===D.wp&&WORKED.includes(y.st)&&!D.rows.some(x=>x.pid===y.pid)).forEach(y=>warn.push(y.name+': 출근부에는 이 현장에 나왔는데 이 보고에는 없어요.'));}
 if(D.editing&&!(D.reason||'').trim())err.push('정정 이유를 적어 주세요.');
 return {err,warn};
}
function finalizeRows(D){
 return D.rows.map(x=>{const o=Object.assign({},x);const s=ST[x.st]||{};
  if(s.time){o.in=x.in||D.base.in;o.out=x.out||D.base.out;}else{o.in='';o.out='';}
  if(isLocal(x.kind)){o.in=s.time?o.in:'';}

}

function monthAgg(ym){
 const days=monthDays(ym),per={},cal={};
 days.forEach(d=>{cal[d]={};dayFinal(d).forEach(x=>{
  const k=x.pid||('new:'+x.name),p=pById(x.pid);
  const o=per[k]=per[k]||{name:x.name,kind:x.kind,wp:x.wp,gs:0,ot:0,paid:0,off:0,absent:0,move:0,days:{},excl:p&&p.excl};
  o.gs+=x.gs;o.ot+=x.ot||0;if(x.st==='paid'||x.st==='depart')o.paid++;if(x.st==='off')o.off++;if(x.st==='absent')o.absent++;if(x.st==='move'||x.st==='arrive')o.move++;
  o.days[d]=x;o.wp=x.wp;
  if(WORKED.includes(x.st)){const c=cal[d][x.wp]=cal[d][x.wp]||{kr:0,lo:0};if(isLocal(x.kind))c.lo++;else c.kr++;}
 });});
 return {days,per,cal};
}

}

function demoApi(b){
 const K=LS+'demo.';const st=JSON.parse(localStorage.getItem(K+'store')||'null')||demoSeed();
 const users={office:{name:'이혜영 부장',role:'office',wps:['*']},site:{name:'김수진 이사',role:'site',wps:['DO','LS','KG','KS']},site2:{name:'최지훈 차장',role:'site',wps:['OH']},local:{name:'지창석 부장',role:'local',wps:['FC']},view:{name:'이명진 이사',role:'view',wps:['*']}};
 const role=(/[?&]as=(\w+)/.exec(location.search)||[])[1]||'office';const u=users[role]||users.office;
 const keep=()=>localStorage.setItem(K+'store',JSON.stringify(st));
 if(b.a==='me')return {ok:true,me:u};
 if(b.a==='load'){const items={};Object.keys(st).forEach(k=>{if(k==='people'||k==='cfg')return;const d=k.split(':')[1];if(d>=b.from&&d<=b.to)items[k]=st[k];});return {ok:true,people:st.people,cfg:st.cfg,items};}
 if(b.a==='save'){const cur=st[b.key];if((cur?cur.rev:0)!==Number(b.rev||0))return {ok:false,code:'conflict',error:'다른 분이 먼저 고쳤습니다.',cur};st[b.key]={data:b.data,rev:(cur?cur.rev:0)+1,at:nowKST(),by:u.name};keep();return {ok:true,rev:st[b.key].rev,at:st[b.key].at,by:u.name};}
 if(b.a==='users')return {ok:true,list:Object.values(users).map((x,i)=>({token:'demo'+i,name:x.name,role:x.role,wps:x.wps.join(','),active:true}))};
 if(b.a==='addUser')return {ok:true,token:'demo_new'};
 if(b.a==='log')return {ok:true,list:[]};
 return {ok:false,error:'시험판에서는 안 되는 기능'};
}
