<style>

#isht{position:fixed;inset:0;z-index:30;background:rgba(17,24,39,.5);display:flex;align-items:flex-end}#isht .in{background:#fff;width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));font-size:16px;line-height:1.6;max-height:88vh;overflow:auto}
#isht h3{margin:0 0 8px;font-size:18px}#isht .n{border-radius:10px;padding:10px 12px;margin:8px 0}#isht .b{background:#eaf1fe;color:#1e3a8a}#isht .w{background:#fff4e5;color:#7c2d12}#isht .r{background:#fef2f2;color:#7f1d1d}#isht button{width:100%;min-height:52px;border-radius:12px;border:0;background:#1d4ed8;color:#fff;font:inherit;font-weight:700;margin-top:8px}

#pb.ok{background:#e9f7ee;color:#14532d;border:1px solid #86efac}#pb.in{background:#eaf1fe;color:#1e3a8a;border:1px solid #9db7f3}#pb.wn{background:#fff4e5;color:#7c2d12;border:1px solid #fdba74}
#pb .t{flex:1}#pb button{font:inherit;font-weight:700;border-radius:10px;border:1px solid currentColor;background:#fff;color:inherit;min-height:44px;padding:0 14px;margin-top:6px;cursor:pointer}#pb .x{border:0;background:transparent;font-size:18px;min-width:36px;margin-top:0}

</style></head><body>
<div id="msg" class="hide">잘못된 링크입니다.<br>팀장에게 받은 QR 또는 링크로 한 번 열어 주세요.<br><br><small style="color:#667">홈 화면 아이콘으로 열었는데 이 화면이 나오면:<br>① 홈 화면의 「건강일지」 앱을 지우고<br>② 팀장에게 받은 QR(링크)을 <b>크롬</b>으로 열어<br>③ ⋮ → 「앱 설치」로 다시 설치해 주세요.</small></div>
<div id="ib" class="hide"></div><div id="pb" class="hide"></div><button id="sv" class="hide">🔊 9시 안내 소리 시험</button><div id="say" class="hide"></div><div id="isht" class="hide"></div>
<iframe id="fr" class="hide" allow="fullscreen" title="건강상태확인일지"></iframe>
<button class="fb hide" id="bFs">⛶ 화면 채우기</button>
<button class="fb hide" id="bEx" style="background:rgba(200,40,40,.85);opacity:1">✕ 채우기 취소</button>
<script>
var HL_EXEC="";
(function(){
  var EXEC=HL_EXEC="https://script.google.com/macros/s/AKfycbzNl5rHzO50ma6wfpor9ScTccQkmXTviCfofLdq0E0EV3n1yRaA1lplrtoOgMfTPF0pDQ/exec";
  var q=new URLSearchParams(location.search),k=q.get("k")||"",m=q.get("m")||"tablet";
  /* 링크 키는 이 기기에만 기억합니다(저장소에 키를 올리지 않기 위해). 앱으로 설치한 뒤에는 주소에 키가 없어도 기억해 둔 키로 엽니다. */
  var ok=/^[A-Za-z0-9_-]{6,60}$/;
  try{if(ok.test(k))localStorage.setItem("hl_k",k);else{var sv=localStorage.getItem("hl_k")||"";if(ok.test(sv))k=sv}}catch(e){}
  if(!ok.test(k)){document.getElementById("msg").classList.remove("hide");return}
  var isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  /* 아이폰은 manifest를 붙이지 않는다: 붙이면 홈 화면 앱이 열쇠(k) 없는 주소로 열리고, 아이폰 홈 화면 앱은 사파리와 저장 공간이 달라 「잘못된 링크」가 된다. 붙이지 않으면 지금 주소(열쇠 포함)로 설치된다. */
  if(m==="phone"&&!isIOS){var lk=document.createElement("link");lk.rel="manifest";lk.href="manifest.webmanifest";document.head.appendChild(lk)}
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})}catch(e){}}
  if(["admin","tablet","phone"].indexOf(m)<0)m="tablet";
  var fr=document.getElementById("fr");/* w3: 화면은 같은 곳의 app.html(빠름)로 열고, 자료만 구글에서 받는다. app.html이 실패하면 스스로 예전 주소(EXEC)로 넘어간다 */
  fr.src="app.html?v=a038&m="+m+"&k="+encodeURIComponent(k);fr.classList.remove("hide");
  var bFs=document.getElementById("bFs"),bEx=document.getElementById("bEx"),de=document.documentElement;
  var can=!!(de.requestFullscreen||de.webkitRequestFullscreen)&&m!=="phone";   /* 휴대폰은 한 화면 배치라 가림 방지를 위해 채우기 버튼을 두지 않음 */
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
  function sync(){bFs.classList.toggle("hide",!can||isFs());bEx.classList.toggle("hide",!isFs())}
  bFs.onclick=function(){try{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}catch(e){}};
  bEx.onclick=function(){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}};
  document.addEventListener("fullscreenchange",sync);document.addEventListener("webkitfullscreenchange",sync);
  sync();
  if(m==="phone")instHelp(isIOS);
  try{pushInit(k,m)}catch(e){}
  if(m==="tablet")try{sayInit(k)}catch(e){}
  verCheck();
})();
/* ---------- 설치 상태 안내 (바로연락 v007과 같은 방식) ---------- */
var WRAP_VER="w6";
function instFix(){var s=document.getElementById("isht");s.innerHTML='<div class="in"><h3>앱이 안 보이거나 안 열릴 때 (완전히 지우고 다시 설치)</h3>'+
 '<div class="n b"><b>1. 먼저 찾아보기</b><br>홈 화면을 위로 쓸어 올려 <b>앱스 화면</b> 맨 위 검색 칸에 <b>「건강일지」</b>를 쳐 보세요. 보이면 꾹 눌러 홈 화면으로 끌어오면 돼요.</div>'+
 '<div class="n w"><b>2. 「앱을 열 수 없음」이나 「잘못된 링크」가 뜨면</b><br>① 설정 → 애플리케이션 → 「건강일지」 → <b>삭제</b><br>② 휴대폰을 껐다 켜기<br>③ 팀장에게 받은 <b>QR(링크)</b>을 <b>크롬</b>으로 열기<br>④ ⋮ → <b>「앱 설치」</b> → 1분쯤 기다리기</div>'+
 '<div class="n r">⚠️ 크롬 설정의 <b>「사이트 데이터 삭제」는 하지 마세요.</b> 지우면 이 휴대폰이 기억한 열쇠도 지워져서, 꼭 팀장 링크로 다시 열어야 해요.</div>'+
 '<div class="n b"><b>3. 그래도 안 되면</b><br>삼성 인터넷으로 팀장 링크를 열고 ≡ → 「현재 페이지 추가」 → 「홈 화면」.</div><button id="iok">확인</button></div>';
 s.classList.remove("hide");document.getElementById("iok").onclick=function(){s.classList.add("hide")}}
function instHelp(isIOS){
 var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;if(standalone)return;
 var ib=document.getElementById("ib"),evt=null,shown=false;
 var close='<button class="x" aria-label="닫기">✕</button>';
 function bind(){var x=ib.querySelector(".x");if(x)x.onclick=function(){ib.classList.add("hide");try{sessionStorage.setItem("hl_ib_x","1")}catch(e){}};var f=ib.querySelector(".fx");if(f)f.onclick=instFix;var g=ib.querySelector(".go");if(g)g.onclick=function(){if(!evt)return;evt.prompt();evt.userChoice.then(function(c){evt=null;ib.classList.add("hide")}).catch(function(){})}}
 function show(kind){try{if(sessionStorage.getItem("hl_ib_x"))return}catch(e){}shown=true;
  if(kind==="ok")ib.innerHTML='<div class="t">✓ 이 휴대폰에 <b>「건강일지」 앱이 이미 설치돼 있어요.</b> 홈 화면·앱스 화면의 아이콘으로 여세요.<br><button class="fx">안 보이거나 안 열려요 →</button></div>'+close,ib.className="ok";
  else if(kind==="in")ib.innerHTML='<div class="t">📲 홈 화면에 <b>앱으로 설치</b>하면 다음부터 바로 열려요.<br><button class="go">설치하기</button> <button class="fx">설치 문제 해결</button></div>'+close,ib.className="in";
  else if(kind==="ios")ib.innerHTML='<div class="t">📲 아이폰은 사파리 <b>공유(□↑) → 「홈 화면에 추가」</b>로 설치해요. <b>이 링크로 연 상태에서</b> 추가해 주세요.</div>'+close,ib.className="in";
  bind()}
 if(isIOS){show("ios");return}
 window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();evt=e;if(!shown||ib.className!=="ok")show("in")});
 window.addEventListener("appinstalled",function(){ib.classList.add("hide")});
 try{if(navigator.getInstalledRelatedApps)navigator.getInstalledRelatedApps().then(function(r){if(r&&r.length)show("ok")}).catch(function(){})}catch(e){}
}
/* ---------- w4: 9시 체크 알림 받기 (웹 푸시). 근무일 09:00에 체크 전 인원이 있으면 알림을 켠 모든 기기에 울린다 ---------- */
function b64uU8(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hlApi(f,a){return fetch(HL_EXEC,{method:"POST",body:JSON.stringify({f:f,a:a})}).then(function(r){return r.json()})}
function pushInit(k,m){
 if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window))return;
 var standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
 if(m==="phone"&&!standalone)return;   /* 휴대폰은 앱으로 설치한 뒤에만 안내 */
 var pb=document.getElementById("pb");
 function dev(){var u=navigator.userAgent,mm=u.match(/;\s*([^;)]+)\s+Build\//);return mm?mm[1]:(/iPhone|iPad/.test(u)?"iPhone":/Windows/.test(u)?"Windows PC":/Android/.test(u)?"Android":"기기")}
 function dismissed(){try{return Date.now()-(+localStorage.getItem("hl_pb_x")||0)<3*864e5}catch(e){return false}}
 function bar(html,cls){pb.innerHTML=html+'<button class="x" aria-label="닫기">✕</button>';pb.className=cls;pb.querySelector(".x").onclick=function(){pb.className="hide";try{localStorage.setItem("hl_pb_x",String(Date.now()))}catch(e){}};var o=pb.querySelector(".on");if(o)o.onclick=function(){turnOn(o)}}
 function save(s){return hlApi("apiPushSub",[k,s.endpoint,m,dev()]).then(function(j){if(j&&j.ok){try{localStorage.setItem("hl_push_ep",s.endpoint)}catch(e){}}return j})}
 function offBar(){bar('<div class="t">🔕 이 기기는 알림이 <b>꺼져</b> 있어요. 9시 체크 알림을 받으려면 휴대폰 <b>설정 → 애플리케이션 → 건강일지(또는 크롬) → 알림 → 허용</b>으로 바꿔 주세요.</div>',"wn")}
 function okBar(){bar('<div class="t">🔔 <b>9시 체크 알림이 켜졌어요.</b> 근무일 아침 9시에 아직 체크 안 한 분이 있으면 이 기기에 알림이 울려요.<br><button class="ts">시험 알림 받아 보기</button></div>',"ok");
  var b=pb.querySelector(".ts");b.onclick=function(){b.disabled=true;b.textContent="보내는 중…";
   navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription()}).then(function(s){return hlApi("apiPushTest",[k,s?s.endpoint:""])})
   .then(function(j){b.textContent=(j&&j.msg)||"보냈어요";setTimeout(function(){pb.className="hide"},8000)}).catch(function(){b.disabled=false;b.textContent="다시 눌러 주세요"})};
  setTimeout(function(){if(pb.className==="ok"&&!b.disabled)pb.className="hide"},30000)}
 function turnOn(btn){if(btn){btn.disabled=true;btn.textContent="켜는 중…"}
  Notification.requestPermission().then(function(p){if(p!=="granted")throw new Error("deny");return Promise.all([navigator.serviceWorker.ready,hlApi("apiPushKey",[k])])})
  .then(function(v){if(!v[1]||!v[1].ok)throw new Error("key");return v[0].pushManager.getSubscription().then(function(s){return s||v[0].pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uU8(v[1].key)})})})
  .then(save).then(function(j){if(!j||!j.ok)throw new Error("save");if(btn)okBar()})
  .catch(function(e){if(Notification.permission==="denied")offBar();else bar('<div class="t">알림을 켜지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.<br><button class="on">다시 켜기</button></div>',"in")})}
 if(Notification.permission==="denied"){if(!dismissed())offBar();return}
 navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription()}).then(function(s){
  if(Notification.permission==="granted"){if(!s){turnOn(null);return}var sv="";try{sv=localStorage.getItem("hl_push_ep")||""}catch(e){}if(sv!==s.endpoint)save(s);return}   /* 이미 켜진 기기는 조용히 등록만 맞춘다 */
  if(dismissed())return;
  bar('<div class="t">🔔 <b>9시 체크 알림 받기</b><br>근무일 아침 9시에 아직 건강 체크를 안 한 분이 있으면 이 기기에 알림이 울려요.<br><button class="on">알림 켜기</button></div>',"in");
 }).catch(function(){});
}
/* ---------- w5: 포스기(태블릿 화면) 9시 말소리 안내. 09:00에 체크 전 인원이 있으면 이름을 불러 소리 내어 알린다 ---------- */
function sayInit(k){
 if(!("speechSynthesis" in window))return;
 var sv=document.getElementById("sv"),box=document.getElementById("say");
 function act(){try{return !navigator.userActivation||navigator.userActivation.hasBeenActive}catch(e){return true}}
 function voice(){var vs=speechSynthesis.getVoices().filter(function(v){return /^ko/i.test(v.lang)});return vs.filter(function(v){return /Google/.test(v.name)})[0]||vs[0]||null}
 function chime(){try{var C=window.AudioContext||window.webkitAudioContext,c=new C(),t=c.currentTime;[880,660,880,660].forEach(function(f,i){var o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.0001,t+i*0.35);g.gain.exponentialRampToValueAtTime(0.6,t+i*0.35+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.35+0.32);o.start(t+i*0.35);o.stop(t+i*0.35+0.34)})}catch(e){}}
 function speak(txt,times){speechSynthesis.cancel();for(var i=0;i<times;i++){var u=new SpeechSynthesisUtterance(txt);u.lang="ko-KR";var v=voice();if(v)u.voice=v;u.rate=0.95;u.volume=1;speechSynthesis.speak(u)}}
 function show(html,ms){box.innerHTML=html;box.classList.remove("hide");setTimeout(function(){box.classList.add("hide")},ms)}
 function announce(miss){var txt="건강 체크 안내입니다. 아직 건강 체크를 안 한 분이 "+miss.length+"명 있어요. "+miss.join(" 님, ")+" 님, 지금 건강 체크해 주세요.";
  show("⏰ 9시 건강 체크 안내<br>체크 전: "+miss.join(" · ")+"<br><small style='font-size:18px'>노란 카드를 눌러 체크해 주세요</small>",90000);
  chime();setTimeout(function(){speak(txt,2)},1600)}
 sv.onclick=function(){chime();setTimeout(function(){speak("9시 건강 체크 안내 소리가 잘 나옵니다. 아침 9시에 체크 안 한 분이 있으면 이렇게 이름을 불러 드려요.",1)},1600);sv.classList.add("hide")};
 function syncBtn(){sv.classList.toggle("hide",act())}
 syncBtn();setInterval(syncBtn,5000);
 try{speechSynthesis.getVoices()}catch(e){}
 setInterval(function(){var n=new Date(Date.now()+9*3600e3),d=n.toISOString().slice(0,10),hm=n.toISOString().slice(11,16);
  if(hm<"09:00"||hm>"09:05")return;var key="hl_say_"+d;try{if(localStorage.getItem(key))return;localStorage.setItem(key,"1")}catch(e){}
  hlApi("apiMissNow",[k]).then(function(j){if(j&&j.ok&&!j.rest&&j.miss&&j.miss.length)announce(j.miss)}).catch(function(){try{localStorage.removeItem(key)}catch(e){}})},20000);
}
/* ---------- 새 버전 확인: GitHub Pages가 화면을 최대 10분 저장본으로 줄 때 ---------- */
function verCheck(){try{fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
 if(!j||!j.v||j.v===WRAP_VER)return;var key="hl_reload_"+j.v;if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,"1");
 var u=new URL(location.href);u.searchParams.set("v",j.v);location.replace(u.toString())}).catch(function(){})}catch(e){}}
</script><script>/* end */
</script></body></html>
