<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>종사자 건강상태 확인 일지</title>
<style>
html,body{margin:0;height:100%;background:#eef0f6;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.fb{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:9;height:44px;min-width:44px;padding:0 14px;border:0;border-radius:22px;background:rgba(30,41,59,.72);color:#fff;font-size:15px;font-weight:700;cursor:pointer;opacity:.75}
.fb:active{opacity:1}
#msg{padding:40px 20px;text-align:center;line-height:1.7;color:#334}
.hide{display:none}
</style></head><body>
<div id="msg" class="hide">잘못된 링크입니다.<br>팀장에게 받은 링크로 다시 열어 주세요.</div>
<iframe id="fr" class="hide" allow="fullscreen" title="건강상태확인일지"></iframe>
<button class="fb hide" id="bFs">⛶ 화면 채우기</button>
<button class="fb hide" id="bEx" style="background:rgba(200,40,40,.85);opacity:1">✕ 채우기 취소</button>
<script>
(function(){
  var EXEC="https://script.google.com/macros/s/AKfycbzNl5rHzO50ma6wfpor9ScTccQkmXTviCfofLdq0E0EV3n1yRaA1lplrtoOgMfTPF0pDQ/exec";
  var q=new URLSearchParams(location.search),k=q.get("k")||"",m=q.get("m")||"tablet";
  if(!/^[A-Za-z0-9_-]{6,60}$/.test(k)){document.getElementById("msg").classList.remove("hide");return}
  if(["admin","tablet","phone"].indexOf(m)<0)m="tablet";
  var fr=document.getElementById("fr");fr.src=EXEC+"?k="+encodeURIComponent(k)+"&m="+m;fr.classList.remove("hide");
  var bFs=document.getElementById("bFs"),bEx=document.getElementById("bEx"),de=document.documentElement;
  var can=!!(de.requestFullscreen||de.webkitRequestFullscreen);
  function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
  function sync(){bFs.classList.toggle("hide",!can||isFs());bEx.classList.toggle("hide",!isFs())}
  bFs.onclick=function(){try{(de.requestFullscreen||de.webkitRequestFullscreen).call(de)}catch(e){}};
  bEx.onclick=function(){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}};
  document.addEventListener("fullscreenchange",sync);document.addEventListener("webkitfullscreenchange",sync);
  sync();
})();
</script></body></html>
